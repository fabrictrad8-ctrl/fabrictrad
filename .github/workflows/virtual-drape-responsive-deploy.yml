name: Virtual drape responsive UI deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/app/product-detail/page.tsx'
      - 'src/app/product-detail/virtual-drape-responsive.module.css'
      - 'src/app/product-detail/components/HybridVirtualDrapeStudio.tsx'
      - 'src/app/product-detail/components/InteractiveFabricMannequin3D.tsx'
      - '.github/workflows/virtual-drape-responsive-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: fabrictrad-virtual-drape-responsive-deploy
  cancel-in-progress: true

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '2'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Validate responsive drape code
        run: |
          npm run type-check
          npx eslint src/app/product-detail/page.tsx src/app/product-detail/components/HybridVirtualDrapeStudio.tsx src/app/product-detail/components/InteractiveFabricMannequin3D.tsx

      - name: Build production Cloudflare Worker
        run: npm run build:sites

      - name: Deploy responsive drape UI
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars

      - name: Verify live product page and AI route
        id: live-check
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            product_http=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/product.html --write-out '%{http_code}' 'https://fabrictrad.com/product-detail?id=seller-5414877f-663f-4bbb-acd9-ad4c2a60580e' || true)
            ai_http=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/drape-status.json --write-out '%{http_code}' 'https://fabrictrad.com/api/ai/drape-on' || true)
            if [ "$product_http" = 200 ] && [ "$ai_http" = 200 ] && grep -q '"configured":true' /tmp/drape-status.json && grep -q 'OpenAI GPT Image' /tmp/drape-status.json; then
              ready=true
              break
            fi
            sleep 8
          done
          [ "$ready" = true ] || { echo "Product HTTP: ${product_http:-none}; AI HTTP: ${ai_http:-none}"; cat /tmp/drape-status.json || true; exit 1; }
          echo 'Responsive product page is live and the OpenAI virtual drape route remains configured.'

      - name: Publish responsive deployment status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Responsive virtual drape UI built, deployed and live-checked'
          else
            state=failure
            description='Responsive virtual drape UI deploy or live check failed'
          fi
          payload=$(python - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'fabrictrad/virtual-drape-responsive','description':sys.argv[2]}))
          PY
          )
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
