# FabricTrad's live Shopify storefront calls the authenticated Supabase ai-drape Edge Function.
# This monitor verifies the production security boundary and repository cutover contract without
# fabricating a buyer session or consuming paid image-generation quota.
name: Flagship Virtual Drape security contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/flagship-virtual-drape-live.yml'
      - 'src/app/api/ai/drape-on/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/flagship-virtual-drape-live.yml'
      - 'src/app/api/ai/drape-on/**'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  statuses: write

concurrency:
  group: fabrictrad-flagship-virtual-drape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-drape-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository cutover contract
        shell: bash
        run: |
          set -euo pipefail
          route='src/app/api/ai/drape-on/route.ts'
          test -f "$route"
          grep -q "EDGE_FUNCTION = 'ai-drape'" "$route"
          grep -q 'Buyer authentication is required' "$route"
          grep -q '/functions/v1/' "$route"
          if grep -q 'fabrictrad_demo_role' "$route"; then
            echo '::error::Legacy demo-cookie authentication is present in the AI Drape route.'
            exit 1
          fi
          if grep -q 'DEMO_COOKIE_NAME' "$route"; then
            echo '::error::Legacy demo-cookie constant is present in the AI Drape route.'
            exit 1
          fi

      - name: Verify live AI Drape rejects unauthenticated generation
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://rdhfwlzhcvwjhkxhhpoo.supabase.co/functions/v1/ai-drape'
          http=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/ai-drape.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"subjectMode":"ai_model","modelGender":"woman","garmentId":"kurta"}' \
            "$endpoint" || true)
          echo "AI Drape unauthenticated probe: HTTP ${http}"
          cat /tmp/ai-drape.json || true
          [ "$http" = '401' ]

      - name: Verify canonical Shopify storefront is reachable
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --location --output /tmp/storefront.html --write-out '%{http_code}' \
            https://www.fabrictrad.com/ || true)
          echo "Storefront HTTP ${http}"
          [ "$http" = '200' ]

      - name: Publish flagship status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Authenticated Supabase AI Drape cutover contract verified'
          else
            state=failure
            description='AI Drape security/cutover contract failed'
          fi
          payload=$(python - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'fabrictrad/flagship-drape-live','description':sys.argv[2]}))
          PY
          )
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
