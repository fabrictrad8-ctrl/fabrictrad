name: Virtual Drape live access checks

on:
  workflow_dispatch:
    inputs:
      generate:
        description: 'Run one paid image generation with the configured test buyer session'
        type: boolean
        default: false
      product_id:
        description: 'Approved listing ID for the optional paid generation'
        type: string
        required: false
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/app/api/ai/drape-on/**'
      - 'scripts/check-drape-live.mjs'
      - '.github/workflows/flagship-virtual-drape-live.yml'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  access-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify access controls and optionally generate an image
        env:
          RUN_PAID_DRAPE_GENERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.generate && 'true' || 'false' }}
          DRAPE_TEST_PRODUCT_ID: ${{ inputs.product_id }}
          DRAPE_TEST_BUYER_COOKIE: ${{ secrets.DRAPE_TEST_BUYER_COOKIE }}
        run: node scripts/check-drape-live.mjs
