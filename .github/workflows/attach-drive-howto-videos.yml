name: Attach FabricTrad Drive how-to videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-drive-howto-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attach role-specific Drive walkthroughs
        run: python3 scripts/attach-drive-howto-videos.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps
      - name: Type-check
        run: npm run type-check
      - name: Lint how-to page
        run: npx eslint src/app/how-to-use/page.tsx
      - name: Commit verified page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FabricTrad Release Bot'
          git config user.email 'fabrictrad8@gmail.com'
          git add src/app/how-to-use/page.tsx
          if git diff --cached --quiet; then
            echo 'No page changes required.'
            exit 0
          fi
          git commit -m 'feat: attach buyer and seller Drive walkthrough videos'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
