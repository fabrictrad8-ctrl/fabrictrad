name: Virtual drape deployed recheck

on:
  push:
    branches: [main]
    paths: ['.github/workflows/virtual-drape-recheck.yml']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run listing-backed generation
        id: drape
        continue-on-error: true
        shell: bash
        run: |
          cat >/tmp/request.json <<'JSON'
          {
            "productId":"5414877f-663f-4bbb-acd9-ad4c2a60580e",
            "modelImage":"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?fm=jpg&w=768&q=85",
            "garmentId":"shirt",
            "fit":"regular",
            "styleName":"FabricTrad deployed recheck"
          }
          JSON
          http=$(curl --silent --show-error --connect-timeout 15 --max-time 300 --output /tmp/result.json --write-out '%{http_code}' --header 'Content-Type: application/json' --header 'Cookie: fabrictrad_demo_role=buyer' --data @/tmp/request.json https://fabrictrad.com/api/ai/drape-on || true)
          printf '%s' "$http" >/tmp/http.txt
          echo "HTTP ${http}"
          if [ "$http" != 200 ]; then cat /tmp/result.json || true; exit 1; fi
          python - <<'PY'
          import base64,json,pathlib
          p=json.load(open('/tmp/result.json'))
          image=str(p.get('image') or '')
          assert p.get('provider')=='OpenAI',p
          assert image.startswith('data:image/'),p.keys()
          raw=base64.b64decode(image.split(',',1)[1])
          assert len(raw)>20000,len(raw)
          pathlib.Path('/tmp/drape-proof.jpg').write_bytes(raw)
          pathlib.Path('/tmp/success.json').write_text(json.dumps({'provider':p.get('provider'),'model':p.get('model'),'providerRequestId':p.get('providerRequestId'),'fabricReference':p.get('fabricReference'),'imageBytes':len(raw)},indent=2))
          PY
      - name: Upload proof
        if: steps.drape.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fabrictrad-listing-drape-proof
          path: |
            /tmp/drape-proof.jpg
            /tmp/success.json
          retention-days: 7
      - name: Record result
        if: always()
        env:
          OUTCOME: ${{ steps.drape.outcome }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          def text(p):
            try:return pathlib.Path(p).read_text()
            except:return None
          def safe(p):
            try:
              x=json.loads(pathlib.Path(p).read_text());x.pop('image',None);return x
            except:return None
          payload={'sourceCommit':os.environ.get('GITHUB_SHA'),'outcome':os.environ.get('OUTCOME'),'http':text('/tmp/http.txt'),'response':safe('/tmp/result.json'),'success':safe('/tmp/success.json')}
          pathlib.Path('.github/deployments').mkdir(parents=True,exist_ok=True)
          pathlib.Path('.github/deployments/virtual-drape-recheck-status.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/virtual-drape-recheck-status.json
          git commit -m 'ci: record virtual drape recheck [skip deploy] [skip validation] [skip integration audit]' || exit 0
          git push origin HEAD:main
