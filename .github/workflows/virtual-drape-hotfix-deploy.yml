# Dedicated deployment path for FabricTrad's two-option AI Virtual Drape.
name: Virtual drape hotfix deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/app/api/ai/drape-on/**'
      - 'src/lib/supabase/admin.ts'
      - 'src/app/product-detail/page.tsx'
      - 'src/app/product-detail/virtual-drape-responsive.module.css'
      - 'src/app/product-detail/components/ModernFabricDrapeViewer.tsx'
      - 'src/app/product-detail/components/FlagshipVirtualDrapeStudio.tsx'
      - '.github/workflows/virtual-drape-hotfix-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: fabrictrad-virtual-drape-hotfix
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '4'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify Cloudflare authentication
        id: cloudflare
        run: npx wrangler whoami

      - name: Validate flagship drape code
        id: validation
        shell: bash
        run: |
          set -o pipefail
          {
            npm run type-check
            npx eslint \
              src/app/api/ai/drape-on/route.ts \
              src/lib/supabase/admin.ts \
              src/app/product-detail/page.tsx \
              src/app/product-detail/components/ModernFabricDrapeViewer.tsx \
              src/app/product-detail/components/FlagshipVirtualDrapeStudio.tsx
          } 2>&1 | tee /tmp/drape-validation.log

      - name: Build OpenNext Worker
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build:sites 2>&1 | tee /tmp/drape-build.log

      - name: Deploy Virtual Drape update
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.jsonc --keep-vars 2>&1 | tee /tmp/drape-deploy.log

      - name: Verify live API readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            ai_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/drape-status.json --write-out '%{http_code}' https://fabrictrad.com/api/ai/drape-on || true)
            if [ "$ai_status" = 200 ]; then
              python - <<'PY' && ready=true && break || true
          import json
          p=json.load(open('/tmp/drape-status.json'))
          ok=(
            p.get('configured') is True and
            p.get('provider')=='OpenAI GPT Image' and
            p.get('apiUsed')=='OpenAI Images API' and
            p.get('credentialConfigured') is True and
            p.get('credentialLocation')=='server_only' and
            p.get('model')=='gpt-image-2' and
            {'own_photo','ai_model'}.issubset(set(p.get('subjectModes') or []))
          )
          raise SystemExit(0 if ok else 1)
          PY
            fi
            sleep 8
          done
          [ "$ready" = true ] || { cat /tmp/drape-status.json || true; exit 1; }

      - name: Verify own-photo OpenAI drape
        id: own_photo
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/own.json <<'JSON'
          {"productId":"5414877f-663f-4bbb-acd9-ad4c2a60580e","subjectMode":"own_photo","modelImage":"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?fm=jpg&w=768&q=85","garmentId":"shirt","fit":"regular"}
          JSON
          http=$(curl --silent --show-error --connect-timeout 15 --max-time 300 --output /tmp/own-result.json --write-out '%{http_code}' --header 'Content-Type: application/json' --header 'Cookie: fabrictrad_demo_role=buyer' --data @/tmp/own.json https://fabrictrad.com/api/ai/drape-on || true)
          [ "$http" = 200 ] || { cat /tmp/own-result.json || true; exit 1; }
          python - <<'PY'
          import base64,json
          p=json.load(open('/tmp/own-result.json'))
          assert p.get('provider')=='OpenAI',p
          assert p.get('apiUsed')=='OpenAI Images API',p
          assert p.get('model')=='gpt-image-2',p
          assert p.get('subjectMode')=='own_photo',p
          assert str(p.get('providerRequestId') or '').startswith('req_'),p
          image=str(p.get('image') or '')
          assert image.startswith('data:image/jpeg;base64,'),p.keys()
          assert len(base64.b64decode(image.split(',',1)[1]))>50000
          PY

      - name: Verify AI-model OpenAI drape
        id: ai_model
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/model.json <<'JSON'
          {"productId":"5414877f-663f-4bbb-acd9-ad4c2a60580e","subjectMode":"ai_model","modelGender":"woman","garmentId":"shirt","fit":"regular"}
          JSON
          http=$(curl --silent --show-error --connect-timeout 15 --max-time 300 --output /tmp/model-result.json --write-out '%{http_code}' --header 'Content-Type: application/json' --header 'Cookie: fabrictrad_demo_role=buyer' --data @/tmp/model.json https://fabrictrad.com/api/ai/drape-on || true)
          [ "$http" = 200 ] || { cat /tmp/model-result.json || true; exit 1; }
          python - <<'PY'
          import base64,json
          p=json.load(open('/tmp/model-result.json'))
          assert p.get('provider')=='OpenAI',p
          assert p.get('apiUsed')=='OpenAI Images API',p
          assert p.get('model')=='gpt-image-2',p
          assert p.get('subjectMode')=='ai_model',p
          assert p.get('modelGender')=='woman',p
          assert str(p.get('providerRequestId') or '').startswith('req_'),p
          image=str(p.get('image') or '')
          assert image.startswith('data:image/jpeg;base64,'),p.keys()
          assert len(base64.b64decode(image.split(',',1)[1]))>50000
          PY

      - name: Record deployment diagnostic
        if: always()
        continue-on-error: true
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CLOUDFLARE_OUTCOME: ${{ steps.cloudflare.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          OWN_OUTCOME: ${{ steps.own_photo.outcome }}
          MODEL_OUTCOME: ${{ steps.ai_model.outcome }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          def tail(path,n=80):
              p=pathlib.Path(path)
              return '\n'.join(p.read_text(errors='replace').splitlines()[-n:]) if p.exists() else ''
          def json_file(path):
              p=pathlib.Path(path)
              if not p.exists(): return None
              try: return json.loads(p.read_text())
              except Exception: return {'raw':p.read_text(errors='replace')[-2000:]}
          payload={
            'sourceCommit':os.environ.get('GITHUB_SHA'),
            'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'install':os.environ.get('INSTALL_OUTCOME'),
            'cloudflare':os.environ.get('CLOUDFLARE_OUTCOME'),
            'validation':os.environ.get('VALIDATION_OUTCOME'),
            'build':os.environ.get('BUILD_OUTCOME'),
            'deploy':os.environ.get('DEPLOY_OUTCOME'),
            'readiness':os.environ.get('READINESS_OUTCOME'),
            'ownPhotoE2E':os.environ.get('OWN_OUTCOME'),
            'aiModelE2E':os.environ.get('MODEL_OUTCOME'),
            'validationTail':tail('/tmp/drape-validation.log'),
            'buildTail':tail('/tmp/drape-build.log'),
            'deployTail':tail('/tmp/drape-deploy.log'),
            'liveReadiness':json_file('/tmp/drape-status.json'),
            'ownPhotoResult':json_file('/tmp/own-result.json'),
            'aiModelResult':json_file('/tmp/model-result.json'),
          }
          for key in ('ownPhotoResult','aiModelResult'):
              if isinstance(payload.get(key),dict):
                  image=payload[key].pop('image',None)
                  if isinstance(image,str): payload[key]['imageReturned']=image.startswith('data:image/')
          pathlib.Path('.github/deployments/flagship-drape-deploy-status.json').write_text(json.dumps(payload,indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/deployments/flagship-drape-deploy-status.json
          git diff --cached --quiet || git commit -m 'ci: record flagship drape deployment [skip deploy] [skip validation] [skip integration audit]'
          git push

      - name: Publish hotfix status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Both OpenAI Virtual Drape modes deployed and verified'; else state=failure; description='Virtual Drape deploy or live AI verification failed'; fi
          payload=$(python - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'fabrictrad/virtual-drape-hotfix','description':sys.argv[2]}))
          PY
          )
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
