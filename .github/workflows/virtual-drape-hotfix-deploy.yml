name: Virtual drape hotfix deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/app/api/ai/drape-on/**'
      - 'src/lib/supabase/admin.ts'
      - '.github/workflows/virtual-drape-hotfix-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: fabrictrad-virtual-drape-hotfix
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '4'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Validate drape hotfix
        run: |
          npm run type-check
          npx eslint src/app/api/ai/drape-on/route.ts src/lib/supabase/admin.ts

      - name: Build OpenNext Worker
        run: npm run build:sites

      - name: Deploy drape hotfix
        run: npx wrangler deploy --config wrangler.jsonc --keep-vars

      - name: Verify deployed OpenAI drape and listing path
        id: live-drape
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/drape-status.json --write-out '%{http_code}' https://fabrictrad.com/api/ai/drape-on || true)
            if [ "$status" = 200 ] && grep -q '"configured":true' /tmp/drape-status.json && grep -q 'OpenAI GPT Image' /tmp/drape-status.json; then ready=true; break; fi
            sleep 8
          done
          [ "$ready" = true ] || { cat /tmp/drape-status.json || true; exit 1; }

          cat >/tmp/request.json <<'JSON'
          {
            "productId":"5414877f-663f-4bbb-acd9-ad4c2a60580e",
            "modelImage":"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?fm=jpg&w=768&q=85",
            "garmentId":"shirt",
            "fit":"regular",
            "styleName":"FabricTrad deployed listing E2E"
          }
          JSON
          http=$(curl --silent --show-error --connect-timeout 15 --max-time 300 --output /tmp/result.json --write-out '%{http_code}' --header 'Content-Type: application/json' --header 'Cookie: fabrictrad_demo_role=buyer' --data @/tmp/request.json https://fabrictrad.com/api/ai/drape-on || true)
          echo "Generation HTTP ${http}"
          [ "$http" = 200 ] || { cat /tmp/result.json || true; exit 1; }
          python - <<'PY'
          import base64,json
          p=json.load(open('/tmp/result.json'))
          assert p.get('provider')=='OpenAI',p
          assert p.get('model')=='gpt-image-2',p
          image=str(p.get('image') or '')
          assert image.startswith('data:image/'),p.keys()
          raw=base64.b64decode(image.split(',',1)[1])
          assert len(raw)>20000,len(raw)
          fabric=p.get('fabricReference') or {}
          assert fabric.get('name')=='hahaha',fabric
          assert int(fabric.get('imageCount') or 0)>=1,fabric
          print(json.dumps({'provider':p.get('provider'),'model':p.get('model'),'providerRequestId':p.get('providerRequestId'),'fabricReference':fabric,'imageBytes':len(raw)},indent=2))
          PY

      - name: Publish hotfix status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live listing-backed OpenAI virtual drape generated an image'; else state=failure; description='Virtual drape hotfix deploy or live generation failed'; fi
          payload=$(python - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'fabrictrad/virtual-drape-hotfix','description':sys.argv[2]}))
          PY
          )
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
