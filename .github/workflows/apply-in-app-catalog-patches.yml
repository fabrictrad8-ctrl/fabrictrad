name: Apply in-app catalog source patches

on:
  push:
    branches:
      - agent/in-app-catalog-studio

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-overhaul-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/in-app-catalog-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source patches
        run: node scripts/apply-in-app-catalog-patches.mjs
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FabricTrad Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/login/EmailOtpLoginClient.tsx \
            src/app/seller-dashboard/components/SellerDashboardLayout.tsx \
            src/app/seller-dashboard/components/SellerInventory.tsx \
            src/app/seller-dashboard/components/SellerVariantCatalog.tsx
          if git diff --cached --quiet; then
            echo 'No source changes were required.'
            exit 0
          fi
          git commit -m 'Wire in-app catalog studio and fast login [catalog-overhaul-applied]'
          git push origin HEAD:agent/in-app-catalog-studio
