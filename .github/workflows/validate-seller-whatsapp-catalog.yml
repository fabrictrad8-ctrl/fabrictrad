name: Validate seller WhatsApp catalogue

on:
  push:
    branches:
      - agent/whatsapp-seller-catalog-20260904
    paths:
      - '.github/workflows/validate-seller-whatsapp-catalog.yml'
      - 'src/lib/whatsappSellerCatalog.ts'
      - 'src/app/api/seller/contact-identity/route.ts'
      - 'src/app/api/integrations/whatsapp/webhook/route.ts'
      - 'src/app/api/account/enable-selling/route.ts'
      - 'src/app/seller-registration/components/SellerRegistrationFlowV2.tsx'
      - 'src/app/seller-dashboard/components/WhatsAppCatalogPanel.tsx'
      - 'scripts/apply-seller-whatsapp-catalog-patch.py'
      - 'scripts/fix-seller-whatsapp-media-conflict.py'
      - 'scripts/patch-whatsapp-regression-for-seller.py'
      - 'scripts/patch-whatsapp-catalog-panel-v2.py'
      - 'scripts/verify-mobile-whatsapp.mjs'
      - 'supabase/migrations/20260904080000_seller_whatsapp_catalog_identity.sql'
      - 'supabase/migrations/20260904080500_buyer_profile_seller_identity_guard.sql'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply seller catalogue runtime patch
        run: |
          python3 scripts/apply-seller-whatsapp-catalog-patch.py
          python3 scripts/fix-seller-whatsapp-media-conflict.py
          python3 scripts/patch-whatsapp-regression-for-seller.py
          python3 scripts/patch-whatsapp-catalog-panel-v2.py

      - name: Verify required implementation markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'tryHandleSellerCatalogMessage' src/app/api/integrations/whatsapp/webhook/route.ts
          grep -Fq 'sellerHandled = await ingestSellerMessage' src/app/api/integrations/whatsapp/webhook/route.ts
          grep -Fq 'sellerWhatsapp' src/app/seller-registration/components/SellerRegistrationFlowV2.tsx
          grep -Fq 'seller_identity_conflicts' src/app/api/account/enable-selling/route.ts
          grep -Fq 'SELLER_CATALOG_FORMAT_MESSAGE' src/lib/whatsappSellerCatalog.ts
          grep -Fq "onConflict: 'storage_path'" src/lib/whatsappSellerCatalog.ts
          grep -Fq 'whatsapp_seller_catalog_sessions' supabase/migrations/20260904080000_seller_whatsapp_catalog_identity.sql
          grep -Fq 'enforce_user_profile_seller_identity_separation' supabase/migrations/20260904080500_buyer_profile_seller_identity_guard.sql
          grep -Fq "const sellerCatalog = 'src/lib/whatsappSellerCatalog.ts'" scripts/verify-mobile-whatsapp.mjs
          grep -Fq 'Save seller WhatsApp identity' src/app/seller-dashboard/components/WhatsAppCatalogPanel.tsx
          grep -Fq 'Predefined product format' src/app/seller-dashboard/components/WhatsAppCatalogPanel.tsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Type-check
        run: npm run type-check

      - name: Lint changed runtime
        run: npx eslint src/lib/whatsappSellerCatalog.ts src/app/api/seller/contact-identity/route.ts src/app/api/integrations/whatsapp/webhook/route.ts src/app/api/account/enable-selling/route.ts src/app/seller-registration/components/SellerRegistrationFlowV2.tsx src/app/seller-dashboard/components/WhatsAppCatalogPanel.tsx scripts/verify-mobile-whatsapp.mjs

      - name: Run WhatsApp regression verifier
        run: npm run verify:whatsapp

      - name: Build Cloudflare/OpenNext package
        run: npm run build:sites

      - name: Commit validated patch to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FabricTrad Release Bot'
          git config user.email 'fabrictrad8@gmail.com'
          git add src/lib/whatsappSellerCatalog.ts src/app/api/seller/contact-identity/route.ts src/app/api/integrations/whatsapp/webhook/route.ts src/app/api/account/enable-selling/route.ts src/app/seller-registration/components/SellerRegistrationFlowV2.tsx src/app/seller-dashboard/components/WhatsAppCatalogPanel.tsx scripts/verify-mobile-whatsapp.mjs supabase/migrations/20260904080000_seller_whatsapp_catalog_identity.sql supabase/migrations/20260904080500_buyer_profile_seller_identity_guard.sql
          if git diff --cached --quiet; then
            echo 'No runtime patch changes to commit.'
            exit 0
          fi
          git commit -m 'feat: seller WhatsApp products from strict format [skip deploy]'
          git pull --rebase origin agent/whatsapp-seller-catalog-20260904
          git push origin HEAD:agent/whatsapp-seller-catalog-20260904
