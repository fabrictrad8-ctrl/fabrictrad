name: Apply strict buyer and seller workspace separation

on:
  push:
    branches:
      - agent/strict-role-workspaces
    paths:
      - '.github/workflows/strict-role-workspace-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strict-role-workspaces
          fetch-depth: 0

      - name: Remove cross-workspace navigation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          seller = 'src/app/seller-dashboard/components/SellerDashboardLayout.tsx'
          replace_once(
              seller,
              '''        <Link href="/marketplace" className="flex min-h-10 items-center gap-3 rounded-lg px-2.5 text-sm font-650 text-foreground/80 hover:bg-card">\n          <Icon name="ShoppingBagIcon" size={18} className="text-muted-foreground" /> Buy fabrics\n        </Link>\n        <Link href="/buyer-dashboard" className="flex min-h-10 items-center gap-3 rounded-lg px-2.5 text-sm font-650 text-foreground/80 hover:bg-card">\n          <Icon name="UserCircleIcon" size={18} className="text-muted-foreground" /> Buyer workspace\n        </Link>\n''',
              '',
          )

          buyer = 'src/app/buyer-dashboard/components/ModernBuyerDashboardLayout.tsx'
          replace_once(
              buyer,
              "  const canSell = Boolean(profile?.can_sell || profile?.role === 'seller');\n",
              '',
          )
          replace_once(
              buyer,
              '''        <Link\n          href={canSell ? '/seller-dashboard' : '/seller-registration'}\n          className="flex min-h-10 items-center gap-3 rounded-lg px-2.5 text-sm font-650 text-foreground/80 hover:bg-card"\n        >\n          <Icon name="BuildingStorefrontIcon" size={18} className="text-muted-foreground" />\n          {canSell ? 'Open seller workspace' : 'Activate selling'}\n        </Link>\n''',
              '',
          )

          Path('.github/workflows/strict-role-workspace-patch.yml').unlink()

      - name: Commit role-separated navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/seller-dashboard/components/SellerDashboardLayout.tsx
          git add src/app/buyer-dashboard/components/ModernBuyerDashboardLayout.tsx
          git add -u .github/workflows/strict-role-workspace-patch.yml
          git commit -m 'fix: remove buyer seller workspace switching'
          git push origin HEAD:agent/strict-role-workspaces
