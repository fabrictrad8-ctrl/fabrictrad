name: Inspect WhatsApp catalogue upload

on:
  pull_request:
  push:
    branches:
      - agent/diagnose-whatsapp-upload

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List repository paths relevant to WhatsApp upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/trees/${GITHUB_SHA}?recursive=1" \
            > /tmp/tree.json
          echo MATCHING_PATHS
          jq -r '.tree[].path' /tmp/tree.json | grep -Ei 'whatsapp|catalog|seller-dashboard|webhook' | sort
          echo API_PATHS
          jq -r '.tree[].path' /tmp/tree.json | grep '^src/app/api/' | sort
