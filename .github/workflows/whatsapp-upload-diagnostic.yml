name: Inspect WhatsApp catalogue upload

on:
  pull_request:
  push:
    branches:
      - agent/diagnose-whatsapp-upload

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: List relevant files
        run: |
          echo MATCHING_FILES
          grep -RIlE 'WhatsApp|whatsapp|Upload Catalog|AI Parser|FabricTradUploadBot' src supabase scripts 2>/dev/null | sort || true
          echo API_ROUTES
          find src/app/api -maxdepth 8 -type f | sort || true
          echo SELLER_FILES
          find src/app/seller-dashboard -maxdepth 6 -type f | sort || true
