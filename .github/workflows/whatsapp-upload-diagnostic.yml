name: Inspect WhatsApp catalogue upload

on:
  pull_request:
  push:
    branches:
      - agent/diagnose-whatsapp-upload

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List database and upload implementation paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/trees/${GITHUB_SHA}?recursive=1" \
            > /tmp/tree.json
          echo MIGRATIONS
          jq -r '.tree[].path' /tmp/tree.json | grep '^supabase/migrations/.*\.sql$' | sort
          echo SUPABASE_HELPERS
          jq -r '.tree[].path' /tmp/tree.json | grep '^src/lib/supabase/' | sort
          echo UPLOAD_RELATED
          jq -r '.tree[].path' /tmp/tree.json | grep -Ei 'storage|upload|product' | head -n 150
