name: FabricTrad integration readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check external integration readiness
        shell: bash
        run: |
          set -u -o pipefail
          base_url='https://fabrictrad.com'
          warnings=0
          failures=0

          fail() {
            echo "::error::$1"
            failures=$((failures + 1))
          }

          warn() {
            echo "::warning::$1"
            warnings=$((warnings + 1))
          }

          fetch_json() {
            local name="$1"
            local path="$2"
            local output="$3"
            local expected_status="${4:-200}"
            local status
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$output" --write-out '%{http_code}' "$base_url$path" || true)
            echo "${name}: HTTP ${status} (expected ${expected_status})"
            if [ "$status" != "$expected_status" ]; then
              echo "${name} response:"
              head -c 1200 "$output" || true
              echo
              fail "${name} returned HTTP ${status}; expected ${expected_status}."
              return 1
            fi
            return 0
          }

          assert_cookie_cannot_unlock() {
            local role="$1"
            local route="$2"
            local expected="$3"
            local headers="/tmp/${role}-cookie.headers"
            local status
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --cookie "fabrictrad_demo_role=${role}" \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              --max-redirs 0 "$base_url$route" || true)
            if [ "$status" != '307' ] && [ "$status" != '308' ]; then
              fail "${role} stale demo cookie returned HTTP ${status}; expected a protected redirect."
              return
            fi
            if ! grep -qi "^location: .*${expected}" "$headers"; then
              cat "$headers" || true
              fail "${role} stale demo cookie redirected somewhere other than ${expected}."
            fi
          }

          fetch_json 'Google OAuth readiness' '/api/auth/google/status' /tmp/google.json || true
          fetch_json 'Razorpay authenticated readiness' '/api/razorpay/status' /tmp/razorpay.json || true
          fetch_json 'Shiprocket authenticated readiness' '/api/shiprocket/status?verify=1' /tmp/shiprocket.json || true
          fetch_json 'AI Drape readiness' '/api/ai/drape-on' /tmp/ai.json || true
          fetch_json '3D trial-room readiness' '/api/ai/trial-room/status' /tmp/trial-room.json || true
          fetch_json 'GSTIN readiness' '/api/gstin/status' /tmp/gstin.json || true
          fetch_json 'WhatsApp catalog readiness' '/api/whatsapp/status' /tmp/whatsapp.json || true

          if [ -s /tmp/google.json ]; then
            grep -q '"configured":true' /tmp/google.json || fail 'Google OAuth is not configured.'
          fi

          if [ -s /tmp/razorpay.json ]; then
            grep -q '"configured":true' /tmp/razorpay.json || fail 'Razorpay credentials are missing.'
            grep -q '"authenticated":true' /tmp/razorpay.json || fail 'Razorpay credentials do not authenticate with Razorpay.'
            grep -q '"mode":"live"' /tmp/razorpay.json || fail 'Razorpay is not using LIVE credentials in production.'
          fi

          if [ -s /tmp/shiprocket.json ]; then
            grep -q '"configured":true' /tmp/shiprocket.json || fail 'Shiprocket credentials are missing.'
            grep -q '"authenticated":true' /tmp/shiprocket.json || fail 'Shiprocket credentials do not authenticate with Shiprocket.'
            grep -q '"webhookConfigured":true' /tmp/shiprocket.json || fail 'Shiprocket webhook token is missing.'
          fi

          if [ -s /tmp/ai.json ] && ! grep -q '"configured":true' /tmp/ai.json; then
            fail 'AI Drape provider is not configured.'
          fi

          if [ -s /tmp/trial-room.json ] && ! grep -q '"threeDProviderConfigured":true' /tmp/trial-room.json; then
            warn 'True 3D trial-room architecture exists, but no dedicated 3D rendering provider is configured.'
          fi

          if [ -s /tmp/gstin.json ] && ! grep -q '"providerConfigured":true' /tmp/gstin.json; then
            warn 'GSTIN verification is using the official-manual review path.'
          fi

          if [ -s /tmp/whatsapp.json ] && ! grep -q '"configured":true' /tmp/whatsapp.json; then
            warn 'WhatsApp/Gupshup channel is installed but not fully configured in the live Worker yet.'
          fi

          webhook_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/razorpay-webhook.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'x-razorpay-signature: 00' --data '{}' \
            "$base_url/api/razorpay/webhook" || true)
          echo "Razorpay invalid-signature probe: HTTP ${webhook_status} (expected 400)"
          if [ "$webhook_status" != '400' ]; then
            head -c 1200 /tmp/razorpay-webhook.json || true
            echo
            fail "Razorpay webhook returned HTTP ${webhook_status}; expected 400."
          elif ! grep -qi 'invalid signature' /tmp/razorpay-webhook.json; then
            fail 'Razorpay webhook did not report invalid signature for a forged request.'
          fi

          whatsapp_webhook_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/whatsapp-webhook.out --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"type":"user-event","version":2,"app":"__fabrictrad_readiness_probe__","payload":{"type":"sandbox-start"}}' \
            "$base_url/api/integrations/whatsapp/webhook" || true)
          echo "WhatsApp public callback probe: HTTP ${whatsapp_webhook_status} (expected 204)"
          if [ "$whatsapp_webhook_status" != '204' ]; then
            head -c 1200 /tmp/whatsapp-webhook.out || true
            echo
            fail "WhatsApp public callback returned HTTP ${whatsapp_webhook_status}; expected 204."
          elif [ -s /tmp/whatsapp-webhook.out ]; then
            fail 'WhatsApp public callback returned a non-empty response body; Gupshup expects an empty 2xx acknowledgement.'
          fi

          assert_cookie_cannot_unlock buyer '/buyer-dashboard' 'login'
          assert_cookie_cannot_unlock seller '/seller-dashboard' 'login'
          assert_cookie_cannot_unlock admin '/admin-portal' 'admin-login'

          echo "Integration readiness completed with ${failures} failure(s) and ${warnings} non-blocking warning(s)."
          if [ "$failures" -gt 0 ]; then
            exit 1
          fi
