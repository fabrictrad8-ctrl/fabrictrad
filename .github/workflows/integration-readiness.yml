name: FabricTrad integration readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integration-readiness.yml'
      - '.github/workflows/flagship-virtual-drape-live.yml'
      - 'src/app/api/ai/drape-on/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/integration-readiness.yml'
      - '.github/workflows/flagship-virtual-drape-live.yml'
      - 'src/app/api/ai/drape-on/**'
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: read
  statuses: write

concurrency:
  group: fabrictrad-integration-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Shopify storefront and Supabase security boundaries
        shell: bash
        env:
          STOREFRONT_ROOT: https://fabrictrad.com
          STOREFRONT_WWW: https://www.fabrictrad.com
          SUPABASE_FUNCTIONS: https://rdhfwlzhcvwjhkxhhpoo.supabase.co/functions/v1
        run: |
          set -euo pipefail
          failures=0

          fail() {
            echo "::error::$1"
            failures=$((failures + 1))
          }

          probe_exact() {
            local name="$1"
            local method="$2"
            local url="$3"
            local expected="$4"
            local output="$5"
            local status
            if [ "$method" = 'POST' ]; then
              status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "$output" --write-out '%{http_code}' \
                --header 'Content-Type: application/json' --data '{}' "$url" || true)
            else
              status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "$output" --write-out '%{http_code}' "$url" || true)
            fi
            echo "${name}: HTTP ${status} (expected ${expected})"
            if [ "$status" != "$expected" ]; then
              head -c 1200 "$output" || true
              echo
              fail "${name} returned HTTP ${status}; expected ${expected}."
            fi
          }

          apex_headers=/tmp/apex.headers
          apex_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --dump-header "$apex_headers" --output /dev/null --write-out '%{http_code}' \
            --max-redirs 0 "$STOREFRONT_ROOT/" || true)
          echo "Apex storefront: HTTP ${apex_status}"
          case "$apex_status" in
            200) ;;
            301|302|307|308)
              grep -Eqi '^location: https://www\.fabrictrad\.com(/|\r?$)' "$apex_headers" \
                || fail 'fabrictrad.com does not redirect to the canonical www.fabrictrad.com storefront.'
              ;;
            *) fail "fabrictrad.com returned unexpected HTTP ${apex_status}." ;;
          esac

          www_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --location --output /tmp/www.html --write-out '%{http_code}' "$STOREFRONT_WWW/" || true)
          echo "Canonical storefront: HTTP ${www_status}"
          [ "$www_status" = '200' ] || fail "www.fabrictrad.com returned HTTP ${www_status}; expected 200."

          for fn in ai-drape marketplace-admin-data marketplace-admin-action marketplace-order-resolution shopify-seller-partial-refund shopify-product-sync; do
            probe_exact "Unauthenticated ${fn}" POST "$SUPABASE_FUNCTIONS/$fn" 401 "/tmp/${fn}.json"
          done

          probe_exact 'Retired legacy administrator OTP endpoint' POST "$SUPABASE_FUNCTIONS/generate-admin-otp" 410 /tmp/legacy-admin-otp.json
          grep -qi 'retired' /tmp/legacy-admin-otp.json || fail 'Retired administrator OTP endpoint did not return its retirement contract.'

          echo "Integration readiness completed with ${failures} failure(s)."
          if [ "$failures" -gt 0 ]; then
            exit 1
          fi

      - name: Publish production smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Shopify storefront and Supabase auth boundaries verified'
          else
            state=failure
            description='Shopify/Supabase production readiness probe failed'
          fi
          payload=$(python - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'fabrictrad/production-smoke','description':sys.argv[2]}))
          PY
          )
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
