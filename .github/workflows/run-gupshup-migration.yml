name: Run Gupshup production release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-gupshup-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GUPSHUP_API_KEY: ${{ secrets.GUPSHUP_API_KEY }}
      GUPSHUP_APP_NAME: ${{ secrets.GUPSHUP_APP_NAME }}
      GUPSHUP_SOURCE_NUMBER: '917977286898'
      GUPSHUP_WABA_ID: ${{ secrets.GUPSHUP_WABA_ID }}
      WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER: ${{ secrets.WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER }}
      WHATSAPP_TEMPLATE_PAYMENT_REMINDER: ${{ secrets.WHATSAPP_TEMPLATE_PAYMENT_REMINDER }}
      WHATSAPP_TEMPLATE_TRIAL_REMINDER: ${{ secrets.WHATSAPP_TEMPLATE_TRIAL_REMINDER }}
      WHATSAPP_TEMPLATE_DELIVERY_UPDATE: ${{ secrets.WHATSAPP_TEMPLATE_DELIVERY_UPDATE }}
      WHATSAPP_TEMPLATE_REVIEW_REQUEST: ${{ secrets.WHATSAPP_TEMPLATE_REVIEW_REQUEST }}
      WHATSAPP_TEMPLATE_POST_DELIVERY_FOLLOW_UP: ${{ secrets.WHATSAPP_TEMPLATE_POST_DELIVERY_FOLLOW_UP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, sync, deploy and verify Gupshup callback
        shell: bash
        run: bash scripts/deploy-gupshup-production.sh

# Rerun marker: OpenNext package presence is the release gate.
