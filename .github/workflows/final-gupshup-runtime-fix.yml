name: Finalize Gupshup conversation runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-gupshup-runtime-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final Gupshup runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block missing in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          # Provider: allow the app identity supplied by Gupshup on the inbound
          # event to be used for the reply, while retaining env as the preferred
          # configured value for proactive sends.
          replace_once(
              'src/lib/gupshupWhatsApp.ts',
              """async function postGupshupForm(\n  url: string,\n  destinationRaw: string,\n  extra: Record<string, string>\n) {\n  const apiKey = env('GUPSHUP_API_KEY');\n  const source = normalizeDestination(env('GUPSHUP_SOURCE_NUMBER'));\n  const appName = env('GUPSHUP_APP_NAME');\n""",
              """async function postGupshupForm(\n  url: string,\n  destinationRaw: string,\n  extra: Record<string, string>,\n  appNameOverride?: string | null\n) {\n  const apiKey = env('GUPSHUP_API_KEY');\n  const source = normalizeDestination(env('GUPSHUP_SOURCE_NUMBER'));\n  const appName = String(appNameOverride || env('GUPSHUP_APP_NAME')).trim();\n"""
          )
          replace_once(
              'src/lib/gupshupWhatsApp.ts',
              """export async function sendGupshupText(\n  destination: string,\n  text: string,\n  previewUrl = true\n) {\n  return postGupshupForm(GUPSHUP_MESSAGE_URL, destination, {\n    message: JSON.stringify({\n      type: 'text',\n      text: text.slice(0, 4096),\n      previewUrl,\n    }),\n  });\n}\n""",
              """export async function sendGupshupText(\n  destination: string,\n  text: string,\n  previewUrl = true,\n  appNameOverride?: string | null\n) {\n  return postGupshupForm(\n    GUPSHUP_MESSAGE_URL,\n    destination,\n    {\n      message: JSON.stringify({\n        type: 'text',\n        text: text.slice(0, 4096),\n        previewUrl,\n      }),\n    },\n    appNameOverride\n  );\n}\n"""
          )
          replace_once(
              'src/lib/gupshupWhatsApp.ts',
              """export async function sendGupshupTemplate(\n  destination: string,\n  templateId: string,\n  parameters: string[]\n) {\n""",
              """export async function sendGupshupTemplate(\n  destination: string,\n  templateId: string,\n  parameters: string[],\n  appNameOverride?: string | null\n) {\n"""
          )
          replace_once(
              'src/lib/gupshupWhatsApp.ts',
              """  return postGupshupForm(GUPSHUP_TEMPLATE_URL, destination, {\n    template: JSON.stringify({\n      id,\n      params: parameters.map((value) => String(value).slice(0, 1024)),\n    }),\n  });\n}\n""",
              """  return postGupshupForm(\n    GUPSHUP_TEMPLATE_URL,\n    destination,\n    {\n      template: JSON.stringify({\n        id,\n        params: parameters.map((value) => String(value).slice(0, 1024)),\n      }),\n    },\n    appNameOverride\n  );\n}\n"""
          )

          # Buyer automation: carry provider app identity with the inbound
          # message and use it for every reply in that processing invocation.
          replace_once(
              'src/lib/whatsappBuyerAutomation.ts',
              """type MetaMessage = {\n  id?: string;\n""",
              """type MetaMessage = {\n  id?: string;\n  appName?: string;\n"""
          )
          replace_once(
              'src/lib/whatsappBuyerAutomation.ts',
              """export async function sendBuyerWhatsAppText(\n  toRaw: string,\n  text: string,\n  orderId?: string | null,\n  userId?: string | null\n) {\n  const result = await sendGupshupText(toRaw, text.slice(0, 4000), true);\n""",
              """export async function sendBuyerWhatsAppText(\n  toRaw: string,\n  text: string,\n  orderId?: string | null,\n  userId?: string | null,\n  appNameOverride?: string | null\n) {\n  const result = await sendGupshupText(\n    toRaw,\n    text.slice(0, 4000),\n    true,\n    appNameOverride\n  );\n"""
          )
          replace_once(
              'src/lib/whatsappBuyerAutomation.ts',
              """        message_text: text.slice(0, 12_000),\n        processing_status: 'processed',\n""",
              """        message_text: text.slice(0, 12_000),\n        processing_status: 'processed',\n        provider: 'gupshup',\n        provider_message_id: outboundId,\n        delivery_status: 'submitted',\n        delivery_status_at: new Date().toISOString(),\n"""
          )
          p = Path('src/lib/whatsappBuyerAutomation.ts')
          text = p.read_text()
          marker = "export async function handleBuyerWhatsAppMessage(\n  message: MetaMessage\n): Promise<{ handled: boolean }> {"
          if marker not in text:
              raise SystemExit('Buyer handler marker missing')
          before, after = text.split(marker, 1)
          after = after.replace('sendBuyerWhatsAppText(', 'sendBuyerReply(')
          injection = marker + """\n  const sendBuyerReply = (\n    toRaw: string,\n    text: string,\n    orderId?: string | null,\n    userId?: string | null\n  ) => sendBuyerWhatsAppText(toRaw, text, orderId, userId, message.appName);"""
          text = before + injection + after
          old_context = "context: { ...context, from_raw: fromRaw },"
          new_context = """context: {\n      ...context,\n      from_raw: fromRaw,\n      ...(message.appName ? { gupshup_app_name: message.appName } : {}),\n    },"""
          if old_context not in text:
              raise SystemExit('Buyer session context marker missing')
          text = text.replace(old_context, new_context, 1)
          p.write_text(text)

          # Webhook: retain Gupshup's event.app on the normalized message and
          # pass it through seller acknowledgements and failure notices.
          replace_once(
              'src/app/api/integrations/whatsapp/webhook/route.ts',
              """type WhatsAppMessage = {\n  id?: string;\n""",
              """type WhatsAppMessage = {\n  id?: string;\n  appName?: string;\n"""
          )
          replace_once(
              'src/app/api/integrations/whatsapp/webhook/route.ts',
              """  const common = { id: message.id, from: message.source };\n""",
              """  const common = {\n    id: message.id,\n    from: message.source,\n    appName: String(event.app || '').trim() || undefined,\n  };\n"""
          )
          replace_once(
              'src/app/api/integrations/whatsapp/webhook/route.ts',
              """async function acknowledgeSeller(to: string, text: string) {\n  try {\n    await sendGupshupText(to, text, false);\n""",
              """async function acknowledgeSeller(\n  to: string,\n  text: string,\n  appNameOverride?: string | null\n) {\n  try {\n    await sendGupshupText(to, text, false, appNameOverride);\n"""
          )
          p = Path('src/app/api/integrations/whatsapp/webhook/route.ts')
          text = p.read_text()
          text = text.replace(
              """      'FabricTrad could not match this WhatsApp number to an active seller account. Add the same number to your FabricTrad seller profile first.'\n    );""",
              """      'FabricTrad could not match this WhatsApp number to an active seller account. Add the same number to your FabricTrad seller profile first.',\n      message.appName\n    );""",
              1,
          )
          text = text.replace(
              """      : 'Received. The message or media is now visible in your FabricTrad seller dashboard for review.'\n  );""",
              """      : 'Received. The message or media is now visible in your FabricTrad seller dashboard for review.',\n    message.appName\n  );""",
              1,
          )
          text = text.replace(
              """    'FabricTrad saved your WhatsApp upload but could not finish processing it. It has been flagged for seller-support review.'\n  );""",
              """    'FabricTrad saved your WhatsApp upload but could not finish processing it. It has been flagged for seller-support review.',\n    message.appName\n  );""",
              1,
          )
          old_failure = """      buyerMessage.bespoke_order_id,\n      buyerMessage.user_id\n    );"""
          new_failure = """      buyerMessage.bespoke_order_id,\n      buyerMessage.user_id,\n      message.appName\n    );"""
          if old_failure not in text:
              raise SystemExit('Buyer failure reply marker missing')
          text = text.replace(old_failure, new_failure, 1)
          p.write_text(text)

          # Scheduled follow-ups: reuse the app identity saved on the latest
          # valid buyer conversation. Outside the 24h customer window the
          # approved template requirement remains enforced.
          replace_once(
              'src/lib/bespokeFollowUps.ts',
              """async function sendWhatsAppPayload(\n  to: string,\n  payload: OutboundPayload,\n  context: { userId: string; orderId: string; fallbackText: string }\n) {\n  const result =\n    payload.kind === 'template'\n      ? await sendGupshupTemplate(to, payload.templateId, payload.parameters)\n      : await sendGupshupText(to, payload.text, true);\n""",
              """async function sendWhatsAppPayload(\n  to: string,\n  payload: OutboundPayload,\n  context: { userId: string; orderId: string; fallbackText: string },\n  appNameOverride?: string | null\n) {\n  const result =\n    payload.kind === 'template'\n      ? await sendGupshupTemplate(to, payload.templateId, payload.parameters, appNameOverride)\n      : await sendGupshupText(to, payload.text, true, appNameOverride);\n"""
          )
          replace_once(
              'src/lib/bespokeFollowUps.ts',
              """    message_text: context.fallbackText.slice(0, 12_000),\n    processing_status: 'processed',\n""",
              """    message_text: context.fallbackText.slice(0, 12_000),\n    processing_status: 'processed',\n    provider: 'gupshup',\n    provider_message_id: outboundId,\n    delivery_status: 'submitted',\n    delivery_status_at: new Date().toISOString(),\n"""
          )
          replace_once(
              'src/lib/bespokeFollowUps.ts',
              """      admin.from('whatsapp_buyer_sessions').select('last_inbound_at').eq('user_id', job.user_id).order('last_inbound_at', { ascending: false }).limit(1).maybeSingle(),\n""",
              """      admin.from('whatsapp_buyer_sessions').select('last_inbound_at,context').eq('user_id', job.user_id).order('last_inbound_at', { ascending: false }).limit(1).maybeSingle(),\n"""
          )
          replace_once(
              'src/lib/bespokeFollowUps.ts',
              """    const lastInbound = session?.last_inbound_at ? new Date(session.last_inbound_at).getTime() : 0;\n    const customerWindowOpen = lastInbound > 0 && Date.now() - lastInbound < CUSTOMER_WINDOW_MS;\n    const templateName = process.env[templateEnvByJob[job.job_type]]?.trim() || '';\n""",
              """    const lastInbound = session?.last_inbound_at ? new Date(session.last_inbound_at).getTime() : 0;\n    const customerWindowOpen = lastInbound > 0 && Date.now() - lastInbound < CUSTOMER_WINDOW_MS;\n    const sessionContext =\n      session?.context && typeof session.context === 'object'\n        ? (session.context as Record<string, unknown>)\n        : {};\n    const appNameOverride = String(sessionContext.gupshup_app_name || '').trim() || undefined;\n    const templateName = process.env[templateEnvByJob[job.job_type]]?.trim() || '';\n"""
          )
          p = Path('src/lib/bespokeFollowUps.ts')
          text = p.read_text()
          old1 = """        fallbackText: message.text,\n      });"""
          new1 = """        fallbackText: message.text,\n      }, appNameOverride);"""
          if old1 not in text:
              raise SystemExit('Free-form follow-up send marker missing')
          text = text.replace(old1, new1, 1)
          old2 = """          fallbackText: message.text,\n        }\n      );"""
          new2 = """          fallbackText: message.text,\n        },\n        appNameOverride\n      );"""
          if old2 not in text:
              raise SystemExit('Template follow-up send marker missing')
          text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps
      - name: Type-check
        run: npm run type-check
      - name: Lint changed runtime
        run: npx eslint src/lib/gupshupWhatsApp.ts src/lib/whatsappBuyerAutomation.ts src/lib/bespokeFollowUps.ts src/app/api/integrations/whatsapp/webhook/route.ts
      - name: Build Cloudflare package
        run: npm run build:sites

      - name: Commit verified runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FabricTrad Release Bot'
          git config user.email 'fabrictrad8@gmail.com'
          git add src/lib/gupshupWhatsApp.ts src/lib/whatsappBuyerAutomation.ts src/lib/bespokeFollowUps.ts src/app/api/integrations/whatsapp/webhook/route.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Runtime already patched.'
            exit 0
          fi
          git commit -m 'fix: complete Gupshup inbound reply runtime [skip deploy]'
          git pull --rebase origin main
          git push origin HEAD:main
