name: Wire administrator dispute navigation

on:
  push:
    branches:
      - agent/shopify-platform-overhaul

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[admin-disputes-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shopify-platform-overhaul
          fetch-depth: 0
      - name: Wire disputes into administrator workspace
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
            'src/app/admin-portal/components/AdminPortalLayout.tsx',
            "import AdminSettings from './AdminSettings';\n",
            "import AdminSettings from './AdminSettings';\nimport AdminDisputes from './AdminDisputes';\n"
          )
          replace_once(
            'src/app/admin-portal/components/AdminPortalLayout.tsx',
            "      { id: 'payments', label: 'Payments', icon: 'CreditCardIcon', description: 'Captures, failures and refunds' },\n",
            "      { id: 'payments', label: 'Payments', icon: 'CreditCardIcon', description: 'Captures, failures and refunds' },\n      { id: 'disputes', label: 'Returns & disputes', icon: 'ChatBubbleLeftRightIcon', description: 'Evidence, resolutions and refund reviews' },\n"
          )
          replace_once(
            'src/app/admin-portal/components/AdminPortalLayout.tsx',
            "      case 'payments': return <AdminPayments />;\n",
            "      case 'payments': return <AdminPayments />;\n      case 'disputes': return <AdminDisputes />;\n"
          )
          replace_once(
            'src/app/admin-portal/components/AdminCommandSearch.tsx',
            "  { id: 'nav-payments', kind: 'Navigation', title: 'Payments', subtitle: 'Razorpay captures, failures and refunds', href: '/admin-portal?tab=payments', icon: 'CreditCardIcon' },\n",
            "  { id: 'nav-payments', kind: 'Navigation', title: 'Payments', subtitle: 'Razorpay captures, failures and refunds', href: '/admin-portal?tab=payments', icon: 'CreditCardIcon' },\n  { id: 'nav-disputes', kind: 'Navigation', title: 'Returns & disputes', subtitle: 'Evidence, resolutions and refund reviews', href: '/admin-portal?tab=disputes', icon: 'ChatBubbleLeftRightIcon' },\n"
          )
          Path('.github/workflows/add-admin-disputes-nav.yml').unlink()
      - name: Commit navigation wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app/admin-portal/components/AdminPortalLayout.tsx src/app/admin-portal/components/AdminCommandSearch.tsx
          git rm --cached --ignore-unmatch .github/workflows/add-admin-disputes-nav.yml >/dev/null 2>&1 || true
          git add -u -- .github/workflows/add-admin-disputes-nav.yml
          git commit -m 'feat: wire administrator dispute workspace [admin-disputes-wired]'
          git push origin HEAD:agent/shopify-platform-overhaul
