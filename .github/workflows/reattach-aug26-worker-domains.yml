name: Reattach FabricTrad domains to Aug-26 Worker
# Re-triggered on 2026-08-29 to return production from Shopify to the historical Cloudflare Worker.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reattach-aug26-worker-domains.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrictrad-aug26-domain-restore
  cancel-in-progress: false

jobs:
  reattach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      WORKER_NAME: fabrictrad
      ZONE_NAME: fabrictrad.com
    steps:
      - name: Require Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || exit 1

      - name: Resolve Cloudflare zone
        id: zone
        shell: bash
        run: |
          set -euo pipefail
          zone_status=$(curl --silent --show-error --output /tmp/zones.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}")
          test "$zone_status" = 200 || { cat /tmp/zones.json; exit 1; }
          ZONE_ID=$(node - <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('/tmp/zones.json','utf8'));
          const zone=(body.result||[]).find(x=>x.name==='fabrictrad.com');
          if(!zone?.id) process.exit(1);
          process.stdout.write(zone.id);
          NODE
          )
          echo "zone_id=${ZONE_ID}" >> "$GITHUB_OUTPUT"
          echo "Resolved Cloudflare zone ${ZONE_ID}."

      - name: Route apex and www through FabricTrad Worker
        shell: bash
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" > /tmp/routes-before.json

          for pattern in 'fabrictrad.com/*' 'www.fabrictrad.com/*'; do
            route_id=$(node - /tmp/routes-before.json "$pattern" <<'NODE'
          const fs=require('node:fs');
          const [file,pattern]=process.argv.slice(2);
          const body=JSON.parse(fs.readFileSync(file,'utf8'));
          const match=(body.result||[]).find(x=>x.pattern===pattern);
          if(match?.id) process.stdout.write(match.id);
          NODE
            )
            payload=$(node -e "console.log(JSON.stringify({pattern:process.argv[1],script:process.argv[2]}))" "$pattern" "$WORKER_NAME")
            if [ -n "$route_id" ]; then
              endpoint="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${route_id}"
              method=PUT
            else
              endpoint="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes"
              method=POST
            fi
            status=$(curl --silent --show-error --output /tmp/route-result.json --write-out '%{http_code}' \
              --request "$method" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "$endpoint")
            node - /tmp/route-result.json "$pattern" "$status" <<'NODE'
          const fs=require('node:fs');
          const [file,pattern,status]=process.argv.slice(2);
          const body=JSON.parse(fs.readFileSync(file,'utf8'));
          if(status!=='200'||body.success!==true){
            console.error(`Worker route attach failed for ${pattern} (HTTP ${status})`);
            console.error(JSON.stringify(body,null,2));
            process.exit(1);
          }
          console.log(`${pattern} -> ${body.result?.script || 'unknown'}`);
          NODE
          done

      - name: Confirm Worker owns both routes
        shell: bash
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" > /tmp/routes.json
          node - <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('/tmp/routes.json','utf8'));
          if(body.success!==true){console.error(JSON.stringify(body,null,2));process.exit(1)}
          const rows=body.result||[];
          for(const pattern of ['fabrictrad.com/*','www.fabrictrad.com/*']){
            const match=rows.find(x=>x.pattern===pattern&&x.script==='fabrictrad');
            if(!match){console.error(`Worker route missing: ${pattern}`);process.exit(1)}
            console.log(`${pattern} is routed to fabrictrad.`);
          }
          NODE

      - name: Verify historical FabricTrad is live
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 60); do
            home=$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 --output /tmp/home.html --write-out '%{http_code}' https://fabrictrad.com/ || true)
            login=$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 --output /tmp/login.html --write-out '%{http_code}' https://fabrictrad.com/login || true)
            www=$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 --output /tmp/www.html --write-out '%{http_code}' https://www.fabrictrad.com/ || true)
            if [ "$home" = 200 ] && [ "$login" = 200 ] && [ "$www" = 200 ] && \
               grep -q 'Textile trade' /tmp/home.html && grep -q 'Welcome back' /tmp/login.html && \
               ! grep -qi 'cdn.shopify.com' /tmp/login.html; then
              ok=true; break
            fi
            sleep 5
          done
          [ "$ok" = true ] || { echo '::error::Historical FabricTrad did not become authoritative.'; exit 1; }
          echo 'PASS: Aug-26 FabricTrad app is authoritative on apex and www.'

      - name: Verify key historical routes
        shell: bash
        run: |
          set -euo pipefail
          for path in /login /buyer-registration /seller-registration /marketplace /buyer-dashboard /seller-dashboard /admin-login; do
            code=$(curl --location --silent --show-error --connect-timeout 10 --max-time 25 --output /tmp/route.html --write-out '%{http_code}' "https://fabrictrad.com${path}" || true)
            test "$code" = 200 || { echo "::error::${path} returned ${code}"; exit 1; }
          done
          echo 'PASS: historical role and marketplace routes are reachable.'
