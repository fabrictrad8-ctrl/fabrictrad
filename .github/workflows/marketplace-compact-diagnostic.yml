name: Marketplace compact diagnostic

on:
  pull_request:
  push:
    branches:
      - agent/shopify-platform-overhaul

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps
      - name: Capture compact validation output
        shell: bash
        run: |
          set +e
          : > marketplace-validation.log
          npm run type-check >> marketplace-validation.log 2>&1
          type_status=$?
          npm run lint >> marketplace-validation.log 2>&1
          lint_status=$?
          npm run build >> marketplace-validation.log 2>&1
          build_status=$?
          printf 'type=%s\nlint=%s\nbuild=%s\n' "$type_status" "$lint_status" "$build_status" > marketplace-validation-status.txt
          exit 0
      - name: Upload compact diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-validation-compact
          path: |
            marketplace-validation.log
            marketplace-validation-status.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
      - name: Preserve validation result
        if: always()
        shell: bash
        run: |
          test "$(grep '^type=' marketplace-validation-status.txt | cut -d= -f2)" = '0'
          test "$(grep '^lint=' marketplace-validation-status.txt | cut -d= -f2)" = '0'
          test "$(grep '^build=' marketplace-validation-status.txt | cut -d= -f2)" = '0'
