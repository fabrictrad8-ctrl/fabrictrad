name: Apply marketplace TypeScript query fixes

on:
  push:
    branches:
      - agent/shopify-platform-overhaul

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-type-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shopify-platform-overhaul
          fetch-depth: 0
      - name: Patch explicit Supabase query types
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/app/api/admin/payments/route.ts',
              "    const buyer = order?.buyer_id ? buyers.get(String(order.buyer_id)) : null;\n    const seller = order?.seller_id ? sellers.get(String(order.seller_id)) : null;\n    const captured = numberValue(row.captured_amount ?? row.amount);",
              "    const buyer = order?.buyer_id ? buyers.get(String(order.buyer_id)) : null;\n    const seller = order?.seller_id ? sellers.get(String(order.seller_id)) : null;\n    const bulkOrder = kind === 'bulk'\n      ? (order as { buyer_company?: string | null; buyer_name?: string | null; buyer_email?: string | null } | undefined)\n      : undefined;\n    const captured = numberValue(row.captured_amount ?? row.amount);"
          )
          replace_once(
              'src/app/api/admin/payments/route.ts',
              "          (kind === 'bulk' ? order?.buyer_company || order?.buyer_name : null) ||\n          'Buyer account',\n        email: buyer?.email || (kind === 'bulk' ? order?.buyer_email : null) || null,",
              "          bulkOrder?.buyer_company ||\n          bulkOrder?.buyer_name ||\n          'Buyer account',\n        email: buyer?.email || bulkOrder?.buyer_email || null,"
          )

          replace_once(
              'src/app/api/razorpay/order/route.ts',
              "  const orderSelect =\n    orderType === 'catalog'\n      ? 'id,buyer_id,seller_id,status,total_amount,payment_terms,deposit_percent,payment_status,amount_paid,amount_refunded,payment_due_at'\n      : 'id,buyer_id,seller_id,status,net_total,payment_status,amount_paid,amount_refunded';\n  const { data: order, error: orderError } = await admin\n    .from(orderTable)\n    .select(orderSelect)\n    .eq('id', orderId)\n    .eq('buyer_id', user.id)\n    .maybeSingle();\n  if (orderError) return json({ error: 'The order could not be loaded.' }, 503);\n  if (!order) return json({ error: 'Order not found.' }, 404);",
              "  const catalogOrderResult = orderType === 'catalog'\n    ? await admin\n        .from('catalog_order_requests')\n        .select('id,buyer_id,seller_id,status,total_amount,payment_terms,deposit_percent,payment_status,amount_paid,amount_refunded,payment_due_at')\n        .eq('id', orderId)\n        .eq('buyer_id', user.id)\n        .maybeSingle()\n    : null;\n  const bulkOrderResult = orderType === 'bulk'\n    ? await admin\n        .from('bulk_orders')\n        .select('id,buyer_id,seller_id,status,net_total,payment_status,amount_paid,amount_refunded')\n        .eq('id', orderId)\n        .eq('buyer_id', user.id)\n        .maybeSingle()\n    : null;\n  const orderError = catalogOrderResult?.error || bulkOrderResult?.error;\n  const order = (catalogOrderResult?.data || bulkOrderResult?.data || null) as Record<string, unknown> | null;\n  if (orderError) return json({ error: 'The order could not be loaded.' }, 503);\n  if (!order) return json({ error: 'Order not found.' }, 404);"
          )

          replace_once(
              'src/app/api/razorpay/verify/route.ts',
              "  for (const candidate of [\n    { kind: 'catalog' as const, table: 'catalog_order_payments', foreignKey: 'catalog_order_id' },\n    { kind: 'bulk' as const, table: 'bulk_order_payments', foreignKey: 'bulk_order_id' },\n  ]) {\n    const { data } = await admin\n      .from(candidate.table)\n      .select(`id,${candidate.foreignKey},razorpay_order_id,amount,currency,status`)\n      .eq('razorpay_order_id', suppliedOrderId)\n      .maybeSingle();\n    if (data) {\n      kind = candidate.kind;\n      record = { ...data, fabrictradOrderId: data[candidate.foreignKey] };\n      break;\n    }\n  }",
              "  const { data: catalogPayment } = await admin\n    .from('catalog_order_payments')\n    .select('id,catalog_order_id,razorpay_order_id,amount,currency,status')\n    .eq('razorpay_order_id', suppliedOrderId)\n    .maybeSingle();\n  if (catalogPayment) {\n    kind = 'catalog';\n    record = { ...catalogPayment, fabrictradOrderId: catalogPayment.catalog_order_id };\n  } else {\n    const { data: bulkPayment } = await admin\n      .from('bulk_order_payments')\n      .select('id,bulk_order_id,razorpay_order_id,amount,currency,status')\n      .eq('razorpay_order_id', suppliedOrderId)\n      .maybeSingle();\n    if (bulkPayment) {\n      kind = 'bulk';\n      record = { ...bulkPayment, fabrictradOrderId: bulkPayment.bulk_order_id };\n    }\n  }"
          )

          replace_once(
              'src/app/api/razorpay/webhook/route.ts',
              "  const paymentSelect =\n    'id,razorpay_order_id,razorpay_payment_id,amount,currency,refunded_amount,refund_requested_amount,refund_status,platform_commission,seller_payable';\n\n  const findPaymentByOrder = async (razorpayOrderId: string): Promise<PaymentRecord | null> => {\n    for (const candidate of [\n      { kind: 'bulk' as const, table: 'bulk_order_payments', foreignKey: 'bulk_order_id' },\n      { kind: 'catalog' as const, table: 'catalog_order_payments', foreignKey: 'catalog_order_id' },\n    ]) {\n      const { data, error } = await admin\n        .from(candidate.table)\n        .select(`${candidate.foreignKey},${paymentSelect}`)\n        .eq('razorpay_order_id', razorpayOrderId)\n        .maybeSingle();\n      if (error) throw error;\n      if (data) return normalizePayment(data, candidate.kind, candidate.foreignKey);\n    }\n    return null;\n  };\n\n  const findPaymentByPaymentId = async (paymentId: string): Promise<PaymentRecord | null> => {\n    for (const candidate of [\n      { kind: 'bulk' as const, table: 'bulk_order_payments', foreignKey: 'bulk_order_id' },\n      { kind: 'catalog' as const, table: 'catalog_order_payments', foreignKey: 'catalog_order_id' },\n    ]) {\n      const { data, error } = await admin\n        .from(candidate.table)\n        .select(`${candidate.foreignKey},${paymentSelect}`)\n        .eq('razorpay_payment_id', paymentId)\n        .maybeSingle();\n      if (error) throw error;\n      if (data) return normalizePayment(data, candidate.kind, candidate.foreignKey);\n    }\n    return null;\n  };",
              "  const findPaymentByOrder = async (razorpayOrderId: string): Promise<PaymentRecord | null> => {\n    const { data: bulk, error: bulkError } = await admin\n      .from('bulk_order_payments')\n      .select('bulk_order_id,id,razorpay_order_id,razorpay_payment_id,amount,currency,refunded_amount,refund_requested_amount,refund_status,platform_commission,seller_payable')\n      .eq('razorpay_order_id', razorpayOrderId)\n      .maybeSingle();\n    if (bulkError) throw bulkError;\n    if (bulk) return normalizePayment(bulk, 'bulk', 'bulk_order_id');\n    const { data: catalog, error: catalogError } = await admin\n      .from('catalog_order_payments')\n      .select('catalog_order_id,id,razorpay_order_id,razorpay_payment_id,amount,currency,refunded_amount,refund_requested_amount,refund_status,platform_commission,seller_payable')\n      .eq('razorpay_order_id', razorpayOrderId)\n      .maybeSingle();\n    if (catalogError) throw catalogError;\n    return catalog ? normalizePayment(catalog, 'catalog', 'catalog_order_id') : null;\n  };\n\n  const findPaymentByPaymentId = async (paymentId: string): Promise<PaymentRecord | null> => {\n    const { data: bulk, error: bulkError } = await admin\n      .from('bulk_order_payments')\n      .select('bulk_order_id,id,razorpay_order_id,razorpay_payment_id,amount,currency,refunded_amount,refund_requested_amount,refund_status,platform_commission,seller_payable')\n      .eq('razorpay_payment_id', paymentId)\n      .maybeSingle();\n    if (bulkError) throw bulkError;\n    if (bulk) return normalizePayment(bulk, 'bulk', 'bulk_order_id');\n    const { data: catalog, error: catalogError } = await admin\n      .from('catalog_order_payments')\n      .select('catalog_order_id,id,razorpay_order_id,razorpay_payment_id,amount,currency,refunded_amount,refund_requested_amount,refund_status,platform_commission,seller_payable')\n      .eq('razorpay_payment_id', paymentId)\n      .maybeSingle();\n    if (catalogError) throw catalogError;\n    return catalog ? normalizePayment(catalog, 'catalog', 'catalog_order_id') : null;\n  };"
          )

          replace_once(
              'src/app/api/razorpay/webhook/route.ts',
              "    const orderSelect =\n      payment.kind === 'bulk'\n        ? `id,status,${totalColumn},gross_total,gst_total,seller_id`\n        : `id,status,${totalColumn},gst_amount,gst_rate,seller_id`;\n\n    const [{ data: payments, error: paymentsError }, { data: order, error: orderError }] =\n      await Promise.all([\n        admin\n          .from(paymentTable)\n          .select('amount,refunded_amount,status')\n          .eq(foreignKey, payment.fabrictradOrderId),\n        admin.from(orderTable).select(orderSelect).eq('id', payment.fabrictradOrderId).maybeSingle(),\n      ]);",
              "    const paymentsResult = await admin\n      .from(paymentTable)\n      .select('amount,refunded_amount,status')\n      .eq(foreignKey, payment.fabrictradOrderId);\n    const orderResult = payment.kind === 'bulk'\n      ? await admin\n          .from('bulk_orders')\n          .select('id,status,net_total,gross_total,gst_total,seller_id')\n          .eq('id', payment.fabrictradOrderId)\n          .maybeSingle()\n      : await admin\n          .from('catalog_order_requests')\n          .select('id,status,total_amount,gst_amount,gst_rate,seller_id')\n          .eq('id', payment.fabrictradOrderId)\n          .maybeSingle();\n    const payments = paymentsResult.data;\n    const paymentsError = paymentsResult.error;\n    const order = orderResult.data as Record<string, unknown> | null;\n    const orderError = orderResult.error;"
          )

      - name: Commit query fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app/api/admin/payments/route.ts src/app/api/razorpay/order/route.ts src/app/api/razorpay/verify/route.ts src/app/api/razorpay/webhook/route.ts
          git commit -m 'fix: make marketplace Supabase queries type-safe [skip-type-fix]'
          git push origin HEAD:agent/shopify-platform-overhaul
