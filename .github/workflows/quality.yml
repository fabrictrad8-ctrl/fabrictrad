name: Quality and security checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Core regression scripts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:oauth-recovery
          npm run verify:public-home
          npm run verify:database-security
          npm run verify:seller-onboarding
          node scripts/verify-marketplace-integrity.mjs

      - name: Security architecture assertions
        shell: bash
        run: |
          set -euo pipefail

          # Admin authentication must remain isolated from buyer/seller OAuth.
          grep -Fq 'configuredEmail={configuredAdminEmail()}' src/app/admin-login/page.tsx
          grep -Fq 'emailAllowed = normalizedEmail === authorisedEmail' src/app/admin-login/AdminLoginClient.tsx
          grep -Fq 'shouldCreateUser: false' src/app/api/auth/admin-otp/request/route.ts
          grep -Fq 'admin_otp_required' src/app/auth/callback/route.ts
          grep -Fq 'await supabase.auth.signOut().catch' src/app/auth/callback/route.ts
          grep -Fq "const isAdminApi = pathname.startsWith('/api/admin')" src/middleware.ts
          grep -Fq "'/api/admin/:path*'" src/middleware.ts

          # Razorpay credentials must be centralized and production must fail closed on non-live keys.
          grep -Fq 'getRazorpayCredentials' src/app/api/razorpay/order/route.ts
          grep -Fq 'getRazorpayCredentials' src/app/api/razorpay/verify/route.ts
          grep -Fq "keyId.startsWith('rzp_live_')" src/lib/razorpayCredentials.ts
          grep -Fq 'allowTestInProduction' src/app/api/razorpay/status/route.ts
          grep -Fq 'productionReady' src/app/api/razorpay/status/route.ts
          grep -Fq 'assertRazorpayPaymentMatches' src/app/api/razorpay/verify/route.ts
          grep -Fq 'verifyCheckoutSignature' src/app/api/razorpay/verify/route.ts
          grep -Fq 'Webhook amount does not match' src/app/api/razorpay/webhook/route.ts
          grep -Fq "eventType === 'refund.processed'" src/app/api/razorpay/webhook/route.ts
          grep -Fq 'webhook_dead_letter_queue' src/app/api/razorpay/webhook/route.ts

          # Shiprocket must use server-only credentials and support authenticated readiness checks.
          grep -Fq 'getShiprocketCredentials' src/app/api/shiprocket/status/route.ts
          grep -Fq "request.nextUrl.searchParams.get('verify') === '1'" src/app/api/shiprocket/status/route.ts
          grep -Fq 'getShiprocketCredentials' src/app/api/shiprocket/create-order/route.ts
          grep -Fq 'loadExpectedWebhookToken' src/app/api/shiprocket/webhook/route.ts
          grep -Fq 'SHIPROCKET_WEBHOOK_TOKEN' src/app/api/shiprocket/webhook/route.ts
          grep -Fq 'get_server_shiprocket_webhook_token' src/app/api/shiprocket/webhook/route.ts

          # Production Worker must be attached to both public hostnames.
          grep -Fq '"pattern": "fabrictrad.com"' wrangler.jsonc
          grep -Fq '"pattern": "www.fabrictrad.com"' wrangler.jsonc
          test "$(grep -Fc '"custom_domain": true' wrangler.jsonc)" -ge 2

          # Synthetic demo APIs must stay removed from the production route tree.
          test ! -e src/app/api/auth/demo-session/route.ts

      - name: Production build
        run: npm run build

      - name: Runtime authorization smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/fabrictrad-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/login > /tmp/login.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            cat /tmp/fabrictrad-server.log
            exit 1
          fi

          home=$(curl --silent --output /tmp/home.html --write-out '%{http_code}' http://127.0.0.1:3000/)
          login=$(curl --silent --output /tmp/login-2.html --write-out '%{http_code}' http://127.0.0.1:3000/login)
          admin_login=$(curl --silent --output /tmp/admin-login.html --write-out '%{http_code}' http://127.0.0.1:3000/admin-login)
          test "$home" = '200'
          test "$login" = '200'
          test "$admin_login" = '200'

          admin_otp_rejected=$(curl --silent --output /tmp/admin-otp-rejected.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"attacker@example.com"}' \
            http://127.0.0.1:3000/api/auth/admin-otp/request)
          test "$admin_otp_rejected" = '403'
          grep -qi 'not authorised' /tmp/admin-otp-rejected.json

          admin_api=$(curl --silent --output /tmp/admin-api.json --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/admin/overview)
          test "$admin_api" = '401'

          payment_order=$(curl --silent --output /tmp/payment-order.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3000/api/razorpay/order)
          payment_verify=$(curl --silent --output /tmp/payment-verify.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3000/api/razorpay/verify)
          shipping_create=$(curl --silent --output /tmp/shipping-create.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3000/api/shiprocket/create-order)
          test "$payment_order" = '401'
          test "$payment_verify" = '401'
          test "$shipping_create" = '401'

          demo_get=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          test "$demo_get" = '404'

      - name: OpenNext Cloudflare compatibility build
        run: npm run build:sites
