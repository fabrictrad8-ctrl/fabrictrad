name: Quality and security checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Authentication, catalog studio, media and order source checks
        shell: bash
        run: |
          set -euo pipefail

          login='src/app/login/EmailOtpLoginClient.tsx'
          logout_button='src/components/auth/LogoutButton.tsx'
          logout_route='src/app/api/auth/logout/route.ts'
          role_route='src/app/api/auth/resolve-role/route.ts'
          auth='src/contexts/AuthContext.tsx'
          demo='src/app/api/auth/demo-session/route.ts'
          middleware='src/middleware.ts'
          seller_layout='src/app/seller-dashboard/components/SellerDashboardLayout.tsx'
          catalog_studio='src/app/seller-dashboard/components/SellerCatalogAssistant.tsx'
          catalog_parser='src/lib/catalogAssistant.ts'
          catalog_api='src/app/api/catalog-assistant/parse/route.ts'
          profile_readiness='src/app/seller-dashboard/components/SellerProfileReadiness.tsx'
          catalog_orders='src/app/seller-dashboard/components/SellerCatalogOrders.tsx'
          product_hook='src/lib/hooks/useProduct.ts'
          product_gallery='src/app/product-detail/components/ProductGallery.tsx'
          product_info='src/app/product-detail/components/ProductInfo.tsx'
          media_migration='supabase/migrations/20260728180000_in_app_catalog_media.sql'
          deploy='.github/workflows/deploy-cloudflare.yml'

          grep -q 'Forgot password?' "$login"
          grep -q 'Continue with Google' "$login"
          grep -q 'current-password' "$login"
          grep -Fq "'/api/auth/demo-session'" "$auth"
          grep -Fq "'demo.buyer@fabrictrad.com'" "$demo"
          grep -Fq "const DEMO_COOKIE_NAME = 'fabrictrad_demo_role';" "$middleware"
          grep -Fq "window.location.replace('/api/auth/logout')" "$logout_button"
          grep -Fq "signOut({ scope: 'local' })" "$logout_route"
          grep -Fq "new URL('/login?logged_out=1'" "$logout_route"
          grep -Fq 'avoids a second database round trip' "$role_route"

          grep -Fq 'AI Catalog Studio' "$seller_layout"
          grep -Fq '<SellerCatalogAssistant />' "$seller_layout"
          grep -Fq '<SellerProfileReadiness />' "$seller_layout"
          grep -Fq '<SellerCatalogOrders />' "$seller_layout"
          grep -Fq 'Add product with AI' "$seller_layout"
          grep -Fq 'Draft · private' "$catalog_studio"
          grep -Fq 'Active · visible' "$catalog_studio"
          grep -Fq 'video/quicktime' "$catalog_studio"
          grep -Fq 'MAX_VIDEO_SECONDS = 20.5' "$catalog_studio"
          grep -Fq "from('seller_product_media')" "$catalog_studio"
          grep -Fq "source: 'assistant'" "$catalog_studio"
          grep -Fq 'catalogVariantKey' "$catalog_parser"
          grep -Fq "SaleChannel = 'b2b' | 'retail' | 'both'" "$catalog_parser"
          grep -Fq "'Top & Bottom'" "$catalog_parser"
          grep -Fq "https://api.openai.com/v1/responses" "$catalog_api"
          grep -Fq "type: 'json_schema'" "$catalog_api"
          grep -Fq 'deterministic textile parser' "$catalog_api"
          grep -Fq 'Business profile' "$profile_readiness"

          grep -Fq "from('seller_product_media')" "$product_hook"
          grep -Fq "type: 'video'" "$product_gallery"
          grep -Fq 'Front, back, details and reels' "$catalog_studio"
          grep -Fq "from('catalog_order_requests')" "$product_info"
          grep -Fq 'Retail quantity enabled' "$product_info"
          grep -Fq "from('catalog_order_requests')" "$catalog_orders"

          grep -Fq 'seller_product_media' "$media_migration"
          grep -Fq 'seller-product-media' "$media_migration"
          grep -Fq 'video/quicktime' "$media_migration"
          grep -Fq 'sale_channel' "$media_migration"
          grep -Fq 'package_format' "$media_migration"
          grep -Fq 'catalog_order_requests' "$media_migration"
          grep -Fq "'assistant'" "$media_migration"

          grep -Fq "OPENAI_CATALOG_MODEL: gpt-4.1-mini" "$deploy"
          grep -Fq 'api/catalog-assistant/parse' "$deploy"
          grep -Fq 'Apply Supabase migrations when deployment credentials exist' "$deploy"

          test ! -e src/app/seller-dashboard/components/SellerWhatsAppUpload.tsx
          test ! -e src/app/api/whatsapp/webhook/route.ts
          test ! -e src/app/api/whatsapp/catalog/status/route.ts
          test ! -e src/lib/whatsappConfig.ts

          if grep -Rqi 'WhatsApp Catalog\|Open WhatsApp\|official FabricTrad catalogue WhatsApp' \
            src/app/seller-dashboard src/app/api src/components; then
            echo 'WhatsApp catalogue integration is still exposed in the application.'
            exit 1
          fi
          if grep -qi 'Password reset codes are sent only\|Explore a demo\|Admin portal' "$login"; then
            echo 'Removed login content was restored.'
            exit 1
          fi

      - name: Runtime route smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/fabrictrad-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/login > /tmp/login.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            cat /tmp/fabrictrad-server.log
            exit 1
          fi

          catalog_get=$(curl --silent --output /tmp/catalog-get.json --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/catalog-assistant/parse)
          test "$catalog_get" = '200'
          grep -q '"available":true' /tmp/catalog-get.json
          grep -q 'deterministic textile parser' /tmp/catalog-get.json

          catalog_post=$(curl --silent --output /tmp/catalog-post.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"text":"Catalog = Summer Cotton\nFabric = cotton\nRate = 220 per mtr\nChannel = both\nFormat = Top & Bottom\n\nColor = Blue\nStock = 9 mtr\nDesign = woven stripe"}' \
            http://127.0.0.1:3000/api/catalog-assistant/parse)
          test "$catalog_post" = '200'
          grep -q '"fabric":"Cotton"' /tmp/catalog-post.json
          grep -q '"saleChannel":"both"' /tmp/catalog-post.json
          grep -q '"packageFormat":"Top & Bottom"' /tmp/catalog-post.json
          grep -q '"colorName":"Blue"' /tmp/catalog-post.json

          invalid_catalog=$(curl --silent --output /tmp/catalog-invalid.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3000/api/catalog-assistant/parse)
          test "$invalid_catalog" = '400'

          invalid_demo=$(curl --silent --output /tmp/invalid-demo.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"demo.buyer@fabrictrad.com","password":"wrong-password"}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          test "$invalid_demo" = '401'

          buyer=$(curl --silent --output /tmp/buyer.json --write-out '%{http_code}' \
            --cookie-jar /tmp/buyer.cookies --header 'Content-Type: application/json' \
            --data '{"email":"demo.buyer@fabrictrad.com","password":"FabricDemo@2026"}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          test "$buyer" = '200'
          grep -q '"role":"buyer"' /tmp/buyer.json

          logout=$(curl --silent --dump-header /tmp/logout.headers --output /dev/null \
            --write-out '%{http_code}' --cookie /tmp/buyer.cookies --max-redirs 0 \
            http://127.0.0.1:3000/api/auth/logout)
          test "$logout" = '303'
          grep -qi '^location: .*login?logged_out=1' /tmp/logout.headers
          grep -qi 'fabrictrad_demo_role=.*Max-Age=0' /tmp/logout.headers

          seller=$(curl --silent --output /tmp/seller.json --write-out '%{http_code}' \
            --cookie-jar /tmp/seller.cookies --header 'Content-Type: application/json' \
            --data '{"email":"demo.seller@fabrictrad.com","password":"FabricDemo@2026"}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          test "$seller" = '200'
          grep -q '"role":"seller"' /tmp/seller.json
          dashboard=$(curl --silent --output /tmp/dashboard.html --write-out '%{http_code}' \
            --cookie /tmp/seller.cookies --max-redirs 0 \
            'http://127.0.0.1:3000/seller-dashboard?tab=upload')
          test "$dashboard" = '200'

          old_whatsapp=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/whatsapp/catalog/status)
          test "$old_whatsapp" = '404'

      - name: OpenNext Cloudflare compatibility build
        run: npm run build:sites
