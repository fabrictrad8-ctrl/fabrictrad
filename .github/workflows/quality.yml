name: Quality and security checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate unified commerce changes
        if: github.ref_name == 'agent/unified-buy-sell-retail-catalog-reset' || github.event.pull_request.head.ref == 'agent/unified-buy-sell-retail-catalog-reset'
        run: node scripts/apply-unified-commerce-ui.mjs

      - name: Commit generated unified commerce changes
        if: github.event_name == 'push' && github.ref_name == 'agent/unified-buy-sell-retail-catalog-reset'
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src supabase .github/workflows/quality.yml
          git commit -m 'Implement unified buy and sell account experience [unified-commerce-patched]'
          git push origin HEAD:agent/unified-buy-sell-retail-catalog-reset

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Account, commerce, catalog and auth regression checks
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            src/app/api/auth/logout/route.ts
            src/app/api/auth/provision-account/route.ts
            src/app/api/registration/seller/finalize/route.ts
            src/app/api/catalog-assistant/parse/route.ts
            src/app/seller-dashboard/components/SellerCatalogAssistant.tsx
            src/app/seller-dashboard/components/SellerProfileReadiness.tsx
            src/app/seller-dashboard/components/SellerCatalogOrders.tsx
            src/app/buyer-dashboard/components/BuyerCatalogOrders.tsx
            src/app/product-detail/components/ProductGallery.tsx
            src/app/product-detail/components/ProductInfo.tsx
            src/lib/accountProvisioning.ts
            src/lib/catalogAssistant.ts
            supabase/migrations/20260728180000_in_app_catalog_media.sql
            supabase/migrations/20260730210000_account_role_profile_provisioning.sql
            supabase/migrations/20260730211000_catalog_order_payment_flow.sql
            supabase/migrations/20260730212000_catalog_order_inventory_reservation.sql
          )
          for file in "${required_files[@]}"; do test -f "$file"; done

          grep -Fq "window.location.replace('/api/auth/logout')" src/components/auth/LogoutButton.tsx
          grep -Fq "signOut({ scope: 'local' })" src/app/api/auth/logout/route.ts
          grep -Fq "new URL('/login?logged_out=1'" src/app/api/auth/logout/route.ts
          grep -Fq 'avoids a second database round trip' src/app/api/auth/resolve-role/route.ts

          grep -Fq 'ensureAccountProvisioned' src/app/api/auth/provision-account/route.ts
          grep -Fq 'registrationNonce' src/contexts/AuthContext.tsx
          grep -Fq "fetch('/api/auth/provision-account'" src/contexts/AuthContext.tsx
          grep -Fq 'ensureAccountProvisioned' src/app/auth/callback/route.ts
          grep -Fq "fetch('/api/registration/seller/finalize'" src/app/seller-registration/components/SellerRegistrationFlow.tsx
          grep -Fq 'seller-registration-documents' src/app/api/registration/seller/finalize/route.ts
          grep -Fq 'CREATE OR REPLACE FUNCTION public.handle_new_user()' supabase/migrations/20260730210000_account_role_profile_provisioning.sql
          grep -Fq 'INSERT INTO public.seller_profiles' supabase/migrations/20260730210000_account_role_profile_provisioning.sql
          grep -Fq 'INSERT INTO public.buyer_profiles' supabase/migrations/20260730210000_account_role_profile_provisioning.sql
          grep -Fq "SET search_path = ''" supabase/migrations/20260730210000_account_role_profile_provisioning.sql
          grep -Fq 'PENDING_STATUSES.has(seller.status)' src/app/admin-portal/components/AdminSellers.tsx

          grep -Fq 'AI Catalog Studio' src/app/seller-dashboard/components/SellerDashboardLayout.tsx
          grep -Fq '<SellerCatalogAssistant />' src/app/seller-dashboard/components/SellerDashboardLayout.tsx
          grep -Fq '<SellerProfileReadiness />' src/app/seller-dashboard/components/SellerDashboardLayout.tsx
          grep -Fq '<SellerCatalogOrders />' src/app/seller-dashboard/components/SellerDashboardLayout.tsx
          grep -Fq 'MAX_VIDEO_SECONDS = 20.5' src/app/seller-dashboard/components/SellerCatalogAssistant.tsx
          grep -Fq "from('seller_product_media')" src/app/seller-dashboard/components/SellerCatalogAssistant.tsx
          grep -Fq "source: 'assistant'" src/app/seller-dashboard/components/SellerCatalogAssistant.tsx
          grep -Fq 'https://api.openai.com/v1/responses' src/app/api/catalog-assistant/parse/route.ts
          grep -Fq "type: 'json_schema'" src/app/api/catalog-assistant/parse/route.ts
          grep -Fq 'deterministic textile parser' src/app/api/catalog-assistant/parse/route.ts

          grep -Fq "active.type === 'video'" src/app/product-detail/components/ProductGallery.tsx
          grep -Fq "from('catalog_order_requests')" src/app/product-detail/components/ProductInfo.tsx
          grep -Fq "seller_decide_catalog_order" src/app/seller-dashboard/components/SellerCatalogOrders.tsx
          grep -Fq '<BuyerCatalogOrders />' src/app/buyer-dashboard/components/BuyerOrders.tsx
          grep -Fq '<RazorpayCheckout' src/app/buyer-dashboard/components/BuyerCatalogOrders.tsx
          grep -Fq '<RazorpayCheckout' src/app/buyer-dashboard/components/BuyerOrders.tsx
          grep -Fq "catalog_order_payments" src/app/api/razorpay/order/route.ts
          grep -Fq "catalog_order_payments" src/app/api/razorpay/verify/route.ts
          grep -Fq "catalog_order_payments" src/app/api/razorpay/webhook/route.ts
          grep -Fq 'CREATE OR REPLACE FUNCTION public.seller_decide_catalog_order' supabase/migrations/20260730212000_catalog_order_inventory_reservation.sql
          grep -Fq 'restore_catalog_order_stock_on_cancel' supabase/migrations/20260730212000_catalog_order_inventory_reservation.sql
          grep -Fq 'Retail quantity enabled' src/app/product-detail/components/ProductInfo.tsx

          grep -Fq 'seller_product_media' supabase/migrations/20260728180000_in_app_catalog_media.sql
          grep -Fq 'seller-product-media' supabase/migrations/20260728180000_in_app_catalog_media.sql
          grep -Fq 'video/quicktime' supabase/migrations/20260728180000_in_app_catalog_media.sql
          grep -Fq 'catalog_order_requests' supabase/migrations/20260728180000_in_app_catalog_media.sql
          grep -Fq "'assistant'" supabase/migrations/20260728180000_in_app_catalog_media.sql

          test ! -e src/app/seller-dashboard/components/SellerWhatsAppUpload.tsx
          test ! -e src/app/api/whatsapp/webhook/route.ts
          test ! -e src/app/api/whatsapp/catalog/status/route.ts
          test ! -e src/lib/whatsappConfig.ts

      - name: Runtime route smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/fabrictrad-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/login > /tmp/login.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            cat /tmp/fabrictrad-server.log
            exit 1
          fi

          catalog_get=$(curl --silent --output /tmp/catalog-get.json --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/catalog-assistant/parse)
          test "$catalog_get" = '200'
          grep -q '"available":true' /tmp/catalog-get.json

          catalog_post=$(curl --silent --output /tmp/catalog-post.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"text":"Catalog = Summer Cotton\nFabric = cotton\nRate = 220 per mtr\nChannel = both\nFormat = Top & Bottom\n\nColor = Blue\nStock = 9 mtr\nDesign = woven stripe"}' \
            http://127.0.0.1:3000/api/catalog-assistant/parse)
          test "$catalog_post" = '200'
          grep -q '"fabric":"Cotton"' /tmp/catalog-post.json
          grep -q '"saleChannel":"both"' /tmp/catalog-post.json
          grep -q '"packageFormat":"Top & Bottom"' /tmp/catalog-post.json
          grep -q '"colorName":"Blue"' /tmp/catalog-post.json

          provision=$(curl --silent --output /tmp/provision.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3000/api/auth/provision-account)
          test "$provision" = '401'

          finalize=$(curl --silent --output /tmp/finalize.json --write-out '%{http_code}' \
            --form 'payload={}' \
            http://127.0.0.1:3000/api/registration/seller/finalize)
          test "$finalize" = '401'

          buyer=$(curl --silent --output /tmp/buyer.json --write-out '%{http_code}' \
            --cookie-jar /tmp/buyer.cookies --header 'Content-Type: application/json' \
            --data '{"email":"demo.buyer@fabrictrad.com","password":"FabricDemo@2026"}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          test "$buyer" = '200'
          grep -q '"role":"buyer"' /tmp/buyer.json

          logout=$(curl --silent --dump-header /tmp/logout.headers --output /dev/null \
            --write-out '%{http_code}' --cookie /tmp/buyer.cookies --max-redirs 0 \
            http://127.0.0.1:3000/api/auth/logout)
          test "$logout" = '303'
          grep -qi '^location: .*login?logged_out=1' /tmp/logout.headers

          seller=$(curl --silent --output /tmp/seller.json --write-out '%{http_code}' \
            --cookie-jar /tmp/seller.cookies --header 'Content-Type: application/json' \
            --data '{"email":"demo.seller@fabrictrad.com","password":"FabricDemo@2026"}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          test "$seller" = '200'
          dashboard=$(curl --silent --output /tmp/dashboard.html --write-out '%{http_code}' \
            --cookie /tmp/seller.cookies --max-redirs 0 \
            'http://127.0.0.1:3000/seller-dashboard?tab=upload')
          test "$dashboard" = '200'

          old_whatsapp=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/whatsapp/catalog/status)
          test "$old_whatsapp" = '404'

      - name: OpenNext Cloudflare compatibility build
        run: npm run build:sites
