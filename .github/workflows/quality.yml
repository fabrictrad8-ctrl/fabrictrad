name: Quality and security checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Core regression scripts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:oauth-recovery
          npm run verify:public-home
          npm run verify:database-security
          npm run verify:seller-onboarding
          node scripts/verify-marketplace-integrity.mjs

      - name: Security and deployment architecture assertions
        shell: bash
        run: |
          set -euo pipefail

          # Admin authentication is isolated from buyer/seller password and OAuth flows.
          grep -Fq 'configuredEmail={configuredAdminEmail()}' src/app/admin-login/page.tsx
          grep -Fq 'emailAllowed = normalizedEmail === authorisedEmail' src/app/admin-login/AdminLoginClient.tsx
          grep -Fq 'shouldCreateUser: false' src/app/api/auth/admin-otp/request/route.ts
          grep -Fq 'admin_otp_required' src/app/auth/callback/route.ts
          grep -Fq 'isConfiguredAdminEmail(email)' src/app/api/auth/password-login/route.ts
          grep -Fq "return decisiveMethod === 'otp'" src/lib/adminSession.ts
          grep -Fq 'isOtpAuthenticatedAccessToken' src/middleware.ts
          grep -Fq "const isAdminApi = pathname.startsWith('/api/admin')" src/middleware.ts
          grep -Fq "'/api/admin/:path*'" src/middleware.ts
          ! grep -R --line-number --fixed-strings 'ADMIN_PASSWORD' src scripts .env.example 2>/dev/null

          # Production storefront ownership belongs to Shopify, not the legacy Worker.
          if grep -Fq '"custom_domain"' wrangler.jsonc; then
            echo '::error::wrangler.jsonc must not claim FabricTrad production custom domains.'
            exit 1
          fi
          test ! -e .github/workflows/reattach-aug26-worker-domains.yml
          test ! -e .github/workflows/force-deploy-current-worker.yml
          test ! -e .github/workflows/live-domain-repair.yml
          test ! -e .github/workflows/ui-production-release.yml
          test ! -e .github/workflows/promote-cloudflare-razorpay-live.yml
          test ! -e .github/workflows/razorpay-hotfix-deploy.yml
          test ! -e .github/workflows/restore-historical-razorpay-live.yml
          test ! -e .github/workflows/cutover-shopify-domain.yml
          ! node -e "const p=require('./package.json'); const bad=['build:sites','deploy:sites','preview:sites'].filter(k=>p.scripts?.[k]); if(bad.length){console.error('Retired Cloudflare scripts still exposed:',bad);process.exit(1)}"

          # Synthetic demo APIs and role cookies must stay out of production authorization.
          test ! -e src/app/api/auth/demo-session/route.ts
          ! grep -R --line-number --fixed-strings 'fabrictrad_demo_role' src tests 2>/dev/null
          ! grep -R --line-number --fixed-strings 'FABRICTRAD_ENABLE_AUDIT_ADMIN' src tests 2>/dev/null

      - name: Production source build
        run: npm run build

      - name: Runtime authorization smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/fabrictrad-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/login > /tmp/login.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            cat /tmp/fabrictrad-server.log
            exit 1
          fi

          home=$(curl --silent --output /tmp/home.html --write-out '%{http_code}' http://127.0.0.1:3000/)
          login=$(curl --silent --output /tmp/login-2.html --write-out '%{http_code}' http://127.0.0.1:3000/login)
          admin_login=$(curl --silent --output /tmp/admin-login.html --write-out '%{http_code}' http://127.0.0.1:3000/admin-login)
          test "$home" = '200'
          test "$login" = '200'
          test "$admin_login" = '200'

          admin_otp_rejected=$(curl --silent --output /tmp/admin-otp-rejected.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"attacker@example.com"}' \
            http://127.0.0.1:3000/api/auth/admin-otp/request)
          test "$admin_otp_rejected" = '403'
          grep -qi 'not authorised' /tmp/admin-otp-rejected.json

          admin_password_rejected=$(curl --silent --output /tmp/admin-password-rejected.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"fabrictrad8@gmail.com","password":"NeverUsePasswordsForAdmin123!"}' \
            http://127.0.0.1:3000/api/auth/password-login)
          test "$admin_password_rejected" = '403'
          grep -q 'admin_otp_required' /tmp/admin-password-rejected.json

          admin_api=$(curl --silent --output /tmp/admin-api.json --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/admin/overview)
          test "$admin_api" = '401'

          shipping_create=$(curl --silent --output /tmp/shipping-create.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3000/api/shiprocket/create-order)
          test "$shipping_create" = '401'

          demo_get=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          test "$demo_get" = '404'
