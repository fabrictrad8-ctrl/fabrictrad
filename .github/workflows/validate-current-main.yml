name: Validate current FabricTrad main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fabrictrad-main-validation
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip validation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps 2>&1 | tee /tmp/install.log

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run type-check 2>&1 | tee /tmp/typecheck.log

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint 2>&1 | tee /tmp/lint.log

      - name: Account lifecycle verification
        id: account
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-account-lifecycle.mjs 2>&1 | tee /tmp/account.log

      - name: Marketplace integrity verification
        id: marketplace
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-marketplace-integrity.mjs 2>&1 | tee /tmp/marketplace.log

      - name: Mobile verification
        id: mobile
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-mobile-whatsapp.mjs 2>&1 | tee /tmp/mobile.log

      - name: Record validation result
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          ACCOUNT_OUTCOME: ${{ steps.account.outcome }}
          MARKETPLACE_OUTCOME: ${{ steps.marketplace.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .github/deployments
          node - <<'NODE'
          const fs = require('node:fs');
          const files = ['install','typecheck','lint','account','marketplace','mobile'];
          const tails = {};
          for (const name of files) {
            const path = `/tmp/${name}.log`;
            if (!fs.existsSync(path)) {
              tails[name] = null;
              continue;
            }
            tails[name] = fs.readFileSync(path, 'utf8')
              .replace(/\u001b\[[0-9;]*m/g, '')
              .split(/\r?\n/)
              .filter(Boolean)
              .slice(-80)
              .join('\n')
              .slice(0, 10000) || null;
          }
          const payload = {
            sourceCommit: process.env.GITHUB_SHA,
            recordedAt: new Date().toISOString(),
            install: process.env.INSTALL_OUTCOME || 'skipped',
            typecheck: process.env.TYPECHECK_OUTCOME || 'skipped',
            lint: process.env.LINT_OUTCOME || 'skipped',
            accountLifecycle: process.env.ACCOUNT_OUTCOME || 'skipped',
            marketplaceIntegrity: process.env.MARKETPLACE_OUTCOME || 'skipped',
            mobileVerification: process.env.MOBILE_OUTCOME || 'skipped',
            logs: tails,
          };
          fs.writeFileSync('.github/deployments/validation-status.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/validation-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record main validation status [skip deploy] [skip validation]'
            git push origin HEAD:main
          fi
