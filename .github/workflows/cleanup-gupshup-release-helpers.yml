name: Clean temporary Gupshup release helpers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-gupshup-release-helpers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-time Gupshup migration and direct-deploy helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FabricTrad Release Bot'
          git config user.email 'fabrictrad8@gmail.com'
          git rm -f --ignore-unmatch \
            .github/workflows/deploy-gupshup-production.yml \
            .github/workflows/finalize-gupshup-public-webhook.yml \
            .github/workflows/migrate-gupshup-transport.yml \
            .github/workflows/run-gupshup-migration.yml \
            .github/workflows/final-gupshup-runtime-fix.yml \
            scripts/deploy-gupshup-production.sh \
            .github/workflows/cleanup-gupshup-release-helpers.yml

          if git diff --cached --quiet; then
            echo 'No temporary helpers remain.'
            exit 0
          fi

          git commit -m 'chore: remove temporary Gupshup release helpers [skip deploy]'
          git pull --rebase origin main
          git push origin HEAD:main
