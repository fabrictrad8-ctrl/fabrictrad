name: Apply catalog typefix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact fixes when needed
        shell: bash
        run: |
          if grep -q 'const organisedDraft = payload.draft;' src/app/seller-dashboard/components/SellerCatalogAssistant.tsx; then
            echo 'Type fixes already applied.'
            exit 0
          fi
          node scripts/fix-catalog-overhaul-types.mjs
          git config user.name 'FabricTrad Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/seller-dashboard/components/SellerCatalogAssistant.tsx src/lib/catalogAssistant.ts
          git commit -m 'Fix catalog studio TypeScript narrowing [typefix]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
