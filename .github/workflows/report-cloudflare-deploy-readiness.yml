name: Report Cloudflare deploy readiness

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/report-cloudflare-deploy-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      COMMIT_SHA: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Publish credential readiness status
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            state='success'
            description='Cloudflare deployment token is configured'
          else
            state='failure'
            description='CLOUDFLARE_API_TOKEN is missing from Actions secrets'
          fi
          payload=$(python - "$state" "$description" <<'PY'
          import json, sys
          print(json.dumps({
            'state': sys.argv[1],
            'context': 'fabrictrad/cloudflare-deploy-credentials',
            'description': sys.argv[2],
          }))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" >/dev/null
          echo "$description"
          test "$state" = 'success'
