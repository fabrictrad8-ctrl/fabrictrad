name: Live Shopify production smoke tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/live-auth-smoke.yml'
      - 'src/middleware.ts'
      - 'src/app/auth/**'
      - 'src/app/api/auth/**'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  statuses: write

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Shopify storefront, account entry points and checkout shell
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -u -o pipefail
          base_url='https://www.fabrictrad.com'
          failures=0

          fail() {
            echo "::error::$1"
            failures=$((failures + 1))
          }

          fetch_page() {
            local name="$1"
            local route="$2"
            local safe_name
            safe_name=$(echo "$name" | sed 's#[^a-zA-Z0-9]#-#g')
            local output="/tmp/${safe_name}.html"
            local status
            status=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              --output "$output" --write-out '%{http_code}' "$base_url$route" || true)
            echo "${name}: HTTP ${status}"
            if [ "$status" != '200' ]; then
              fail "${name} returned HTTP ${status}; expected 200."
              return
            fi
            if grep -Eqi '<title>404 Not Found</title>|This page could not be found|Application error|Internal Server Error|NEXT_NOT_FOUND' "$output"; then
              fail "${name} rendered an error or not-found page."
            fi
          }

          # fabrictrad.com is intentionally non-canonical; Shopify owns the canonical www host.
          non_www_location=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --dump-header /tmp/non-www.headers --output /dev/null --write-out '%{http_code}' \
            --max-redirs 0 'https://fabrictrad.com/' || true)
          echo "Non-www canonical redirect: HTTP ${non_www_location}"
          if [ "$non_www_location" != '301' ] && [ "$non_www_location" != '302' ] && [ "$non_www_location" != '307' ] && [ "$non_www_location" != '308' ]; then
            fail "fabrictrad.com did not redirect to the canonical Shopify host."
          elif ! grep -Eqi '^location: https://www\.fabrictrad\.com/?' /tmp/non-www.headers; then
            cat /tmp/non-www.headers || true
            fail 'fabrictrad.com redirected somewhere other than www.fabrictrad.com.'
          fi

          fetch_page 'Home' '/'
          fetch_page 'Login' '/pages/login'
          fetch_page 'Registration' '/pages/register'
          fetch_page 'Buyer registration' '/pages/buyer-registration'
          fetch_page 'Seller registration' '/pages/seller-registration'
          fetch_page 'How to use' '/pages/how-to-use'

          # These are real Shopify pages. Authentication/authorization is enforced by the
          # FabricTrad theme + Supabase session layer; the old Next.js root routes are retired.
          fetch_page 'Buyer workspace shell' '/pages/buyer-dashboard'
          fetch_page 'Seller workspace shell' '/pages/seller-portal'
          fetch_page 'Admin workspace shell' '/pages/fabrictrad-admin'

          # Checkout and payments are Shopify-owned in production. Razorpay is configured as
          # a Shopify payment provider, so this smoke test deliberately does not probe the
          # retired /api/razorpay/* Next.js endpoints on the Shopify storefront domain.
          cart_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/cart.json --write-out '%{http_code}' "$base_url/cart.js" || true)
          echo "Shopify cart API: HTTP ${cart_status}"
          if [ "$cart_status" != '200' ]; then
            fail "Shopify cart API returned HTTP ${cart_status}; expected 200."
          elif ! grep -Eq '^\{' /tmp/cart.json; then
            fail 'Shopify cart API did not return JSON.'
          fi

          checkout_status=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --output /tmp/checkout.html --write-out '%{http_code}' "$base_url/checkout" || true)
          echo "Shopify checkout entry: HTTP ${checkout_status}"
          if [ "$checkout_status" != '200' ]; then
            fail "Shopify checkout entry returned HTTP ${checkout_status}; expected a reachable Shopify checkout/cart response."
          fi
          if grep -Eqi '<title>404 Not Found</title>|Internal Server Error' /tmp/checkout.html; then
            fail 'Shopify checkout entry rendered an error page.'
          fi

          echo "Shopify production smoke completed with ${failures} failure(s)."
          test "$failures" -eq 0

      - name: Publish verification status on the commit
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -u -o pipefail
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            state=success
            description='Shopify production smoke checks passed'
          else
            state=failure
            description='A Shopify production smoke check failed'
          fi
          payload=$(printf '{"state":"%s","context":"fabrictrad/production-smoke","description":"%s"}' "$state" "$description")
          http_code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/status-publish.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" || true)
          if [ "$http_code" != '201' ]; then
            echo "::warning::Could not publish production-smoke commit status (HTTP ${http_code})."
          fi

      - name: Fail when production verification failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
