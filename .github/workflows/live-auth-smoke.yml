name: Live production system smoke tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  statuses: write

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify production domains and critical systems
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          assert_protected_redirect() {
            local base_url="$1"
            local route="$2"
            local expected="$3"
            local safe_name
            safe_name=$(echo "$route" | sed 's#[^a-zA-Z0-9]#-#g')
            local code
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --dump-header "/tmp/protected-${safe_name}.headers" --output /dev/null \
              --write-out '%{http_code}' --max-redirs 0 "$base_url$route" || true)
            test "$code" = '307' -o "$code" = '308'
            grep -qi "^location: .*${expected}" "/tmp/protected-${safe_name}.headers"
          }

          verify_domain() {
            base_url="$1"
            safe_domain=$(echo "$base_url" | sed 's#https://##; s#[^a-zA-Z0-9]#-#g')
            healthy=false

            for attempt in $(seq 1 24); do
              home_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "/tmp/${safe_domain}-home.html" --write-out '%{http_code}' \
                "$base_url/" || true)
              login_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "/tmp/${safe_domain}-login.html" --write-out '%{http_code}' \
                "$base_url/login" || true)
              admin_login_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "/tmp/${safe_domain}-admin-login.html" --write-out '%{http_code}' \
                "$base_url/admin-login" || true)

              if [ "$home_status" = '200' ] && [ "$login_status" = '200' ] && [ "$admin_login_status" = '200' ]; then
                healthy=true
                break
              fi

              echo "Attempt ${attempt}: ${base_url} is not healthy yet (home=${home_status}, login=${login_status}, admin=${admin_login_status})"
              sleep 10
            done

            if [ "$healthy" != 'true' ]; then
              echo "${base_url} did not become healthy in time."
              return 1
            fi

            ! grep -Eqi 'Application error|Internal Server Error|NEXT_NOT_FOUND' "/tmp/${safe_domain}-home.html"
            ! grep -Eqi 'Application error|Internal Server Error|NEXT_NOT_FOUND' "/tmp/${safe_domain}-login.html"
            grep -q 'Send administrator OTP' "/tmp/${safe_domain}-admin-login.html"

            assert_protected_redirect "$base_url" '/marketplace' 'login'
            assert_protected_redirect "$base_url" '/buyer-dashboard' 'login'
            assert_protected_redirect "$base_url" '/seller-dashboard' 'login'
            assert_protected_redirect "$base_url" '/admin-portal' 'admin-login'

            demo_get_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_domain}-demo-get.json" --write-out '%{http_code}' \
              --cookie 'fabrictrad_demo_role=seller' "$base_url/api/auth/demo-session" || true)
            test "$demo_get_status" = '200'
            grep -q '"role":null' "/tmp/${safe_domain}-demo-get.json"
            grep -q '"enabled":false' "/tmp/${safe_domain}-demo-get.json"

            demo_post_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_domain}-demo-post.json" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              "$base_url/api/auth/demo-session" || true)
            test "$demo_post_status" = '404'

            invalid_reset_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_domain}-invalid-reset.json" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              "$base_url/api/auth/email-otp/request" || true)
            test "$invalid_reset_status" = '400'
            grep -q 'Email is required' "/tmp/${safe_domain}-invalid-reset.json"

            for endpoint in \
              '/api/auth/session-destination' \
              '/api/account/onboarding-draft?flow=buyer'; do
              code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output /tmp/protected-api.json --write-out '%{http_code}' \
                "$base_url$endpoint" || true)
              test "$code" = '401'
            done

            deletion_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/delete-account.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              "$base_url/api/account/delete/request" || true)
            test "$deletion_status" = '401'

            google_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_domain}-google-status.json" --write-out '%{http_code}' \
              "$base_url/api/auth/google/status" || true)
            test "$google_status" = '200'

            payment_order=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/payment-order.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              "$base_url/api/razorpay/order" || true)
            test "$payment_order" = '401'

            payment_verify=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/payment-verify.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              "$base_url/api/razorpay/verify" || true)
            test "$payment_verify" = '401'

            webhook_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/razorpay-webhook.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --header 'x-razorpay-signature: 00' --data '{}' \
              "$base_url/api/razorpay/webhook" || true)
            test "$webhook_status" = '400'
            grep -qi 'invalid signature' /tmp/razorpay-webhook.json

            shipping_create=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/shiprocket-create.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              "$base_url/api/shiprocket/create-order" || true)
            test "$shipping_create" = '401'

            shipping_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_domain}-shiprocket-status.json" --write-out '%{http_code}' \
              "$base_url/api/shiprocket/status" || true)
            test "$shipping_status" = '200'
            if ! grep -q '"configured":true' "/tmp/${safe_domain}-shiprocket-status.json"; then
              echo '::warning::Shiprocket credentials are not configured; dispatch creation will remain unavailable.'
            fi

            ai_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_domain}-ai-status.json" --write-out '%{http_code}' \
              "$base_url/api/ai/drape-on" || true)
            test "$ai_status" = '200'
            if ! grep -q '"configured":true' "/tmp/${safe_domain}-ai-status.json"; then
              echo '::warning::AI Drape has no configured OpenAI or Gemini provider.'
            fi

            echo "$base_url passed public privacy, auth, admin, payments, shipping and AI readiness checks."
          }

          verify_domain 'https://fabrictrad.com'
          verify_domain 'https://www.fabrictrad.com'

      - name: Publish verification status on the commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            state=success
            description='Production system smoke checks passed'
          else
            state=failure
            description='A production system smoke check failed'
          fi
          payload=$(printf '{"state":"%s","context":"fabrictrad/production-smoke","description":"%s"}' "$state" "$description")
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null

      - name: Fail when production verification failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
