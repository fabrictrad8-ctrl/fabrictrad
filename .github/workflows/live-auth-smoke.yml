name: Live account authentication smoke tests

on:
  push:
    branches:
      - main
      - agent/live-auth-smoke
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  live-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify production domains and protected entry points
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          verify_domain() {
            base_url="$1"
            safe_name=$(echo "$base_url" | sed 's#https://##; s#[^a-zA-Z0-9]#-#g')
            deployed=false

            for attempt in $(seq 1 40); do
              login_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "/tmp/${safe_name}-login.html" --write-out '%{http_code}' \
                "$base_url/login" || true)

              invalid_reset_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "/tmp/${safe_name}-invalid-reset.json" --write-out '%{http_code}' \
                --header 'Content-Type: application/json' --data '{}' \
                "$base_url/api/auth/email-otp/request" || true)

              buyer_demo_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "/tmp/${safe_name}-buyer-demo.json" --write-out '%{http_code}' \
                --cookie-jar "/tmp/${safe_name}-buyer.cookies" \
                --header 'Content-Type: application/json' \
                --data '{"email":"demo.buyer@fabrictrad.com","password":"FabricDemo@2026"}' \
                "$base_url/api/auth/demo-session" || true)

              if [ "$login_status" = "200" ] \
                && [ "$invalid_reset_status" = "400" ] \
                && grep -q 'Email is required' "/tmp/${safe_name}-invalid-reset.json" \
                && [ "$buyer_demo_status" = "200" ] \
                && grep -q '"role":"buyer"' "/tmp/${safe_name}-buyer-demo.json" \
                && grep -q 'fabrictrad_demo_role' "/tmp/${safe_name}-buyer.cookies"; then
                deployed=true
                break
              fi

              echo "Attempt $attempt: $base_url has not served the working authentication release yet"
              sleep 15
            done

            if [ "$deployed" != "true" ]; then
              echo "$base_url did not serve the working authentication release in time."
              cat "/tmp/${safe_name}-invalid-reset.json" 2>/dev/null || true
              cat "/tmp/${safe_name}-buyer-demo.json" 2>/dev/null || true
              return 1
            fi

            buyer_marketplace_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_name}-buyer-marketplace.html" --write-out '%{http_code}' \
              --cookie "/tmp/${safe_name}-buyer.cookies" --max-redirs 0 \
              "$base_url/marketplace")
            test "$buyer_marketplace_status" = "200"

            seller_demo_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_name}-seller-demo.json" --write-out '%{http_code}' \
              --cookie-jar "/tmp/${safe_name}-seller.cookies" \
              --header 'Content-Type: application/json' \
              --data '{"email":"demo.seller@fabrictrad.com","password":"FabricDemo@2026"}' \
              "$base_url/api/auth/demo-session")
            test "$seller_demo_status" = "200"
            grep -q '"role":"seller"' "/tmp/${safe_name}-seller-demo.json"
            grep -q 'fabrictrad_demo_role' "/tmp/${safe_name}-seller.cookies"

            seller_dashboard_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_name}-seller-dashboard.html" --write-out '%{http_code}' \
              --cookie "/tmp/${safe_name}-seller.cookies" --max-redirs 0 \
              "$base_url/seller-dashboard")
            test "$seller_dashboard_status" = "200"

            invalid_demo_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_name}-invalid-demo.json" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"email":"demo.buyer@fabrictrad.com","password":"wrong-password"}' \
              "$base_url/api/auth/demo-session")
            test "$invalid_demo_status" = "401"
            grep -q 'Invalid login credentials' "/tmp/${safe_name}-invalid-demo.json"

            home_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_name}-home.html" --write-out '%{http_code}' "$base_url/")
            test "$home_status" = "200"

            public_marketplace_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --dump-header "/tmp/${safe_name}-public-marketplace.headers" --output /dev/null \
              --write-out '%{http_code}' --max-redirs 0 "$base_url/marketplace")
            test "$public_marketplace_status" = "307" -o "$public_marketplace_status" = "308"
            grep -qi '^location: .*login' "/tmp/${safe_name}-public-marketplace.headers"

            admin_login_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_name}-admin-login.html" --write-out '%{http_code}' \
              "$base_url/admin-login")
            test "$admin_login_status" = "200"
            grep -q 'Send administrator OTP' "/tmp/${safe_name}-admin-login.html"

            google_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "/tmp/${safe_name}-google-status.json" --write-out '%{http_code}' \
              "$base_url/api/auth/google/status")
            test "$google_status" = "200"

            echo "$base_url passed live buyer, seller and administrator entry checks."
          }

          verify_domain 'https://fabrictrad.com'
          verify_domain 'https://www.fabrictrad.com'

          # This branch-only probe sends exactly one real code to the configured
          # administrator inbox. It validates the deployed Worker secret, Resend
          # authentication, Supabase token generation and the public API contract.
          if [ "${GITHUB_REF}" = "refs/heads/agent/live-auth-smoke" ]; then
            otp_status=$(curl --silent --show-error --connect-timeout 15 --max-time 45 \
              --output /tmp/admin-otp-response.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"email":"fabrictrad8@gmail.com"}' \
              'https://fabrictrad.com/api/auth/admin-otp/request')
            echo "Administrator OTP endpoint returned HTTP ${otp_status}"
            cat /tmp/admin-otp-response.json
            echo
            test "$otp_status" = "200"
            grep -q '"sent":true' /tmp/admin-otp-response.json
            grep -q '"method":"email_otp"' /tmp/admin-otp-response.json
          fi

      - name: Publish verification status on the commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            state=success
            description='Production buyer, seller and administrator entry checks passed'
          else
            state=failure
            description='A production domain or live authentication check failed'
          fi
          payload=$(printf '{"state":"%s","context":"fabrictrad/live-auth","description":"%s"}' "$state" "$description")
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null

      - name: Fail when the live verification failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
