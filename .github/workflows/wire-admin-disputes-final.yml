name: Wire administrator disputes final

on:
  push:
    branches:
      - agent/shopify-platform-overhaul

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[admin-disputes-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shopify-platform-overhaul
          fetch-depth: 0
      - name: Wire dispute workspace
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          layout = 'src/app/admin-portal/components/AdminPortalLayout.tsx'
          replace_once(
              layout,
              "import AdminSellerMetrics from '@/app/admin-portal/components/AdminSellerMetrics';\n",
              "import AdminSellerMetrics from '@/app/admin-portal/components/AdminSellerMetrics';\nimport AdminDisputes from '@/app/admin-portal/components/AdminDisputes';\n"
          )
          replace_once(
              layout,
              "  | 'payments'\n  | 'reconciliation'",
              "  | 'payments'\n  | 'disputes'\n  | 'reconciliation'"
          )
          replace_once(
              layout,
              "      { key: 'payments', label: 'Payments', icon: 'CreditCardIcon', description: 'Captures, failures and refunds' },\n      { key: 'reconciliation'",
              "      { key: 'payments', label: 'Payments', icon: 'CreditCardIcon', description: 'Captures, failures and refunds' },\n      { key: 'disputes', label: 'Returns & disputes', icon: 'ChatBubbleLeftRightIcon', description: 'Evidence, resolutions and refund reviews' },\n      { key: 'reconciliation'"
          )
          replace_once(
              layout,
              "            {activeTab === 'payments' && <AdminPayments />}\n            {activeTab === 'reconciliation'",
              "            {activeTab === 'payments' && <AdminPayments />}\n            {activeTab === 'disputes' && <AdminDisputes />}\n            {activeTab === 'reconciliation'"
          )

          search = 'src/app/admin-portal/components/AdminCommandSearch.tsx'
          replace_once(
              search,
              "  { id: 'nav-payments', kind: 'Navigation', title: 'Payments', subtitle: 'Razorpay captures, failures and refunds', href: '/admin-portal?tab=payments', icon: 'CreditCardIcon' },\n  { id: 'nav-reconciliation'",
              "  { id: 'nav-payments', kind: 'Navigation', title: 'Payments', subtitle: 'Razorpay captures, failures and refunds', href: '/admin-portal?tab=payments', icon: 'CreditCardIcon' },\n  { id: 'nav-disputes', kind: 'Navigation', title: 'Returns & disputes', subtitle: 'Evidence, resolutions and refund reviews', href: '/admin-portal?tab=disputes', icon: 'ChatBubbleLeftRightIcon' },\n  { id: 'nav-reconciliation'"
          )

          Path('.github/workflows/wire-admin-disputes-final.yml').unlink()
      - name: Commit dispute navigation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/admin-portal/components/AdminPortalLayout.tsx src/app/admin-portal/components/AdminCommandSearch.tsx
          git add -u .github/workflows/wire-admin-disputes-final.yml
          git commit -m 'feat: expose administrator dispute workspace [admin-disputes-final]'
          git push origin HEAD:agent/shopify-platform-overhaul
