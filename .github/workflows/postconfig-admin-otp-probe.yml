name: Post-config administrator OTP probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a real administrator email OTP
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --output "$body_file" --write-out '%{http_code}' \
            --request POST 'https://fabrictrad.com/api/auth/admin-otp/request' \
            --header 'Content-Type: application/json' \
            --data '{"email":"fabrictrad8@gmail.com"}')"
          echo "HTTP status: $status"
          cat "$body_file"
          echo
          test "$status" = "200"
          grep -q '"sent":true' "$body_file"
          grep -q '"method":"email_otp"' "$body_file"
