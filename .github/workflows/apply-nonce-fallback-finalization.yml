name: Apply nonce fallback finalization

on:
  push:
    branches:
      - agent/remove-service-role-signup-dependency

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nonce-fallback-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-service-role-signup-dependency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply nonce fallback finalization
        run: node scripts/apply-nonce-fallback-finalization.mjs
      - name: Commit patches
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260730213000_signup_nonce_registration_fallback.sql .github/workflows/quality.yml
          git commit -m 'Finalize secure signup nonce fallback [nonce-fallback-patched]'
          git push origin HEAD:agent/remove-service-role-signup-dependency
