name: Full-role visual and interaction QA

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      FABRICTRAD_ENABLE_AUDIT_ADMIN: 'true'
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify OAuth recovery safeguards
        run: npm run verify:oauth-recovery

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Test public, buyer, seller, admin and OAuth recovery experiences
        run: npx playwright test tests/e2e/sitewide-role-visual.spec.ts tests/e2e/oauth-recovery.spec.ts tests/e2e/whatsapp-custom-order.spec.ts

      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrictrad-full-role-browser-qa
          path: |
            playwright-report
            test-results/sitewide
          retention-days: 14
          if-no-files-found: ignore
