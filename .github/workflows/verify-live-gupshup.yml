name: Verify live Gupshup webhook

on:
  push:
    branches: [main]
    paths:
      - 'src/app/api/integrations/whatsapp/webhook/route.ts'
      - 'src/app/api/whatsapp/status/route.ts'
      - 'src/lib/gupshupWebhookV3.ts'
      - 'src/lib/gupshupWhatsApp.ts'
      - '.github/workflows/verify-live-gupshup.yml'
  workflow_dispatch:

permissions:
  contents: write

# Re-probe marker: seller catalogue release 2026-09-04.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe real production endpoints
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p .github/deployments
          base='https://fabrictrad.com'
          webhook="$base/api/integrations/whatsapp/webhook"
          status_url="$base/api/whatsapp/status"

          get_code='000'
          post_code='000'
          status_code='000'
          : > /tmp/get.out
          : > /tmp/post.out
          echo '{}' > /tmp/status.json

          v3_probe='{"object":"whatsapp_business_account","gs_app_id":"__fabrictrad_live_probe__","entry":[{"changes":[{"field":"messages","value":{"messaging_product":"whatsapp","statuses":[{"type":"set-callback"}]}}]}]}'

          for attempt in $(seq 1 5); do
            get_code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/get.out -w '%{http_code}' "$webhook" || true)
            post_code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/post.out -w '%{http_code}' -H 'Content-Type: application/json' --data "$v3_probe" "$webhook" || true)
            status_code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/status.json -w '%{http_code}' "$status_url" || true)
            interactive=$(grep -o '"interactiveRepliesReady":true' /tmp/status.json || true)
            v3=$(grep -o '"payloadFormat":"meta_v3_with_gupshup_v2_fallback"' /tmp/status.json || true)
            app_name=$(grep -o '"appName":true' /tmp/status.json || true)
            echo "Attempt ${attempt}: GET=${get_code}; POST=${post_code}; STATUS=${status_code}; interactive=$([ -n "$interactive" ] && echo yes || echo no); v3=$([ -n "$v3" ] && echo yes || echo no); app-name=$([ -n "$app_name" ] && echo yes || echo no)"
            if [ "$get_code" = '204' ] && [ "$post_code" = '401' ] && [ "$status_code" = '200' ] && [ ! -s /tmp/get.out ] && [ ! -s /tmp/post.out ] && [ -n "$v3" ] && [ -n "$app_name" ]; then
              break
            fi
            sleep 10
          done

          GET_CODE="$get_code" POST_CODE="$post_code" STATUS_CODE="$status_code" python3 - <<'PY'
          import json, os, pathlib, datetime

          def load_json(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}

          status = load_json('/tmp/status.json')
          required = status.get('required') if isinstance(status, dict) else {}
          channel = required.get('channel', {}) if isinstance(required, dict) else {}
          templates = required.get('templates', {}) if isinstance(required, dict) else {}
          webhook = status.get('webhook', {}) if isinstance(status, dict) else {}
          get_code = os.environ.get('GET_CODE', '000')
          post_code = os.environ.get('POST_CODE', '000')
          status_code = os.environ.get('STATUS_CODE', '000')
          get_empty = pathlib.Path('/tmp/get.out').exists() and pathlib.Path('/tmp/get.out').stat().st_size == 0
          post_empty = pathlib.Path('/tmp/post.out').exists() and pathlib.Path('/tmp/post.out').stat().st_size == 0
          webhook_security_verified = (
              get_code == '204' and post_code == '401' and status_code == '200'
              and get_empty and post_empty
              and status.get('provider') == 'gupshup'
              and status.get('audience') == 'sellers_only'
              and status.get('buyerMessagingEnabled') is False
              and webhook.get('access') == 'public'
              and webhook.get('validation') == 'shared_secret_and_provider_identity'
              and webhook.get('acknowledgement') == 'empty_204'
              and webhook.get('payloadFormat') == 'meta_v3_with_gupshup_v2_fallback'
          )
          webhook_live = webhook_security_verified and status.get('webhookReady') is True
          interactive_live = (
              webhook_live
              and status.get('interactiveRepliesReady') is True
              and status.get('configured') is True
              and status.get('appIdentityStrategy') in ('environment', 'application_config')
              and channel.get('apiKey') is True
              and channel.get('appName') is True
              and channel.get('sourceNumber') is True
          )
          result = {
              'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'baseUrl': 'https://fabrictrad.com',
              'webhookUrl': 'https://fabrictrad.com/api/integrations/whatsapp/webhook',
              'http': {
                  'webhookGet': get_code,
                  'webhookPostMetaV3': post_code,
                  'status': status_code,
                  'getBodyEmpty': get_empty,
                  'postBodyEmpty': post_empty,
              },
              'webhookLive': webhook_live,
              'webhookSecurityVerified': webhook_security_verified,
              'providerCallbackDeliveryVerified': False,
              'buyerMessagingEnabled': status.get('buyerMessagingEnabled'),
              'audience': status.get('audience'),
              'interactiveRuntimeLive': interactive_live,
              'provider': status.get('provider'),
              'configured': status.get('configured'),
              'channelReady': status.get('channelReady'),
              'interactiveRepliesReady': status.get('interactiveRepliesReady'),
              'webhookReady': status.get('webhookReady'),
              'automationReady': status.get('automationReady'),
              'proactiveAutomationReady': status.get('proactiveAutomationReady'),
              'templatesReady': status.get('templatesReady'),
              'appIdentityStrategy': status.get('appIdentityStrategy'),
              'businessNumber': status.get('businessNumber'),
              'channelFieldsPresent': channel,
              'templateFieldsPresent': templates,
              'webhook': webhook,
          }
          pathlib.Path('.github/deployments/gupshup-live-status.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Record production proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FabricTrad Release Bot'
          git config user.email 'fabrictrad8@gmail.com'
          git add .github/deployments/gupshup-live-status.json
          if git diff --cached --quiet; then
            echo 'Production proof unchanged.'
          else
            git commit -m 'chore: record authenticated seller WhatsApp readiness [skip deploy] [skip validation] [skip integration audit]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabrictrad-seller-whatsapp-readiness
          path: .github/deployments/gupshup-live-status.json

      - name: Enforce authenticated seller callback contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('.github/deployments/gupshup-live-status.json', encoding='utf-8'))
          if not data.get('webhookSecurityVerified'):
              raise SystemExit('Production must reject unauthenticated WhatsApp POSTs and restrict the channel to sellers.')
          if not data.get('webhookReady'):
              raise SystemExit('Configure the same 32-character-or-longer callback secret in Gupshup and GUPSHUP_WEBHOOK_SECRET on the live Worker.')
          if not data.get('interactiveRuntimeLive'):
              raise SystemExit('Seller WhatsApp channel credentials are incomplete.')
          print('Seller WhatsApp authentication and configuration checks passed. Real provider delivery still needs a seller upload test.')
          PY
