name: Apply HSN and GST UI hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hsn-tax-ui-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch tax classification UI and API
        run: python scripts/apply-hsn-tax-ui-hotfix.py

      - name: Validate patch
        run: |
          npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps
          npm run type-check
          npm run lint -- --quiet

      - name: Commit hardened tax UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/product-detail/components/ProductInfoV2.tsx src/app/seller-product-rules/page.tsx src/app/api/seller/product-rules/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "tax: enforce HSN and current GST calculation in UI"
          git pull --rebase origin main
          git push origin HEAD:main
