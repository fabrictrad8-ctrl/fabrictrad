name: Harden existing-account login recovery

on:
  push:
    branches:
      - agent/shopify-platform-overhaul

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[login-provisioning-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shopify-platform-overhaul
          fetch-depth: 0
      - name: Make profile repair non-blocking for valid accounts
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/contexts/AuthContext.tsx')
          text = path.read_text()
          old = """    if (data.user) {
      const provisionResponse = await fetch('/api/auth/provision-account', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(data.session?.access_token
            ? { Authorization: `Bearer ${data.session.access_token}` }
            : {}),
        },
        credentials: 'same-origin',
        cache: 'no-store',
        body: '{}',
      });
      const provisionPayload = await provisionResponse.json().catch(() => ({}));
      if (!provisionResponse.ok) {
        throw new Error(provisionPayload?.error || 'Your account profile could not be prepared. Please try again.');
      }

      const loadedProfile = await loadProfile(data.user.id).catch(() => null);
      if (loadedProfile?.role) accountRole = loadedProfile.role;
    }
"""
          new = """    if (data.user) {
      let provisioningError = '';
      try {
        const provisionResponse = await fetch('/api/auth/provision-account', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(data.session?.access_token
              ? { Authorization: `Bearer ${data.session.access_token}` }
              : {}),
          },
          credentials: 'same-origin',
          cache: 'no-store',
          body: '{}',
        });
        const provisionPayload = await provisionResponse.json().catch(() => ({}));
        if (!provisionResponse.ok) {
          provisioningError =
            provisionPayload?.error || 'Your account profile could not be prepared. Please try again.';
        }
      } catch {
        provisioningError = 'Your account profile could not be prepared. Please try again.';
      }

      const loadedProfile = await loadProfile(data.user.id).catch(() => null);
      if (!loadedProfile) {
        throw new Error(provisioningError || 'Your account profile could not be loaded. Please try again.');
      }
      if (loadedProfile.is_active === false) {
        throw new Error('This account is inactive. Contact FabricTrad support.');
      }
      if (loadedProfile.role) accountRole = loadedProfile.role;
    }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one sign-in provisioning block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          verifier = Path('scripts/verify-oauth-recovery.mjs')
          verifier_text = verifier.read_text()
          anchor = "assert(!accountLogin.includes(\"type LoginRole = 'buyer' | 'seller'\"), 'Login must not require the user to choose a duplicate buyer/seller identity.');\n"
          addition = anchor + "assert(accountLogin.includes(\"loadedProfile.is_active === false\"), 'Existing active profiles must survive non-critical provisioning repair failures.');\n"
          if anchor not in verifier_text:
              raise SystemExit('OAuth recovery verifier anchor not found')
          verifier.write_text(verifier_text.replace(anchor, addition, 1))

          Path('.github/workflows/harden-login-provisioning.yml').unlink()
      - name: Commit login hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contexts/AuthContext.tsx scripts/verify-oauth-recovery.mjs
          git add -u .github/workflows/harden-login-provisioning.yml
          git commit -m 'fix: keep valid accounts signed in when profile repair is non-critical [login-provisioning-hardened]'
          git push origin HEAD:agent/shopify-platform-overhaul
