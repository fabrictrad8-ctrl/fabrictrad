name: Apply live login handoff fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[live-login-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove Supabase auth callback deadlock and force live navigation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/contexts/AuthContext.tsx',
              """      if (nextSession?.user) {
        void loadProfile(nextSession.user.id).catch(() => setProfile(null));
      } else {
        setProfile(null);
      }
      setLoading(false);""",
              """      if (nextSession?.user) {
        const authenticatedUserId = nextSession.user.id;
        // Supabase currently warns that making another async Supabase API call
        // directly inside onAuthStateChange can deadlock the auth operation.
        // Defer profile hydration until the callback has returned so password
        // sign-in resolves immediately and the login page can navigate live.
        window.setTimeout(() => {
          if (cancelled || demoActiveRef.current) return;
          void loadProfile(authenticatedUserId).catch(() => setProfile(null));
        }, 0);
      } else {
        setProfile(null);
      }
      setLoading(false);"""
          )

          replace_once(
              'src/app/login/EmailOtpLoginClient.tsx',
              """      router.replace(destinationForRole(role, requestedNext));
      router.refresh();""",
              """      // A full navigation guarantees that server middleware reads the newly
      // persisted Supabase session on the first attempt. This avoids requiring
      // users to refresh the login page before their workspace appears.
      window.location.replace(destinationForRole(role, requestedNext));"""
          )

          workflow = Path('.github/workflows/fix-live-login-handoff.yml')
          workflow.unlink()

      - name: Commit live login fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contexts/AuthContext.tsx src/app/login/EmailOtpLoginClient.tsx
          git add -u .github/workflows/fix-live-login-handoff.yml
          git commit -m 'fix: open authenticated workspace without reload [live-login-fixed]'
          git push origin HEAD:main
