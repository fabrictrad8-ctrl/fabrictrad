name: Release FabricTrad UI to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabrictrad-production-worker
  cancel-in-progress: false

jobs:
  database:
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip ui deploy]')) }}
    uses: ./.github/workflows/database-migrations.yml
  release-ui:
    needs: database
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[skip ui deploy]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '2'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify source
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          npm run lint -- --quiet

      - name: Build production Worker
        id: build
        run: npm run build:sites

      - name: Verify Cloudflare authentication
        id: cloudflare
        run: npx wrangler whoami

      - name: Promote UI release on existing FabricTrad Worker
        id: deploy
        shell: bash
        run: bash scripts/deploy-cloudflare-worker-version.sh wrangler.jsonc

      - name: Install Chromium for live visual verification
        run: npx playwright install --with-deps chromium

      - name: Verify live production routes and logo asset
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          LOGO_URL='https://fabrictrad.com/assets/brand/fabrictrad-logo-horizontal.png'
          cache_bust="${GITHUB_SHA}-live"

          home_code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            -H 'Cache-Control: no-cache' \
            --output /tmp/fabrictrad-home.html --write-out '%{http_code}' \
            "https://fabrictrad.com/?release=${cache_bust}" || true)
          login_code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            -H 'Cache-Control: no-cache' \
            --output /tmp/fabrictrad-login.html --write-out '%{http_code}' \
            "https://fabrictrad.com/login?release=${cache_bust}" || true)
          howto_code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            -H 'Cache-Control: no-cache' \
            --output /tmp/fabrictrad-howto.html --write-out '%{http_code}' \
            "https://fabrictrad.com/how-to-use/start?release=${cache_bust}" || true)
          logo_code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            --output /tmp/fabrictrad-logo.png --write-out '%{http_code}' \
            "$LOGO_URL" || true)

          echo "Live HTTP: home=${home_code} login=${login_code} how-to-use=${howto_code} logo=${logo_code}"
          test "$home_code" = '200'
          test "$login_code" = '200'
          test "$howto_code" = '200'
          test "$logo_code" = '200'
          grep -Fq 'fabrictrad-textile-showroom-2026-09-05' /tmp/fabrictrad-home.html
          file /tmp/fabrictrad-logo.png | grep -Fq 'PNG image data, 984 x 220'

      - name: Verify the visible top-left logo in a real browser
        id: browser_logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/live-brand
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const expected = 'fabrictrad-logo-horizontal.png';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1,
          });
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(error.message));

          try {
            await page.goto(`https://fabrictrad.com/?brand-check=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.locator('html[data-fabrictrad-ready="true"]').waitFor({ timeout: 20000 });

            const logo = page.locator(`header img[src*="${expected}"]`).first();
            await logo.waitFor({ state: 'visible', timeout: 20000 });

            const details = await logo.evaluate((img) => ({
              src: img.currentSrc || img.src,
              naturalWidth: img.naturalWidth,
              naturalHeight: img.naturalHeight,
              complete: img.complete,
              alt: img.alt,
            }));
            const box = await logo.boundingBox();

            if (!details.complete || details.naturalWidth !== 984 || details.naturalHeight !== 220) {
              throw new Error(`Official logo image did not load correctly: ${JSON.stringify(details)}`);
            }
            if (!details.src.includes(expected)) {
              throw new Error(`Visible header logo uses the wrong asset: ${details.src}`);
            }
            if (!box || box.width < 120 || box.height < 25) {
              throw new Error(`Visible header logo is missing or too small: ${JSON.stringify(box)}`);
            }

            const language = page.locator('[data-language-control="embedded"] select').first();
            await language.selectOption('hi');
            await page.locator('html[lang="hi"]').waitFor();
            await language.selectOption('gu');
            await page.locator('html[lang="gu"]').waitFor();
            await language.selectOption('en');
            await page.locator('html[lang="en"]').waitFor();
            const textile = await page.locator('img[src*="textile-showroom"]').evaluate(img => ({ complete: img.complete, width: img.naturalWidth }));
            if (!textile.complete || textile.width < 400) throw new Error('The new textile image did not load');
            if (pageErrors.length) throw new Error(`Live page runtime errors: ${pageErrors.join('; ')}`);

            const header = page.locator('header').first();
            await header.screenshot({ path: 'test-results/live-brand/fabrictrad-live-header.png' });
            fs.writeFileSync(
              'test-results/live-brand/verification.json',
              JSON.stringify({ url: page.url(), details, box }, null, 2) + '\n',
            );
            console.log('VISIBLE OFFICIAL FABRICTRAD LOGO VERIFIED', JSON.stringify({ details, box }));

            // Verify public media on the deployed Worker, including range requests
            // used by mobile browsers, without creating accounts or sending messages.
            for (const role of ['buyer', 'seller']) {
              for (const audio of ['en', 'hi', 'gu']) {
                const media = await page.request.get(`https://fabrictrad.com/guides/${role}-${audio}.mp4`, {
                  headers: { Range: 'bytes=0-1023' }, timeout: 20000,
                });
                // A server is allowed to ignore Range and answer 200 with the whole
                // body (RFC 9110 14.2), which is exactly what Cloudflare does for
                // these assets. Demanding 206 failed every release from 2026-09-05
                // onward even though the videos played perfectly -- and because this
                // check runs after the Worker is already promoted, it turned the
                // release red without stopping anything, training everyone to ignore
                // a failed release. What actually matters is that real mp4 bytes come
                // back, so assert that instead; playback itself is proven below by
                // driving the <video> element.
                const mediaBody = await media.body();
                const isMp4 = mediaBody.length > 8 && mediaBody.subarray(4, 8).toString('latin1') === 'ftyp';
                if (![200, 206].includes(media.status()) || !media.headers()['content-type']?.includes('video/mp4') || !isMp4) {
                  throw new Error(`Public guide streaming failed for ${role}-${audio}: status ${media.status()}, ${mediaBody.length} bytes, mp4=${isMp4}`);
                }
                if (media.status() === 200) {
                  console.log(`Note: ${role}-${audio}.mp4 ignored the Range request and returned the full body.`);
                }
                const captions = await page.request.get(`https://fabrictrad.com/guides/${role}-${audio}.vtt`);
                if (captions.status() !== 200 || !(await captions.text()).startsWith('WEBVTT')) {
                  throw new Error(`Public captions failed for ${role}-${audio}`);
                }
                await page.goto(`https://fabrictrad.com/how-to-use?role=${role}&audio=${audio}`, { waitUntil: 'domcontentloaded' });
                const video = page.locator('[data-narrated-guide] video');
                await video.waitFor({ state: 'visible', timeout: 20000 });
                await page.waitForFunction((expected) => {
                  const video = document.querySelector('[data-narrated-guide] video');
                  return video instanceof HTMLVideoElement && video.src.endsWith(expected) && video.readyState >= 1 && video.duration > 60 && !video.error;
                }, `/guides/${role}-${audio}.mp4`, { timeout: 20000 });
                await video.evaluate(video => { video.muted = true; return video.play(); });
                await page.waitForFunction(() => document.querySelector('[data-narrated-guide] video')?.currentTime > 0, null, { timeout: 15000 });
                await video.evaluate(video => video.pause());
              }
            }
            const privateInvoice = await page.request.get('https://fabrictrad.com/api/invoices/10000000-0000-0000-0000-000000000001', { maxRedirects: 0 });
            if (![302, 303, 307, 308, 401, 403].includes(privateInvoice.status())) throw new Error(`Invoice privacy check failed: ${privateInvoice.status()}`);
            if (pageErrors.length) throw new Error(`Live guide runtime errors: ${pageErrors.join('; ')}`);
            console.log('SIX LIVE NARRATED GUIDES AND PRIVATE INVOICE ACCESS VERIFIED');
          } catch (error) {
            await page.screenshot({ path: 'test-results/live-brand/failure.png', fullPage: true }).catch(() => undefined);
            fs.writeFileSync('test-results/live-brand/failure.html', await page.content());
            fs.writeFileSync('test-results/live-brand/errors.json', JSON.stringify(pageErrors, null, 2));
            throw error;
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload live FabricTrad brand proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrictrad-live-brand-proof
          path: test-results/live-brand
          retention-days: 14
          if-no-files-found: warn

      - name: Record UI release result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CLOUDFLARE_OUTCOME: ${{ steps.cloudflare.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          BROWSER_LOGO_OUTCOME: ${{ steps.browser_logo.outcome }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = {
            sourceCommit: process.env.GITHUB_SHA,
            recordedAt: new Date().toISOString(),
            install: process.env.INSTALL_OUTCOME || 'skipped',
            sourceVerification: process.env.VERIFY_OUTCOME || 'skipped',
            workerBuild: process.env.BUILD_OUTCOME || 'skipped',
            cloudflareAuthentication: process.env.CLOUDFLARE_OUTCOME || 'skipped',
            workerDeployment: process.env.DEPLOY_OUTCOME || 'skipped',
            publicUiSmoke: process.env.SMOKE_OUTCOME || 'skipped',
            visibleOfficialLogo: process.env.BROWSER_LOGO_OUTCOME || 'skipped',
          };
          fs.mkdirSync('.github/deployments', { recursive: true });
          fs.writeFileSync('.github/deployments/ui-release-status.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/ui-release-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record UI production release [skip deploy] [skip ui deploy] [skip validation] [skip integration audit]'
            git pull --rebase -X theirs origin main || true
            git push origin HEAD:main || true
          fi
