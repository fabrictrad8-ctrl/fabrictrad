name: Catalog overhaul diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --silent --no-audit --no-fund --package-lock=false --legacy-peer-deps
      - name: Capture TypeScript output
        id: typecheck
        continue-on-error: true
        shell: bash
        run: npm run type-check -- --pretty false > /tmp/typescript.log 2>&1
      - name: Upload TypeScript output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-overhaul-typescript
          path: /tmp/typescript.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure status
        if: steps.typecheck.outcome != 'success'
        run: exit 1
