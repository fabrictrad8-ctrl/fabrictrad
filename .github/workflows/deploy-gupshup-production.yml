name: Deploy Gupshup WhatsApp production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-gupshup-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrictrad-gupshup-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  GUPSHUP_API_KEY: ${{ secrets.GUPSHUP_API_KEY || vars.GUPSHUP_API_KEY }}
  GUPSHUP_APP_NAME: ${{ secrets.GUPSHUP_APP_NAME || vars.GUPSHUP_APP_NAME }}
  GUPSHUP_SOURCE_NUMBER: ${{ secrets.GUPSHUP_SOURCE_NUMBER || vars.GUPSHUP_SOURCE_NUMBER }}
  GUPSHUP_WABA_ID: ${{ secrets.GUPSHUP_WABA_ID || vars.GUPSHUP_WABA_ID }}
  WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER: ${{ secrets.WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER || vars.WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER }}
  WHATSAPP_TEMPLATE_PAYMENT_REMINDER: ${{ secrets.WHATSAPP_TEMPLATE_PAYMENT_REMINDER || vars.WHATSAPP_TEMPLATE_PAYMENT_REMINDER }}
  WHATSAPP_TEMPLATE_TRIAL_REMINDER: ${{ secrets.WHATSAPP_TEMPLATE_TRIAL_REMINDER || vars.WHATSAPP_TEMPLATE_TRIAL_REMINDER }}
  WHATSAPP_TEMPLATE_DELIVERY_UPDATE: ${{ secrets.WHATSAPP_TEMPLATE_DELIVERY_UPDATE || vars.WHATSAPP_TEMPLATE_DELIVERY_UPDATE }}
  WHATSAPP_TEMPLATE_REVIEW_REQUEST: ${{ secrets.WHATSAPP_TEMPLATE_REVIEW_REQUEST || vars.WHATSAPP_TEMPLATE_REVIEW_REQUEST }}
  WHATSAPP_TEMPLATE_POST_DELIVERY_FOLLOW_UP: ${{ secrets.WHATSAPP_TEMPLATE_POST_DELIVERY_FOLLOW_UP || vars.WHATSAPP_TEMPLATE_POST_DELIVERY_FOLLOW_UP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify secure deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN GUPSHUP_API_KEY GUPSHUP_APP_NAME GUPSHUP_SOURCE_NUMBER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secure value ${name} is missing."
              missing=1
            else
              echo "${name}=present"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Type-check Gupshup runtime
        run: npm run type-check

      - name: Lint Gupshup runtime
        run: npx eslint src/lib/gupshupWhatsApp.ts src/lib/whatsappBuyerAutomation.ts src/lib/bespokeFollowUps.ts src/app/api/integrations/whatsapp/webhook/route.ts src/app/api/whatsapp/status/route.ts

      - name: Build Cloudflare/OpenNext package
        run: npm run build:sites

      - name: Validate Worker package
        shell: bash
        run: |
          set -euo pipefail
          test -s .open-next/worker.js
          grep -q 'GUPSHUP_API_KEY' .open-next/worker.js
          grep -q 'api.gupshup.io' .open-next/worker.js
          echo 'OpenNext Worker contains the Gupshup runtime.'

      - name: Sync required Gupshup Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/tmp/wrangler-${name}.log 2>&1
              echo "${name}=synced"
            fi
          }
          put_secret GUPSHUP_API_KEY
          put_secret GUPSHUP_APP_NAME
          put_secret GUPSHUP_SOURCE_NUMBER
          put_secret GUPSHUP_WABA_ID
          put_secret WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER
          put_secret WHATSAPP_TEMPLATE_PAYMENT_REMINDER
          put_secret WHATSAPP_TEMPLATE_TRIAL_REMINDER
          put_secret WHATSAPP_TEMPLATE_DELIVERY_UPDATE
          put_secret WHATSAPP_TEMPLATE_REVIEW_REQUEST
          put_secret WHATSAPP_TEMPLATE_POST_DELIVERY_FOLLOW_UP

      - name: Verify required Cloudflare bindings by name
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list > /tmp/cloudflare-secrets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/cloudflare-secrets.json').read_text())
          names={str(x.get('name','')) for x in data if isinstance(x,dict)}
          required={'GUPSHUP_API_KEY','GUPSHUP_APP_NAME','GUPSHUP_SOURCE_NUMBER'}
          missing=sorted(required-names)
          if missing:
              raise SystemExit('Missing required Cloudflare binding names: '+', '.join(missing))
          print('Required Gupshup Cloudflare bindings are present.')
          PY

      - name: Deploy FabricTrad Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy

      - name: Wait for production propagation
        run: sleep 12

      - name: Prove Gupshup production callback is live
        shell: bash
        run: |
          set -euo pipefail
          base='https://fabrictrad.com'

          for attempt in 1 2 3 4 5 6; do
            status_code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/wa-status.json --write-out '%{http_code}' \
              "$base/api/whatsapp/status" || true)
            callback_get=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/wa-get.out --write-out '%{http_code}' \
              "$base/api/integrations/whatsapp/webhook" || true)
            callback_post=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/wa-post.out --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"type":"user-event","version":2,"app":"__fabrictrad_registration_probe__","payload":{"type":"sandbox-start"}}' \
              "$base/api/integrations/whatsapp/webhook" || true)

            echo "Attempt ${attempt}: status=${status_code}, webhook GET=${callback_get}, webhook POST=${callback_post}"
            if [ "$status_code" = '200' ] && [ "$callback_get" = '204' ] && [ "$callback_post" = '204' ] \
              && grep -q '"provider":"gupshup"' /tmp/wa-status.json \
              && grep -q '"configured":true' /tmp/wa-status.json \
              && grep -q '"webhookReady":true' /tmp/wa-status.json \
              && [ ! -s /tmp/wa-get.out ] && [ ! -s /tmp/wa-post.out ]; then
              echo 'Gupshup production webhook is live and registration-safe.'
              exit 0
            fi
            sleep 10
          done

          echo 'WhatsApp status response:'
          cat /tmp/wa-status.json || true
          echo
          echo '::error::Gupshup production callback did not become ready in the allotted propagation window.'
          exit 1
