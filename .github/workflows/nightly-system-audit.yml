name: Nightly FabricTrad full-system audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read

concurrency:
  group: fabrictrad-nightly-system-audit
  cancel-in-progress: true

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      FABRICTRAD_ENABLE_AUDIT_ADMIN: 'true'
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Audit internal links
        run: node scripts/audit-internal-links.mjs

      - name: Verify account lifecycle
        run: node scripts/verify-account-lifecycle.mjs

      - name: Verify marketplace, payment, invoice and dispute invariants
        run: node scripts/verify-marketplace-integrity.mjs

      - name: Verify OAuth and account recovery
        run: node scripts/verify-oauth-recovery.mjs

      - name: Verify public-home privacy
        run: node scripts/verify-public-home-privacy.mjs

      - name: Verify role workspace isolation
        run: node scripts/verify-role-workspace-ui.mjs

      - name: Verify seller onboarding and approval safeguards
        run: node scripts/verify-seller-onboarding.mjs

      - name: Verify mobile persistence and WhatsApp ingestion
        run: node scripts/verify-mobile-whatsapp.mjs

      - name: Verify database security migrations
        run: node scripts/verify-database-security.mjs

      - name: Production build
        run: npm run build

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run full-role browser QA
        run: npx playwright test tests/e2e/sitewide-role-visual.spec.ts tests/e2e/oauth-recovery.spec.ts

      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrictrad-nightly-browser-qa
          path: |
            playwright-report
            test-results/sitewide
          retention-days: 14
          if-no-files-found: ignore
