name: Repair and verify FabricTrad live domains

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/live-domain-repair.yml'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrictrad-live-domain-repair
  cancel-in-progress: false

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fabrictrad
      ZONE_NAME: fabrictrad.com
      WORKERS_DEV_URL: https://fabrictrad.fabrictrad8.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect Cloudflare repair credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare repair credentials are available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Cloudflare repair credentials are not configured in GitHub Actions. Public diagnostics will still run.'
          fi

      - name: Confirm Worker exists
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/worker.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}")
          if [ "$status" != '200' ]; then
            cat /tmp/worker.json
            echo "::error::The ${WORKER_NAME} Worker is not readable with the configured token (HTTP ${status})."
            exit 1
          fi
          echo "Worker ${WORKER_NAME} exists."

      - name: Attach apex and www as Worker Custom Domains
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for hostname in fabrictrad.com www.fabrictrad.com; do
            payload=$(node -e "console.log(JSON.stringify({hostname: process.argv[1], service: process.argv[2], zone_name: process.argv[3]}))" "$hostname" "$WORKER_NAME" "$ZONE_NAME")
            status=$(curl --silent --show-error --output "/tmp/domain-${hostname}.json" --write-out '%{http_code}' \
              --request PUT \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains")
            node - "/tmp/domain-${hostname}.json" "$hostname" "$status" <<'NODE'
          const fs = require('node:fs');
          const [file, hostname, status] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (status !== '200' || body.success !== true) {
            console.error(JSON.stringify(body, null, 2));
            console.error(`Unable to attach ${hostname} as a Worker Custom Domain (HTTP ${status}).`);
            process.exit(1);
          }
          const result = body.result || {};
          console.log(`${hostname} attached to ${result.service || 'unknown worker'} in zone ${result.zone_name || 'unknown'}.`);
          NODE
          done

      - name: Verify Worker domain records
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?service=${WORKER_NAME}" \
            > /tmp/domains.json
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/domains.json', 'utf8'));
          const domains = Array.isArray(body.result) ? body.result : [];
          for (const hostname of ['fabrictrad.com', 'www.fabrictrad.com']) {
            const match = domains.find((item) => item.hostname === hostname && item.service === 'fabrictrad');
            if (!match) {
              console.error(`Missing Worker Custom Domain: ${hostname}`);
              process.exitCode = 1;
            } else {
              console.log(`${hostname}: domain_id=${match.id}, certificate=${match.cert_id ? 'issued-or-pending' : 'pending'}`);
            }
          }
          NODE

      - name: Inspect public DNS
        shell: bash
        run: |
          set -euo pipefail
          for hostname in fabrictrad.com www.fabrictrad.com fabrictrad.fabrictrad8.workers.dev; do
            for type in A AAAA NS; do
              curl --fail --silent --show-error \
                --header 'accept: application/dns-json' \
                "https://cloudflare-dns.com/dns-query?name=${hostname}&type=${type}" \
                > "/tmp/dns-${hostname}-${type}.json"
              node - "/tmp/dns-${hostname}-${type}.json" "$hostname" "$type" <<'NODE'
          const fs = require('node:fs');
          const [file, hostname, type] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, 'utf8'));
          const answers = Array.isArray(body.Answer) ? body.Answer.map((answer) => answer.data) : [];
          console.log(`${hostname} ${type}: status=${body.Status}, answers=${answers.length ? answers.join(', ') : 'none'}`);
          NODE
            done
          done

      - name: Select reachable production origin
        id: origin
        shell: bash
        run: |
          set -euo pipefail
          custom_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/custom-login.html --write-out '%{http_code}' https://fabrictrad.com/login || true)
          worker_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/worker-login.html --write-out '%{http_code}' "${WORKERS_DEV_URL}/login" || true)
          www_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/www-login.html --write-out '%{http_code}' https://www.fabrictrad.com/login || true)
          echo "Custom apex login HTTP: ${custom_status}"
          echo "Custom www login HTTP: ${www_status}"
          echo "workers.dev login HTTP: ${worker_status}"
          if [ "$custom_status" = '200' ]; then
            echo 'base=https://fabrictrad.com' >> "$GITHUB_OUTPUT"
            echo 'custom_healthy=true' >> "$GITHUB_OUTPUT"
          elif [ "$worker_status" = '200' ]; then
            echo "base=${WORKERS_DEV_URL}" >> "$GITHUB_OUTPUT"
            echo 'custom_healthy=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Application Worker is reachable, but fabrictrad.com is not healthy.'
          else
            echo '::error::Neither fabrictrad.com nor the known workers.dev deployment is reachable.'
            exit 1
          fi

      - name: Test live account lifecycle routes
        shell: bash
        env:
          BASE_URL: ${{ steps.origin.outputs.base }}
        run: |
          set -euo pipefail
          for path in / /login /buyer-registration /seller-registration; do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output "/tmp/page-$(echo "$path" | tr '/' '_').html" --write-out '%{http_code}' "${BASE_URL}${path}" || true)
            if [ "$status" != '200' ]; then
              echo "::error::${BASE_URL}${path} returned HTTP ${status}."
              exit 1
            fi
          done

          invalid_login=$(curl --silent --show-error --output /tmp/invalid-login.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"email":"nonexistent-live-smoke@fabrictrad.invalid","password":"DefinitelyWrong123!"}' \
            "${BASE_URL}/api/auth/password-login")
          test "$invalid_login" = '401'
          grep -qi 'email or password is incorrect' /tmp/invalid-login.json

          draft_unauth=$(curl --silent --show-error --output /tmp/draft-unauth.json --write-out '%{http_code}' \
            "${BASE_URL}/api/account/onboarding-draft?flow=buyer")
          test "$draft_unauth" = '401'

          deletion_unauth=$(curl --silent --show-error --output /tmp/deletion-unauth.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            "${BASE_URL}/api/account/delete/request")
          test "$deletion_unauth" = '401'

          grep -q 'FabricTrad' /tmp/page-_login.html
          echo "Live account pages and protected APIs passed on ${BASE_URL}."

      - name: Require healthy custom domain
        if: steps.origin.outputs.custom_healthy != 'true'
        shell: bash
        run: |
          echo '::error::The application code is live on workers.dev, but fabrictrad.com is not attached or delegated correctly. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions, then rerun this workflow so it can attach both custom domains.'
          exit 1
