name: Apply production login transition hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[login-transition-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch login transition and bounded provisioning
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          login = 'src/app/login/EmailOtpLoginClient.tsx'
          replace_once(
              login,
              "import { useRouter, useSearchParams } from 'next/navigation';",
              "import { useSearchParams } from 'next/navigation';"
          )
          replace_once(
              login,
              "const destinationForRole = (role?: AccountRole | null, requestedNext?: string | null) => {\n  const fallback = defaultDestinationForRole(role);\n  return fallback !== '/admin-portal' && requestedNext ? requestedNext : fallback;\n};",
              "const destinationForRole = (role?: AccountRole | null, requestedNext?: string | null) => {\n  const fallback = defaultDestinationForRole(role);\n  return fallback !== '/admin-portal' && requestedNext ? requestedNext : fallback;\n};\n\nconst withLoginTimeout = <T,>(operation: Promise<T>, timeoutMs = 15000) =>\n  new Promise<T>((resolve, reject) => {\n    const timer = globalThis.setTimeout(\n      () => reject(new Error('Sign-in took too long. Please check your connection and try again.')),\n      timeoutMs\n    );\n    operation.then(\n      (value) => {\n        globalThis.clearTimeout(timer);\n        resolve(value);\n      },\n      (error) => {\n        globalThis.clearTimeout(timer);\n        reject(error);\n      }\n    );\n  });\n\nconst openDestination = (destination: string) => {\n  // A document navigation avoids App Router refresh/replace races in Android\n  // custom tabs and guarantees that middleware sees the new auth cookies.\n  window.location.replace(destination);\n};"
          )
          replace_once(
              login,
              "  const router = useRouter();\n  const searchParams = useSearchParams();",
              "  const searchParams = useSearchParams();"
          )
          replace_once(
              login,
              "  useEffect(() => {\n    if (loading || mode !== 'login' || !user || !profile) return;\n    router.replace(destinationForRole(profile.role, requestedNext));\n  }, [loading, mode, profile, requestedNext, router, user]);",
              "  useEffect(() => {\n    if (loading || mode !== 'login' || !user || !profile) return;\n    openDestination(destinationForRole(profile.role, requestedNext));\n  }, [loading, mode, profile, requestedNext, user]);"
          )
          replace_once(
              login,
              "      const result = await signIn(normalizedEmail, password);",
              "      const result = await withLoginTimeout(signIn(normalizedEmail, password));"
          )
          replace_once(
              login,
              "      router.replace(destinationForRole(role, requestedNext));\n      router.refresh();",
              "      openDestination(destinationForRole(role, requestedNext));"
          )

          auth = 'src/contexts/AuthContext.tsx'
          replace_once(
              auth,
              "const clearDemoSession = async () => {\n  await fetch('/api/auth/demo-session', {\n    method: 'DELETE',\n    credentials: 'same-origin',\n    cache: 'no-store',\n  }).catch(() => undefined);\n};",
              "const clearDemoSession = async () => {\n  await fetch('/api/auth/demo-session', {\n    method: 'DELETE',\n    credentials: 'same-origin',\n    cache: 'no-store',\n  }).catch(() => undefined);\n};\n\nconst withTimeout = <T,>(operation: Promise<T>, timeoutMs: number, message: string) =>\n  new Promise<T>((resolve, reject) => {\n    const timer = globalThis.setTimeout(() => reject(new Error(message)), timeoutMs);\n    operation.then(\n      (value) => {\n        globalThis.clearTimeout(timer);\n        resolve(value);\n      },\n      (error) => {\n        globalThis.clearTimeout(timer);\n        reject(error);\n      }\n    );\n  });"
          )
          replace_once(
              auth,
              "      if (nextSession?.user) {\n        void loadProfile(nextSession.user.id).catch(() => setProfile(null));\n      } else {\n        setProfile(null);\n      }",
              "      if (nextSession?.user) {\n        const userId = nextSession.user.id;\n        // Keep the auth callback synchronous. Re-entering the same Supabase\n        // client from inside onAuthStateChange can stall an interactive login.\n        globalThis.setTimeout(() => {\n          if (!cancelled && !demoActiveRef.current) {\n            void loadProfile(userId).catch(() => setProfile(null));\n          }\n        }, 0);\n      } else {\n        setProfile(null);\n      }"
          )
          old = """      const provisionResponse = await fetch('/api/auth/provision-account', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(data.session?.access_token
            ? { Authorization: `Bearer ${data.session.access_token}` }
            : {}),
        },
        credentials: 'same-origin',
        cache: 'no-store',
        body: '{}',
      });
      const provisionPayload = await provisionResponse.json().catch(() => ({}));
      if (!provisionResponse.ok) {
        throw new Error(provisionPayload?.error || 'Your account profile could not be prepared. Please try again.');
      }

      const loadedProfile = await loadProfile(data.user.id).catch(() => null);
      if (loadedProfile?.role) accountRole = loadedProfile.role;"""
          new = """      let provisioningError: string | null = null;
      try {
        const provisionResponse = await withTimeout(
          fetch('/api/auth/provision-account', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(data.session?.access_token
                ? { Authorization: `Bearer ${data.session.access_token}` }
                : {}),
            },
            credentials: 'same-origin',
            cache: 'no-store',
            body: '{}',
          }),
          8000,
          'Account preparation timed out.'
        );
        const provisionPayload = await provisionResponse.json().catch(() => ({}));
        if (!provisionResponse.ok) {
          provisioningError =
            provisionPayload?.error || 'Your account profile could not be prepared.';
        }
      } catch (provisionError) {
        provisioningError =
          provisionError instanceof Error ? provisionError.message : 'Account preparation timed out.';
      }

      const loadedProfile = await withTimeout(
        loadProfile(data.user.id),
        5000,
        'Your account profile took too long to load.'
      ).catch(() => null);
      if (loadedProfile?.role) accountRole = loadedProfile.role;
      if (!loadedProfile && provisioningError) {
        // Authentication is valid. Existing users may safely continue and the
        // protected destination will perform its own server-side role check.
        console.warn('Continuing authenticated login with metadata role', {
          userId: data.user.id,
          provisioningError,
        });
      }"""
          replace_once(auth, old, new)

          Path('.github/workflows/login-stuck-hotfix.yml').unlink()

      - name: Validate hotfix
        run: |
          npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps
          npm run type-check
          npm run lint
          npm run build

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app/login/EmailOtpLoginClient.tsx src/contexts/AuthContext.tsx
          git add -u -- .github/workflows/login-stuck-hotfix.yml
          git commit -m 'fix: prevent post-login navigation stalls [login-transition-fixed]'
          git push origin HEAD:main
