name: Align workspace invariant with strict roles

on:
  push:
    branches:
      - agent/strict-role-workspaces
    paths:
      - '.github/workflows/update-workspace-invariant.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strict-role-workspaces
          fetch-depth: 0
      - name: Update obsolete mixed-workspace assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/verify-oauth-recovery.mjs')
          text = path.read_text()
          old = '''assert(buyerLayout.includes("canSell ? '/seller-dashboard' : '/seller-registration'"), 'Buyer workspace must switch to or activate seller access.');\nassert(sellerLayout.includes('ProfileMenu'), 'Seller workspace must include the account menu.');\nassert(sellerLayout.includes("window.location.replace('/login')"), 'Seller workspace must provide reliable logout.');\nassert(sellerLayout.includes("href=\\\"/buyer-dashboard\\\""), 'Seller workspace must switch to buyer tools on the same account.');\n'''
          new = '''assert(!buyerLayout.includes("canSell ? '/seller-dashboard' : '/seller-registration'"), 'Buyer workspace must not switch into seller operations while signed in.');\nassert(!buyerLayout.includes('Open seller workspace') && !buyerLayout.includes('Activate selling'), 'Buyer navigation must remain buyer-specific.');\nassert(sellerLayout.includes('ProfileMenu'), 'Seller workspace must include the account menu.');\nassert(sellerLayout.includes("window.location.replace('/login')"), 'Seller workspace must provide reliable logout.');\nassert(!sellerLayout.includes("href=\\\"/buyer-dashboard\\\""), 'Seller workspace must not switch into buyer tools while signed in.');\nassert(!sellerLayout.includes('Buyer workspace') && !sellerLayout.includes('> Buy fabrics'), 'Seller navigation must remain seller-specific.');\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one obsolete workspace invariant block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/update-workspace-invariant.yml').unlink()
      - name: Commit corrected invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-oauth-recovery.mjs
          git add -u .github/workflows/update-workspace-invariant.yml
          git commit -m 'test: enforce strict buyer seller workspace separation'
          git push origin HEAD:agent/strict-role-workspaces
