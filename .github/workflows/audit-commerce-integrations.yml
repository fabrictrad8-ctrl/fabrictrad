name: Audit commerce integration readiness

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrictrad-commerce-readiness
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip integration audit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit live commerce providers
        shell: bash
        run: |
          set -u -o pipefail
          base_url='https://fabrictrad.com'
          failures=0

          fail() {
            echo "::error::$1"
            failures=$((failures + 1))
          }

          fetch_status() {
            local name="$1"
            local path="$2"
            local file="$3"
            local code
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$file" --write-out '%{http_code}' "$base_url$path" || true)
            echo "${name}: HTTP ${code}"
            cat "$file" || true
            echo
            if [ "$code" != '200' ]; then
              fail "${name} returned HTTP ${code}."
            fi
          }

          fetch_status 'Razorpay' '/api/razorpay/status' /tmp/razorpay.json
          fetch_status 'Shiprocket' '/api/shiprocket/status?verify=1' /tmp/shiprocket.json
          fetch_status 'Google OAuth' '/api/auth/google/status' /tmp/google.json

          grep -q '"configured":true' /tmp/google.json || fail 'Google OAuth is not configured.'

          grep -q '"configured":true' /tmp/razorpay.json || fail 'Razorpay credentials are missing.'
          grep -q '"authenticated":true' /tmp/razorpay.json || fail 'Razorpay credentials are invalid or revoked.'
          grep -q '"mode":"live"' /tmp/razorpay.json || fail 'Razorpay production credential is not a LIVE key.'

          grep -q '"configured":true' /tmp/shiprocket.json || fail 'Shiprocket credentials are missing.'
          grep -q '"authenticated":true' /tmp/shiprocket.json || fail 'Shiprocket API authentication failed.'
          grep -q '"webhookConfigured":true' /tmp/shiprocket.json || fail 'Shiprocket webhook token is missing.'

          echo "Commerce provider audit completed with ${failures} failure(s)."
          test "$failures" -eq 0
