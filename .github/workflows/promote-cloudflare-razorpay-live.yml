name: Promote Cloudflare Razorpay LIVE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-cloudflare-razorpay-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrictrad-razorpay-live-promotion
  cancel-in-progress: false

jobs:
  promote-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '2'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Require Razorpay bindings already stored in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.jsonc --format json > /tmp/worker-secrets.json
          node -e 'const fs=require("node:fs"); const rows=JSON.parse(fs.readFileSync("/tmp/worker-secrets.json","utf8")); const names=new Set(rows.map(x=>x.name)); const required=["RAZORPAY_KEY_ID","RAZORPAY_KEY_SECRET","RAZORPAY_WEBHOOK_SECRET"]; const missing=required.filter(x=>!names.has(x)); console.log("Cloudflare Razorpay bindings present:", Object.fromEntries(required.map(x=>[x,names.has(x)]))); if(missing.length){console.error("Missing Cloudflare Worker secrets: "+missing.join(", ")); process.exit(1);}'

      - name: Check current production Razorpay status
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/razorpay-before.json --write-out '%{http_code}' https://fabrictrad.com/api/razorpay/status || true)
          echo "Current Razorpay status HTTP ${status}"
          cat /tmp/razorpay-before.json || true
          echo

      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          npm run lint -- --quiet

      - name: Build current OpenNext Worker
        run: npm run build:sites

      - name: Deploy current main while preserving Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc --keep-vars

      - name: Verify Razorpay is authenticated LIVE on production
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 36); do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/razorpay-live.json --write-out '%{http_code}' https://fabrictrad.com/api/razorpay/status || true)
            echo "Attempt ${attempt}/36: HTTP ${status}"
            if [ "$status" = '200' ] && node -e 'const fs=require("node:fs"); try{const p=JSON.parse(fs.readFileSync("/tmp/razorpay-live.json","utf8")); console.log(p); process.exit(p.configured===true&&p.authenticated===true&&p.mode==="live"&&p.productionReady===true&&p.source==="environment"?0:1)}catch(e){console.error(e);process.exit(1)}'; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != 'true' ]; then
            echo 'Final Razorpay status:'
            cat /tmp/razorpay-live.json || true
            echo
            echo '::error::Cloudflare Razorpay credentials did not authenticate as LIVE on fabrictrad.com.'
            exit 1
          fi
          echo 'Razorpay LIVE is authenticated and production-ready from Cloudflare Worker secrets.'

      - name: Verify Razorpay protected routes and webhook signature gate
        shell: bash
        run: |
          set -euo pipefail
          order_status=$(curl --silent --show-error --output /tmp/order-probe.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{}' https://fabrictrad.com/api/razorpay/order || true)
          verify_status=$(curl --silent --show-error --output /tmp/verify-probe.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{}' https://fabrictrad.com/api/razorpay/verify || true)
          webhook_status=$(curl --silent --show-error --output /tmp/webhook-probe.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H 'x-razorpay-signature: 00' --data '{}' https://fabrictrad.com/api/razorpay/webhook || true)
          echo "order=${order_status} verify=${verify_status} webhook=${webhook_status}"
          [ "$order_status" = '401' ]
          [ "$verify_status" = '401' ]
          [ "$webhook_status" = '400' ]
          grep -qi 'invalid signature' /tmp/webhook-probe.json

      - name: Verify Shiprocket was preserved
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/shiprocket.json --write-out '%{http_code}' 'https://fabrictrad.com/api/shiprocket/status?verify=1' || true)
          echo "Shiprocket status HTTP ${status}"
          cat /tmp/shiprocket.json || true
          echo
          [ "$status" = '200' ]
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("/tmp/shiprocket.json","utf8")); process.exit(p.configured===true&&p.authenticated===true&&p.webhookConfigured===true?0:1)'

      - name: Confirm public site remains healthy
        shell: bash
        run: |
          set -euo pipefail
          home=$(curl --silent --show-error --output /tmp/home.html --write-out '%{http_code}' https://fabrictrad.com/ || true)
          login=$(curl --silent --show-error --output /tmp/login.html --write-out '%{http_code}' https://fabrictrad.com/login || true)
          [ "$home" = '200' ]
          [ "$login" = '200' ]
