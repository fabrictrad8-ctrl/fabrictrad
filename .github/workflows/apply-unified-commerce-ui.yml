name: Apply unified commerce UI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/unified-buy-sell-retail-catalog-reset' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-buy-sell-retail-catalog-reset
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and commit unified commerce patches
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "const [text, setText] = useState('')" src/app/seller-dashboard/components/SellerCatalogAssistant.tsx \
            && grep -Fq 'can_current_user_buy' src/middleware.ts; then
            echo 'Unified commerce changes are already committed.'
            exit 0
          fi
          node scripts/apply-unified-commerce-ui.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src supabase .github/workflows/quality.yml
          git commit -m 'Implement unified buy and sell account experience [unified-commerce-patched]'
          git push origin HEAD:agent/unified-buy-sell-retail-catalog-reset
