name: Apply buyer route regression update

on:
  push:
    branches:
      - agent/shopify-platform-overhaul

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shopify-platform-overhaul
          fetch-depth: 0

      - name: Update buyer login regression contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-oauth-recovery.mjs')
          text = path.read_text()
          old = "assert(accountLogin.includes(\"role === 'admin_staff' || role === 'super_admin' ? '/admin-portal' : '/account'\"), 'Non-admin accounts must open the unified account home.');"
          new = "assert(accountLogin.includes(\"role === 'admin_staff' || role === 'super_admin' ? '/admin-portal' : role === 'seller' ? '/account' : '/marketplace'\"), 'Buyer accounts must open the marketplace while administrators retain the admin portal.');"
          if old not in text:
              raise SystemExit('Expected legacy login destination assertion was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/apply-buyer-route-regression-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-oauth-recovery.mjs
          git commit -m 'test: require buyer login to open marketplace'
          git push origin HEAD:agent/shopify-platform-overhaul
