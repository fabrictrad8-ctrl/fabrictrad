name: Browser QA diagnostic

on:
  pull_request:
  push:
    branches:
      - agent/shopify-platform-overhaul

permissions:
  contents: write

jobs:
  apply-known-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shopify-platform-overhaul
          fetch-depth: 0

      - name: Give marketplace results a unique anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/marketplace/components/MarketplaceGrid.tsx')
          text = path.read_text()
          old = '<section id="marketplace-search" className="scroll-mt-24">'
          new = '<section id="marketplace-results" className="scroll-mt-24">'
          count = text.count(old)
          if count == 0:
              print('Marketplace results anchor is already unique.')
          elif count == 1:
              path.write_text(text.replace(old, new, 1))
              print('Renamed marketplace results anchor.')
          else:
              raise SystemExit(f'Expected one marketplace results anchor, found {count}.')
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/marketplace/components/MarketplaceGrid.tsx
          git commit -m 'fix: give marketplace search and results unique ids'
          git push origin HEAD:agent/shopify-platform-overhaul

  diagnose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Capture first Playwright failure
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=line --max-failures=1 2>&1 | tee playwright-line.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > playwright-exit-code.txt
          exit 0

      - name: Upload compact diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-first-failure
          path: |
            playwright-line.log
            playwright-exit-code.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Preserve Playwright result
        if: always()
        shell: bash
        run: |
          test -f playwright-exit-code.txt
          test "$(cat playwright-exit-code.txt)" = '0'
