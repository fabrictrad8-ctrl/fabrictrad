name: Browser QA diagnostic

on:
  pull_request:
  push:
    branches:
      - agent/shopify-platform-overhaul

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Run Playwright with compact line output
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=line 2>&1 | tee playwright-line.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > playwright-exit-code.txt
          exit 0

      - name: Upload compact diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-compact-log
          path: |
            playwright-line.log
            playwright-exit-code.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Preserve Playwright result
        if: always()
        shell: bash
        run: |
          test -f playwright-exit-code.txt
          test "$(cat playwright-exit-code.txt)" = '0'
