name: Apply production account followups

on:
  push:
    branches:
      - agent/fix-production-account-provisioning

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[account-followups-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-account-provisioning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production account followups
        run: node scripts/apply-production-account-followups.mjs
      - name: Commit patches
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/seller-dashboard/page.tsx \
            src/app/buyer-dashboard/page.tsx \
            src/app/login/EmailOtpLoginClient.tsx \
            src/app/api/razorpay/webhook/route.ts \
            src/app/admin-portal/components/AdminSellers.tsx
          git commit -m 'Fix account recovery and seller approval states [account-followups-patched]'
          git push origin HEAD:agent/fix-production-account-provisioning
