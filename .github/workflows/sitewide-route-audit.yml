name: Site-wide route audit

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Audit literal internal links
        run: node scripts/audit-internal-links.mjs

      - name: Build application
        run: npm run build

      - name: Smoke test public and protected route surfaces
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/fabrictrad-route-audit.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/login > /tmp/route-login.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            cat /tmp/fabrictrad-route-audit.log
            exit 1
          fi

          assert_page() {
            local route="$1"
            local output="/tmp/page-$(echo "$route" | tr '/?=&' '----').html"
            local status
            echo "Checking route: $route"
            status=$(curl --silent --location --output "$output" --write-out '%{http_code}' "http://127.0.0.1:3000$route")
            if [ "$status" != '200' ]; then
              echo "Route $route returned HTTP $status"
              cat /tmp/fabrictrad-route-audit.log
              return 1
            fi
            if grep -Eqi 'Application error|Internal Server Error|This page could not be found|NEXT_NOT_FOUND' "$output"; then
              echo "Route $route rendered an application error marker"
              grep -Ein 'Application error|Internal Server Error|This page could not be found|NEXT_NOT_FOUND' "$output" | head -10 || true
              cat /tmp/fabrictrad-route-audit.log
              return 1
            fi
          }

          public_routes=(
            /
            /login
            /register
            /help
            /privacy
            /terms
          )
          for route in "${public_routes[@]}"; do assert_page "$route"; done

          # Authenticated workspace behavior is covered by the dedicated
          # role-workspace and browser QA suites. This route audit deliberately
          # follows the real unauthenticated redirect path instead of restoring
          # the retired /api/auth/demo-session production backdoor.
          buyer_routes=(
            /marketplace
            /categories
            /vendors
            /product-detail
            /buyer-dashboard
            /buyer-requirements
            /profile
            /company-purchasing
            /cart
            /custom-order
            '/marketplace?category=cotton'
            '/marketplace?seller=v1'
          )
          for route in "${buyer_routes[@]}"; do assert_page "$route"; done

          seller_routes=(
            /seller-dashboard
            '/seller-dashboard?tab=inventory'
            '/seller-dashboard?tab=orders'
            '/seller-dashboard?tab=notifications'
            /catalogs-pricing
            /marketplace
            /categories
            /vendors
            /profile
          )
          for route in "${seller_routes[@]}"; do assert_page "$route"; done

      - name: Verify shared-header invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ft-buyer-search' src/components/Header.tsx
          grep -Fq '.ft-buyer-header.ft-commerce-header' src/styles/commerce-ux-final.css
          grep -Fq 'MarketplaceQueryBridge' src/app/marketplace/page.tsx
          grep -Fq "v1: 'Surat Textile Mills Pvt Ltd'" src/app/marketplace/components/MarketplaceQueryBridge.tsx
