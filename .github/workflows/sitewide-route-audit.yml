name: Site-wide route audit

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'false'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Audit literal internal links
        run: node scripts/audit-internal-links.mjs

      - name: Build application
        run: npm run build

      - name: Smoke test public routes and fail-closed authorization
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/fabrictrad-route-audit.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/login > /tmp/route-login.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            cat /tmp/fabrictrad-route-audit.log
            exit 1
          fi

          assert_public_page() {
            local route="$1"
            local output="/tmp/public-$(echo "$route" | tr '/?=&' '----').html"
            local status
            echo "Checking public route: $route"
            status=$(curl --silent --location --output "$output" --write-out '%{http_code}' "http://127.0.0.1:3000$route")
            test "$status" = '200'
            if grep -Eqi 'Application error|Internal Server Error|This page could not be found|NEXT_NOT_FOUND' "$output"; then
              echo "Route $route rendered an application error marker"
              return 1
            fi
          }

          assert_login_redirect() {
            local route="$1"
            local expected="$2"
            local safe_name
            safe_name=$(echo "$route" | tr '/?=&' '----')
            local headers="/tmp/protected-${safe_name}.headers"
            local status
            echo "Checking protected route: $route -> $expected"
            status=$(curl --silent --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
              --max-redirs 0 "http://127.0.0.1:3000$route")
            if [ "$status" != '307' ] && [ "$status" != '308' ] && [ "$status" != '302' ]; then
              cat "$headers" || true
              echo "Expected an auth redirect from $route, got HTTP $status"
              return 1
            fi
            if ! grep -Eqi "^location: .*${expected}" "$headers"; then
              cat "$headers" || true
              echo "Route $route did not redirect to $expected"
              return 1
            fi
          }

          public_routes=(
            /
            /login
            /register
            /buyer-registration
            /seller-registration
            /help
            /how-to-use
            /privacy
            /terms
          )
          for route in "${public_routes[@]}"; do assert_public_page "$route"; done

          buyer_routes=(
            /marketplace
            /categories
            /vendors
            /product-detail
            /buyer-dashboard
            /buyer-requirements
            /profile
            /company-purchasing
            /cart
            '/marketplace?category=cotton'
            '/marketplace?seller=v1'
          )
          for route in "${buyer_routes[@]}"; do assert_login_redirect "$route" '/login'; done

          seller_routes=(
            /seller-dashboard
            '/seller-dashboard?tab=inventory'
            '/seller-dashboard?tab=orders'
            '/seller-dashboard?tab=notifications'
            /catalogs-pricing
          )
          for route in "${seller_routes[@]}"; do assert_login_redirect "$route" '/login'; done

          assert_login_redirect '/admin-portal' '/admin-login'

          # Production must never regain a synthetic cookie-based demo identity.
          demo_get=$(curl --silent --output /tmp/demo-get.json --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          demo_post=$(curl --silent --output /tmp/demo-post.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:3000/api/auth/demo-session)
          test "$demo_get" = '404'
          test "$demo_post" = '404'

      - name: Verify shared-header and authorization invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ft-buyer-search' src/components/Header.tsx
          grep -Fq '.ft-buyer-header.ft-commerce-header' src/styles/commerce-ux-final.css
          grep -Fq 'MarketplaceQueryBridge' src/app/marketplace/page.tsx
          if grep -R -n -E 'demo\.buyer@fabrictrad\.com|demo\.seller@fabrictrad\.com|fabrictrad_demo_role' src scripts; then
            echo 'Synthetic role-cookie artifacts remain in executable application sources.'
            exit 1
          fi
