name: Deploy latest FabricTrad main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrictrad-production-worker
  cancel-in-progress: false

jobs:
  deploy-current-main:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      WORKER_NAME: fabrictrad
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '2'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare deployment token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo '::error::CLOUDFLARE_API_TOKEN is not configured.'; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Verify production Worker secret bindings
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.jsonc --format json > /tmp/worker-secrets.json
          node -e '
            const fs=require("node:fs");
            const rows=JSON.parse(fs.readFileSync("/tmp/worker-secrets.json","utf8"));
            const names=new Set(rows.map(x=>x.name));
            const required=["RAZORPAY_KEY_ID","RAZORPAY_KEY_SECRET","RAZORPAY_WEBHOOK_SECRET"];
            const missing=required.filter(x=>!names.has(x));
            console.log("Cloudflare Razorpay bindings:",Object.fromEntries(required.map(x=>[x,names.has(x)])));
            if(missing.length){console.error("Missing Cloudflare Worker secrets: "+missing.join(", "));process.exit(1);}
          '

      - name: Verify existing production integrations before release
        shell: bash
        run: |
          set -euo pipefail
          razorpay_http=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/razorpay-before.json --write-out '%{http_code}' https://fabrictrad.com/api/razorpay/status || true)
          shiprocket_http=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/shiprocket-before.json --write-out '%{http_code}' 'https://fabrictrad.com/api/shiprocket/status?verify=1' || true)
          echo "Razorpay HTTP ${razorpay_http}: $(cat /tmp/razorpay-before.json 2>/dev/null || true)"
          echo "Shiprocket HTTP ${shiprocket_http}: $(cat /tmp/shiprocket-before.json 2>/dev/null || true)"
          [ "$razorpay_http" = '200' ]
          node -e 'const p=JSON.parse(require("node:fs").readFileSync("/tmp/razorpay-before.json","utf8"));process.exit(p.configured===true&&p.authenticated===true&&p.mode==="live"&&p.productionReady===true&&p.source==="environment"?0:1)'

      - name: Validate compilable application
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          npm run lint -- --quiet

      - name: Build OpenNext Worker
        run: npm run build:sites

      - name: Capture currently active Worker version
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments"
          curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" > /tmp/deployments-before.json
          node -e '
            const fs=require("node:fs");
            const p=JSON.parse(fs.readFileSync("/tmp/deployments-before.json","utf8"));
            const ds=p?.result?.deployments||[];
            if(!ds.length)process.exit(2);
            const versions=ds[0].versions||[];
            versions.sort((a,b)=>(b.percentage||0)-(a.percentage||0));
            if(!versions[0]?.version_id)process.exit(3);
            fs.writeFileSync("/tmp/previous-version.txt",versions[0].version_id);
            console.log("Previous production version:",versions[0].version_id);
          '

      - name: Upload current main while preserving Cloudflare variables and secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc --keep-vars 2>&1 | tee /tmp/wrangler-upload.log
          version=$(sed -n 's/^Current Version ID: //p' /tmp/wrangler-upload.log | tail -n 1 | tr -d '\r')
          [ -n "$version" ] || { echo '::error::Wrangler did not return a Worker version ID.'; exit 1; }
          printf '%s' "$version" > /tmp/new-version.txt
          echo "Uploaded Worker version ${version}."

      - name: Promote uploaded Worker version to 100 percent
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat /tmp/new-version.txt)
          npx wrangler versions deploy "${version}@100%" --config wrangler.jsonc -y

      - name: Verify production release and integrations
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 36); do
            home=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/home.html --write-out '%{http_code}' https://fabrictrad.com/ || true)
            login=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/login.html --write-out '%{http_code}' https://fabrictrad.com/login || true)
            razorpay=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/razorpay.json --write-out '%{http_code}' https://fabrictrad.com/api/razorpay/status || true)
            shiprocket=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/shiprocket.json --write-out '%{http_code}' 'https://fabrictrad.com/api/shiprocket/status?verify=1' || true)
            ai=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/ai.json --write-out '%{http_code}' https://fabrictrad.com/api/ai/drape-on || true)
            if [ "$home" = '200' ] && [ "$login" = '200' ] && [ "$razorpay" = '200' ] && [ "$shiprocket" = '200' ] && [ "$ai" = '200' ] && node -e '
              const fs=require("node:fs");
              const r=JSON.parse(fs.readFileSync("/tmp/razorpay.json","utf8"));
              const s=JSON.parse(fs.readFileSync("/tmp/shiprocket.json","utf8"));
              const a=JSON.parse(fs.readFileSync("/tmp/ai.json","utf8"));
              process.exit(r.configured===true&&r.authenticated===true&&r.mode==="live"&&r.productionReady===true&&r.source==="environment"&&s.configured===true&&s.authenticated===true&&s.webhookConfigured===true&&a.configured===true&&a.mode==="real_ai_image_try_on"?0:1);
            '; then
              healthy=true
              break
            fi
            sleep 10
          done
          if [ "$healthy" != 'true' ]; then
            echo 'Razorpay:'; cat /tmp/razorpay.json || true; echo
            echo 'Shiprocket:'; cat /tmp/shiprocket.json || true; echo
            echo 'AI:'; cat /tmp/ai.json || true; echo
            echo '::error::Production release did not pass integration verification.'
            exit 1
          fi

          order_status=$(curl --silent --show-error --output /tmp/order-probe.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{}' https://fabrictrad.com/api/razorpay/order || true)
          verify_status=$(curl --silent --show-error --output /tmp/verify-probe.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{}' https://fabrictrad.com/api/razorpay/verify || true)
          webhook_status=$(curl --silent --show-error --output /tmp/webhook-probe.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H 'x-razorpay-signature: 00' --data '{}' https://fabrictrad.com/api/razorpay/webhook || true)
          [ "$order_status" = '401' ]
          [ "$verify_status" = '401' ]
          [ "$webhook_status" = '400' ]
          grep -qi 'invalid signature' /tmp/webhook-probe.json

          login_api=$(curl --silent --show-error --output /tmp/login-api.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{"email":"nonexistent-live-smoke@fabrictrad.invalid","password":"DefinitelyWrong123!"}' https://fabrictrad.com/api/auth/password-login || true)
          destination=$(curl --silent --show-error --output /tmp/destination.json --write-out '%{http_code}' https://fabrictrad.com/api/auth/session-destination || true)
          [ "$login_api" = '401' ]
          [ "$destination" = '401' ]

          echo 'Production verification passed.'
          cat /tmp/razorpay.json
          echo
          cat /tmp/shiprocket.json
          echo

      - name: Roll back Worker if production verification failed
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -s /tmp/previous-version.txt ] && [ -s /tmp/new-version.txt ]; then
            previous=$(cat /tmp/previous-version.txt)
            echo "Rolling production back to ${previous}."
            npx wrangler versions deploy "${previous}@100%" --config wrangler.jsonc -y
          else
            echo 'No promoted version was recorded; rollback not required.'
          fi
