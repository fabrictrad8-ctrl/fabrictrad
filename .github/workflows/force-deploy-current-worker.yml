name: Force deploy current FabricTrad Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabrictrad-production-deploy
  cancel-in-progress: false

jobs:
  deploy-current-main:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '2'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare deployment token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured in repository Actions secrets.'
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify Cloudflare authentication
        id: cloudflare-auth
        run: npx wrangler whoami

      - name: Check required Worker secret names
        id: secret-preflight
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.jsonc --format json > /tmp/worker-secrets.json
          node - <<'NODE'
          const fs = require('node:fs');
          const secrets = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8'));
          const names = new Set(secrets.map((item) => item.name));
          const required = ['RAZORPAY_KEY_ID', 'RAZORPAY_KEY_SECRET', 'RAZORPAY_WEBHOOK_SECRET'];
          const missing = required.filter((name) => !names.has(name));
          if (!names.has('SUPABASE_SECRET_KEY') && !names.has('SUPABASE_SERVICE_ROLE_KEY')) {
            missing.push('SUPABASE_SECRET_KEY_OR_SERVICE_ROLE_KEY');
          }
          fs.writeFileSync('/tmp/missing-worker-secrets.txt', missing.join('\n'));
          console.log(`Configured Razorpay secret names: ${required.filter((name) => names.has(name)).join(', ') || 'none'}`);
          if (missing.length) {
            console.error(`Missing required integration secret names: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log('All required Razorpay and Supabase Worker secret names are configured.');
          NODE

      - name: Validate current application
        run: |
          npm run type-check
          npm run lint
          node scripts/verify-account-lifecycle.mjs
          node scripts/verify-marketplace-integrity.mjs

      - name: Build OpenNext Worker
        run: npm run build:sites

      - name: Deploy current main to Cloudflare
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.jsonc --keep-vars 2>&1 | tee /tmp/wrangler-deploy.log

      - name: Verify production account APIs
        id: live-verification
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 48); do
            login=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/login.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"email":"nonexistent-live-smoke@fabrictrad.invalid","password":"DefinitelyWrong123!"}' \
              https://fabrictrad.com/api/auth/password-login || true)
            destination=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/destination.json --write-out '%{http_code}' \
              https://fabrictrad.com/api/auth/session-destination || true)
            draft=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/draft.json --write-out '%{http_code}' \
              'https://fabrictrad.com/api/account/onboarding-draft?flow=buyer' || true)
            deletion=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/deletion.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              https://fabrictrad.com/api/account/delete/request || true)
            echo "Attempt ${attempt}/48: login=${login}, destination=${destination}, draft=${draft}, deletion=${deletion}"
            if [ "$login" = '401' ] && [ "$destination" = '401' ] && [ "$draft" = '401' ] && [ "$deletion" = '401' ]; then
              healthy=true
              break
            fi
            sleep 10
          done
          if [ "$healthy" != 'true' ]; then
            echo '::error::The new Worker deployed, but the production account APIs did not become healthy.'
            exit 1
          fi
          grep -qi 'email or password is incorrect' /tmp/login.json
          echo 'Current FabricTrad Worker and account lifecycle APIs are live.'

      - name: Verify production Razorpay webhook
        id: razorpay-webhook-verification
        shell: bash
        run: |
          set -euo pipefail
          webhook_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/razorpay-webhook.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'x-razorpay-signature: 00' \
            --data '{}' \
            https://fabrictrad.com/api/razorpay/webhook || true)
          printf '%s' "$webhook_status" > /tmp/razorpay-webhook-status.txt
          echo "Razorpay webhook probe returned HTTP ${webhook_status}."
          if [ "$webhook_status" != '400' ]; then
            cat /tmp/razorpay-webhook.json || true
            echo '::error::The production Razorpay webhook is not rejecting an invalid signature as expected.'
            exit 1
          fi
          grep -qi 'invalid signature' /tmp/razorpay-webhook.json
          echo 'Production Razorpay webhook is configured and validating signed requests.'

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.cloudflare-auth.outcome }}
          SECRET_PREFLIGHT_OUTCOME: ${{ steps.secret-preflight.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.live-verification.outcome }}
          RAZORPAY_WEBHOOK_OUTCOME: ${{ steps.razorpay-webhook-verification.outcome }}
        run: |
          set -euo pipefail
          missing_json='[]'
          if [ -s /tmp/missing-worker-secrets.txt ]; then
            missing_json=$(node -e "const fs=require('fs'); console.log(JSON.stringify(fs.readFileSync('/tmp/missing-worker-secrets.txt','utf8').trim().split(/\\n+/).filter(Boolean)))")
          fi
          deployment_log_json='null'
          if [ -s /tmp/wrangler-deploy.log ]; then
            deployment_log_json=$(node - <<'NODE'
          const fs = require('node:fs');
          let text = fs.readFileSync('/tmp/wrangler-deploy.log', 'utf8');
          text = text
            .replace(/\u001b\[[0-9;]*m/g, '')
            .replace(/(authorization|api[_-]?token|secret|password)(\s*[:=]\s*)(\S+)/gi, '$1$2[redacted]');
          const tail = text
            .split(/\r?\n/)
            .filter(Boolean)
            .slice(-60)
            .join('\n')
            .slice(0, 6000);
          console.log(JSON.stringify(tail || null));
          NODE
          )
          fi
          webhook_status_json='null'
          if [ -s /tmp/razorpay-webhook-status.txt ]; then
            webhook_status_json=$(node -e "const fs=require('fs'); console.log(JSON.stringify(fs.readFileSync('/tmp/razorpay-webhook-status.txt','utf8').trim() || null))")
          fi
          mkdir -p .github/deployments
          cat > .github/deployments/production-status.json <<JSON
          {
            "sourceCommit": "${GITHUB_SHA}",
            "recordedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "cloudflareAuthentication": "${AUTH_OUTCOME}",
            "workerSecretPreflight": "${SECRET_PREFLIGHT_OUTCOME}",
            "missingRequiredWorkerSecrets": ${missing_json},
            "workerDeployment": "${DEPLOY_OUTCOME}",
            "liveAccountApiVerification": "${VERIFY_OUTCOME}",
            "liveRazorpayWebhookVerification": "${RAZORPAY_WEBHOOK_OUTCOME}",
            "razorpayWebhookProbeHttpStatus": ${webhook_status_json},
            "deploymentLogTail": ${deployment_log_json}
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/production-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record production deployment status [skip deploy]'
            git push origin HEAD:main
          fi
