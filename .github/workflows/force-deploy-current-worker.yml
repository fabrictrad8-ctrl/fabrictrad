name: Force deploy current FabricTrad Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabrictrad-production-deploy
  cancel-in-progress: false

jobs:
  deploy-current-main:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: aa4ff7a482130e543f176e2d73c93f45
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '2'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare deployment token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured in repository Actions secrets.'
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify Cloudflare authentication
        id: cloudflare-auth
        run: npx wrangler whoami

      - name: Verify provided Razorpay API credentials
        id: razorpay-api-verification
        shell: bash
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          key_present=false
          secret_present=false
          [ -n "${RAZORPAY_KEY_ID:-}" ] && key_present=true
          [ -n "${RAZORPAY_KEY_SECRET:-}" ] && secret_present=true

          if [ "$key_present" != "$secret_present" ]; then
            printf '%s' 'incomplete_github_credential_pair' > /tmp/razorpay-api-verification.txt
            echo '::error::RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET must be configured together in repository Actions secrets.'
            exit 1
          fi

          if [ "$key_present" = 'false' ]; then
            printf '%s' 'not_run_existing_worker_credentials' > /tmp/razorpay-api-verification.txt
            echo 'No GitHub Actions Razorpay key pair is available. Existing Worker credentials will be preserved.'
            exit 0
          fi

          npm run verify:razorpay -- --api
          printf '%s' 'verified_against_razorpay_api' > /tmp/razorpay-api-verification.txt
          echo 'Razorpay Key ID and Key Secret authenticate successfully against the Orders API.'

      - name: Sync Razorpay server secrets to Worker
        id: sync-razorpay-secret
        shell: bash
        env:
          RAZORPAY_KEY_ID_FROM_GITHUB: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET_FROM_GITHUB: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET_FROM_GITHUB: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          key_present=false
          secret_present=false
          [ -n "${RAZORPAY_KEY_ID_FROM_GITHUB:-}" ] && key_present=true
          [ -n "${RAZORPAY_KEY_SECRET_FROM_GITHUB:-}" ] && secret_present=true

          if [ "$key_present" != "$secret_present" ]; then
            echo '::error::RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET must be configured together.'
            exit 1
          fi

          if [ "$key_present" = 'true' ]; then
            printf '%s' "$RAZORPAY_KEY_ID_FROM_GITHUB" | npx wrangler secret put RAZORPAY_KEY_ID --config wrangler.jsonc
            printf '%s' "$RAZORPAY_KEY_SECRET_FROM_GITHUB" | npx wrangler secret put RAZORPAY_KEY_SECRET --config wrangler.jsonc
            echo 'Synced the verified Razorpay Key ID and Key Secret to the Cloudflare Worker.'
          else
            echo 'No GitHub Actions Razorpay key pair supplied; existing Worker Key ID/Secret remain unchanged.'
          fi

          if [ -n "${RAZORPAY_WEBHOOK_SECRET_FROM_GITHUB:-}" ]; then
            printf '%s' "$RAZORPAY_WEBHOOK_SECRET_FROM_GITHUB" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET --config wrangler.jsonc
            echo 'Synced the Razorpay webhook secret to the Cloudflare Worker.'
          else
            echo 'No GitHub Actions webhook secret supplied; existing Worker webhook secret remains unchanged.'
          fi

      - name: Sync Supabase server secret to Worker
        id: sync-supabase-secret
        shell: bash
        env:
          SUPABASE_SECRET_KEY_FROM_GITHUB: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY_FROM_GITHUB: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_SECRET_KEY_FROM_GITHUB:-}" ]; then
            printf '%s' "$SUPABASE_SECRET_KEY_FROM_GITHUB" | npx wrangler secret put SUPABASE_SECRET_KEY --config wrangler.jsonc
            echo 'Synced SUPABASE_SECRET_KEY from GitHub Actions to the Cloudflare Worker.'
          elif [ -n "${SUPABASE_SERVICE_ROLE_KEY_FROM_GITHUB:-}" ]; then
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY_FROM_GITHUB" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.jsonc
            echo 'Synced SUPABASE_SERVICE_ROLE_KEY from GitHub Actions to the Cloudflare Worker.'
          else
            echo 'No GitHub Actions Supabase server secret is available to sync.'
          fi

      - name: Sync AI image provider secret to Worker
        id: sync-ai-secret
        shell: bash
        env:
          OPENAI_API_KEY_FROM_GITHUB: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY_FROM_GITHUB: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          synced=false
          if [ -n "${OPENAI_API_KEY_FROM_GITHUB:-}" ]; then
            printf '%s' "$OPENAI_API_KEY_FROM_GITHUB" | npx wrangler secret put OPENAI_API_KEY --config wrangler.jsonc
            echo 'Synced OPENAI_API_KEY from GitHub Actions to the Cloudflare Worker.'
            synced=true
          fi
          if [ -n "${GEMINI_API_KEY_FROM_GITHUB:-}" ]; then
            printf '%s' "$GEMINI_API_KEY_FROM_GITHUB" | npx wrangler secret put GEMINI_API_KEY --config wrangler.jsonc
            echo 'Synced GEMINI_API_KEY from GitHub Actions to the Cloudflare Worker.'
            synced=true
          fi
          if [ "$synced" != 'true' ]; then
            echo 'No GitHub Actions AI provider secret was available to sync; checking existing Worker secrets next.'
          fi

      - name: Check required Worker secret names
        id: secret-preflight
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.jsonc --format json > /tmp/worker-secrets.json
          node - <<'NODE'
          const fs = require('node:fs');
          const secrets = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8'));
          const names = new Set(secrets.map((item) => item.name));
          const required = ['RAZORPAY_KEY_ID', 'RAZORPAY_KEY_SECRET', 'RAZORPAY_WEBHOOK_SECRET'];
          const missing = required.filter((name) => !names.has(name));
          if (!names.has('SUPABASE_SECRET_KEY') && !names.has('SUPABASE_SERVICE_ROLE_KEY')) {
            missing.push('SUPABASE_SECRET_KEY_OR_SERVICE_ROLE_KEY');
          }
          if (!names.has('OPENAI_API_KEY') && !names.has('GEMINI_API_KEY')) {
            missing.push('OPENAI_API_KEY_OR_GEMINI_API_KEY');
          }
          fs.writeFileSync('/tmp/missing-worker-secrets.txt', missing.join('\n'));
          console.log(`Configured Razorpay secret names: ${required.filter((name) => names.has(name)).join(', ') || 'none'}`);
          console.log(`AI image provider secret configured: ${names.has('OPENAI_API_KEY') ? 'OpenAI' : names.has('GEMINI_API_KEY') ? 'Gemini' : 'none'}`);
          if (missing.length) {
            console.error(`Missing required integration secret names: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log('All required Razorpay, Supabase and AI image provider Worker secret names are configured.');
          NODE

      - name: Validate current application
        run: |
          npm run type-check
          npm run lint
          node scripts/verify-account-lifecycle.mjs
          node scripts/verify-marketplace-integrity.mjs
          node scripts/verify-mobile-whatsapp.mjs

      - name: Build OpenNext Worker
        run: npm run build:sites

      - name: Deploy current main to Cloudflare
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.jsonc --keep-vars 2>&1 | tee /tmp/wrangler-deploy.log

      - name: Verify production account APIs
        id: live-verification
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 48); do
            login=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/login.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"email":"nonexistent-live-smoke@fabrictrad.invalid","password":"DefinitelyWrong123!"}' \
              https://fabrictrad.com/api/auth/password-login || true)
            destination=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/destination.json --write-out '%{http_code}' \
              https://fabrictrad.com/api/auth/session-destination || true)
            draft=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/draft.json --write-out '%{http_code}' \
              'https://fabrictrad.com/api/account/onboarding-draft?flow=buyer' || true)
            deletion=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output /tmp/deletion.json --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --data '{}' \
              https://fabrictrad.com/api/account/delete/request || true)
            echo "Attempt ${attempt}/48: login=${login}, destination=${destination}, draft=${draft}, deletion=${deletion}"
            if [ "$login" = '401' ] && [ "$destination" = '401' ] && [ "$draft" = '401' ] && [ "$deletion" = '401' ]; then
              healthy=true
              break
            fi
            sleep 10
          done
          if [ "$healthy" != 'true' ]; then
            echo '::error::The new Worker deployed, but the production account APIs did not become healthy.'
            exit 1
          fi
          grep -qi 'email or password is incorrect' /tmp/login.json
          echo 'Current FabricTrad Worker and account lifecycle APIs are live.'

      - name: Verify production AI Drape-On
        id: ai-drape-verification
        shell: bash
        run: |
          set -euo pipefail
          ai_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/ai-drape.json --write-out '%{http_code}' \
            https://fabrictrad.com/api/ai/drape-on || true)
          printf '%s' "$ai_status" > /tmp/ai-drape-status.txt
          echo "AI Drape readiness probe returned HTTP ${ai_status}."
          if [ "$ai_status" != '200' ]; then
            cat /tmp/ai-drape.json || true
            echo '::error::Production AI Drape readiness endpoint is unhealthy.'
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/ai-drape.json', 'utf8'));
          if (payload.configured !== true) {
            console.error('AI Drape endpoint reports that no image provider is configured.');
            process.exit(1);
          }
          if (payload.mode !== 'real_ai_image_try_on' || payload.usesListingMedia !== true) {
            console.error('AI Drape endpoint is not reporting the verified listing-media try-on mode.');
            process.exit(1);
          }
          console.log(`Production AI Drape is ready via ${payload.provider || 'configured provider'} (${payload.model || 'default model'}).`);
          NODE

      - name: Verify production Razorpay webhook
        id: razorpay-webhook-verification
        shell: bash
        run: |
          set -euo pipefail
          webhook_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/razorpay-webhook.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'x-razorpay-signature: 00' \
            --data '{}' \
            https://fabrictrad.com/api/razorpay/webhook || true)
          printf '%s' "$webhook_status" > /tmp/razorpay-webhook-status.txt
          echo "Razorpay webhook probe returned HTTP ${webhook_status}."
          if [ "$webhook_status" != '400' ]; then
            cat /tmp/razorpay-webhook.json || true
            echo '::error::The production Razorpay webhook is not rejecting an invalid signature as expected.'
            exit 1
          fi
          grep -qi 'invalid signature' /tmp/razorpay-webhook.json
          echo 'Production Razorpay webhook is configured and validating signed requests.'

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.cloudflare-auth.outcome }}
          RAZORPAY_API_OUTCOME: ${{ steps.razorpay-api-verification.outcome }}
          RAZORPAY_SECRET_SYNC_OUTCOME: ${{ steps.sync-razorpay-secret.outcome }}
          SECRET_SYNC_OUTCOME: ${{ steps.sync-supabase-secret.outcome }}
          AI_SECRET_SYNC_OUTCOME: ${{ steps.sync-ai-secret.outcome }}
          SECRET_PREFLIGHT_OUTCOME: ${{ steps.secret-preflight.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.live-verification.outcome }}
          AI_DRAPE_OUTCOME: ${{ steps.ai-drape-verification.outcome }}
          RAZORPAY_WEBHOOK_OUTCOME: ${{ steps.razorpay-webhook-verification.outcome }}
        run: |
          set -euo pipefail
          missing_json='[]'
          if [ -s /tmp/missing-worker-secrets.txt ]; then
            missing_json=$(node -e "const fs=require('fs'); console.log(JSON.stringify(fs.readFileSync('/tmp/missing-worker-secrets.txt','utf8').trim().split(/\\n+/).filter(Boolean)))")
          fi
          deployment_log_json='null'
          if [ -s /tmp/wrangler-deploy.log ]; then
            deployment_log_json=$(node - <<'NODE'
          const fs = require('node:fs');
          let text = fs.readFileSync('/tmp/wrangler-deploy.log', 'utf8');
          text = text
            .replace(/\u001b\[[0-9;]*m/g, '')
            .replace(/(authorization|api[_-]?token|secret|password)(\s*[:=]\s*)(\S+)/gi, '$1$2[redacted]');
          const tail = text
            .split(/\r?\n/)
            .filter(Boolean)
            .slice(-60)
            .join('\n')
            .slice(0, 6000);
          console.log(JSON.stringify(tail || null));
          NODE
          )
          fi
          webhook_status_json='null'
          if [ -s /tmp/razorpay-webhook-status.txt ]; then
            webhook_status_json=$(node -e "const fs=require('fs'); console.log(JSON.stringify(fs.readFileSync('/tmp/razorpay-webhook-status.txt','utf8').trim() || null))")
          fi
          ai_status_json='null'
          if [ -s /tmp/ai-drape-status.txt ]; then
            ai_status_json=$(node -e "const fs=require('fs'); console.log(JSON.stringify(fs.readFileSync('/tmp/ai-drape-status.txt','utf8').trim() || null))")
          fi
          razorpay_api_state_json='null'
          if [ -s /tmp/razorpay-api-verification.txt ]; then
            razorpay_api_state_json=$(node -e "const fs=require('fs'); console.log(JSON.stringify(fs.readFileSync('/tmp/razorpay-api-verification.txt','utf8').trim() || null))")
          fi
          mkdir -p .github/deployments
          cat > .github/deployments/production-status.json <<JSON
          {
            "sourceCommit": "${GITHUB_SHA}",
            "recordedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "cloudflareAuthentication": "${AUTH_OUTCOME}",
            "razorpayApiCredentialCheckStep": "${RAZORPAY_API_OUTCOME}",
            "razorpayApiCredentialVerification": ${razorpay_api_state_json},
            "razorpaySecretSync": "${RAZORPAY_SECRET_SYNC_OUTCOME}",
            "supabaseSecretSync": "${SECRET_SYNC_OUTCOME}",
            "aiProviderSecretSync": "${AI_SECRET_SYNC_OUTCOME}",
            "workerSecretPreflight": "${SECRET_PREFLIGHT_OUTCOME}",
            "missingRequiredWorkerSecrets": ${missing_json},
            "workerDeployment": "${DEPLOY_OUTCOME}",
            "liveAccountApiVerification": "${VERIFY_OUTCOME}",
            "liveAiDrapeVerification": "${AI_DRAPE_OUTCOME}",
            "aiDrapeProbeHttpStatus": ${ai_status_json},
            "liveRazorpayWebhookVerification": "${RAZORPAY_WEBHOOK_OUTCOME}",
            "razorpayWebhookProbeHttpStatus": ${webhook_status_json},
            "deploymentLogTail": ${deployment_log_json}
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/production-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record production deployment status [skip deploy]'
            git push origin HEAD:main
          fi
