name: Apply official WhatsApp account-link fix

on:
  push:
    branches:
      - agent/official-whatsapp-account-link

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/official-whatsapp-account-link
          fetch-depth: 0

      - name: Publish official number and account ownership flow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config = Path('src/lib/whatsappConfig.ts')
          config.write_text("""export const OFFICIAL_WHATSAPP_DISPLAY_NUMBER = '+91 92244 47024';
          export const OFFICIAL_WHATSAPP_WA_NUMBER = '919224447024';
          """)

          status = Path('src/app/api/whatsapp/catalog/status/route.ts')
          status.write_text("""import { NextResponse } from 'next/server';
          import { createAdminClient } from '@/lib/supabase/admin';
          import {
            OFFICIAL_WHATSAPP_DISPLAY_NUMBER,
            OFFICIAL_WHATSAPP_WA_NUMBER,
          } from '@/lib/whatsappConfig';

          export const dynamic = 'force-dynamic';

          export async function GET() {
            const displayNumber =
              process.env.WHATSAPP_DISPLAY_NUMBER?.trim() || OFFICIAL_WHATSAPP_DISPLAY_NUMBER;
            const waNumber = displayNumber.replace(/\\D/g, '') || OFFICIAL_WHATSAPP_WA_NUMBER;
            const credentialsConfigured = Boolean(
              process.env.WHATSAPP_ACCESS_TOKEN &&
                process.env.WHATSAPP_APP_SECRET &&
                process.env.WHATSAPP_VERIFY_TOKEN &&
                process.env.WHATSAPP_PHONE_NUMBER_ID &&
                process.env.SUPABASE_SERVICE_ROLE_KEY
            );

            let databaseReady = false;
            if (credentialsConfigured) {
              try {
                const admin = createAdminClient();
                const [messages, variants] = await Promise.all([
                  admin.from('whatsapp_catalog_messages').select('id', { count: 'exact', head: true }),
                  admin.from('seller_product_variants').select('id', { count: 'exact', head: true }),
                ]);
                databaseReady = !messages.error && !variants.error;
              } catch {
                databaseReady = false;
              }
            }

            const configured = credentialsConfigured && databaseReady;

            return NextResponse.json(
              {
                configured,
                credentialsConfigured,
                databaseReady,
                supportsVariants: true,
                accountMatching: 'verified-seller-phone',
                displayNumber,
                waNumber,
                pairingWindowMinutes: 15,
                webhookPath: '/api/whatsapp/webhook',
              },
              { headers: { 'Cache-Control': 'no-store, max-age=0' } }
            );
          }
          """)

          ui = Path('src/app/seller-dashboard/components/SellerWhatsAppUpload.tsx')
          text = ui.read_text()
          text = text.replace(
            "import { parseWhatsAppCatalog } from '@/lib/whatsappCatalog';",
            "import { parseWhatsAppCatalog } from '@/lib/whatsappCatalog';\nimport {\n  OFFICIAL_WHATSAPP_DISPLAY_NUMBER,\n  OFFICIAL_WHATSAPP_WA_NUMBER,\n} from '@/lib/whatsappConfig';",
          )
          text = text.replace(
            "  const { user, isDemoAccount } = useAuth();",
            "  const { user, profile, isDemoAccount } = useAuth();",
          )
          text = text.replace(
            "          setConnection({ configured: false, displayNumber: null, waNumber: null, pairingWindowMinutes: 15, webhookPath: '/api/whatsapp/webhook' });",
            "          setConnection({ configured: false, displayNumber: OFFICIAL_WHATSAPP_DISPLAY_NUMBER, waNumber: OFFICIAL_WHATSAPP_WA_NUMBER, pairingWindowMinutes: 15, webhookPath: '/api/whatsapp/webhook' });",
          )
          text = text.replace(
            "             displayNumber: payload.displayNumber || null,\n             waNumber: payload.waNumber || null,",
            "             displayNumber: payload.displayNumber || OFFICIAL_WHATSAPP_DISPLAY_NUMBER,\n             waNumber: payload.waNumber || OFFICIAL_WHATSAPP_WA_NUMBER,",
          )
          text = text.replace(
            "  const parsedPreview = useMemo(() => parseWhatsAppCatalog(sampleText), [sampleText]);",
            "  const parsedPreview = useMemo(() => parseWhatsAppCatalog(sampleText), [sampleText]);\n  const accountPhone = useMemo(() => {\n    if (isDemoAccount || !profile?.phone_verified || !profile.phone) return null;\n    const digits = profile.phone.replace(/\\D/g, '').slice(-10);\n    if (digits.length !== 10) return profile.phone;\n    return `+91 ${digits.slice(0, 5)} ${digits.slice(5)}`;\n  }, [isDemoAccount, profile?.phone, profile?.phone_verified]);",
          )
          text = text.replace(
            "    if (!connection?.configured || !connection.waNumber) return;",
            "    if (!connection?.waNumber) return;",
          )

          old_block = """      <div className={`mb-6 rounded-2xl border p-5 ${connection?.configured ? 'border-success/25 bg-success/5' : 'border-error/25 bg-error/5'}`}>
        <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
          <div className="flex items-start gap-3">
            <div className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${connection?.configured ? 'bg-success text-white' : 'bg-muted text-muted-foreground'}`}>
              <Icon name={connection === null ? 'ArrowPathIcon' : 'ChatBubbleLeftRightIcon'} size={21} className={connection === null ? 'animate-spin' : ''} />
            </div>
            <div>
              <p className="text-sm font-800 text-foreground">
                {connection === null
                  ? 'Checking WhatsApp connection…'
                  : connection.configured
                    ? `FabricTrad Upload Bot · ${connection.displayNumber}`
                    : 'WhatsApp Business upload is not connected'}
              </p>
              <p className="mt-1 max-w-2xl text-xs leading-5 text-muted-foreground">
                {connection?.configured
                  ? `Send the parent details and up to any number of colour blocks. Photos and text sent by the same verified seller number within ${connection.pairingWindowMinutes} minutes are paired automatically.`
                  : 'A real Meta WhatsApp Business number and webhook credentials must be connected before external messages can be received.'}
              </p>
            </div>
          </div>
          <button type="button" onClick={openWhatsApp} disabled={!connection?.configured || !connection.waNumber} className="btn-primary inline-flex items-center justify-center gap-2 rounded-xl px-5 py-3 text-sm disabled:cursor-not-allowed disabled:opacity-50">
            <Icon name="PaperAirplaneIcon" size={16} /> Open connected WhatsApp
          </button>
        </div>
      </div>

      {isDemoAccount && (
        <div className="mb-6 rounded-2xl border border-warning/30 bg-warning/5 p-4 text-xs leading-5 text-muted-foreground">
          The shared demo seller cannot bind a private WhatsApp number. Use a real seller account with
          the same verified phone number that sends the catalogue messages.
        </div>
      )}
"""
          new_block = """      <div className="mb-6 rounded-2xl border border-success/25 bg-success/5 p-5">
        <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
          <div className="flex items-start gap-3">
            <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-success text-white">
              <Icon name={connection === null ? 'ArrowPathIcon' : 'ChatBubbleLeftRightIcon'} size={21} className={connection === null ? 'animate-spin' : ''} />
            </div>
            <div>
              <div className="flex flex-wrap items-center gap-2">
                <p className="text-sm font-800 text-foreground">Official FabricTrad catalogue WhatsApp</p>
                <span className={`rounded-full px-2.5 py-1 text-[10px] font-800 ${connection?.configured ? 'bg-success/15 text-success' : 'bg-warning/15 text-warning'}`}>
                  {connection === null ? 'Checking automation…' : connection.configured ? 'Automatic sync active' : 'Official number · automation setup pending'}
                </span>
              </div>
              <p className="mt-1 text-lg font-800 text-success">
                {connection?.displayNumber || OFFICIAL_WHATSAPP_DISPLAY_NUMBER}
              </p>
              <p className="mt-1 max-w-2xl text-xs leading-5 text-muted-foreground">
                Send the parent fabric details, colour/design blocks and photos to this number from the
                same WhatsApp number verified on your FabricTrad seller account.
              </p>
              {connection !== null && !connection.configured && (
                <p className="mt-1 text-xs leading-5 text-warning">
                  The official chat link is available. Automatic website publishing will activate as soon
                  as the Meta webhook credentials and database connection are completed.
                </p>
              )}
            </div>
          </div>
          <button type="button" onClick={openWhatsApp} disabled={!connection?.waNumber} className="btn-primary inline-flex items-center justify-center gap-2 rounded-xl px-5 py-3 text-sm disabled:cursor-not-allowed disabled:opacity-50">
            <Icon name="PaperAirplaneIcon" size={16} /> Open WhatsApp
          </button>
        </div>
      </div>

      <div className="mb-6 rounded-2xl border border-primary/20 bg-primary/5 p-4">
        <div className="flex items-start gap-3">
          <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary">
            <Icon name="ShieldCheckIcon" size={18} />
          </div>
          <div>
            <p className="text-sm font-800 text-foreground">Catalogue ownership is automatic</p>
            <p className="mt-1 text-xs leading-5 text-muted-foreground">
              When anyone sends catalogue information to {connection?.displayNumber || OFFICIAL_WHATSAPP_DISPLAY_NUMBER},
              FabricTrad matches the sender's WhatsApp number with the verified phone number on a seller
              account. The complete parent fabric and all its colour/design variations are added only to
              that matched seller's dashboard and customer catalogue.
            </p>
            <p className="mt-2 text-xs font-800 text-primary">
              Your account match: {accountPhone || 'verify your own seller phone number before sending'}
            </p>
          </div>
        </div>
      </div>
"""
          if old_block not in text:
            raise SystemExit('WhatsApp status block was not found')
          text = text.replace(old_block, new_block)
          text = text.replace(
            "disabled={!connection?.configured || !parsedPreview}",
            "disabled={!connection?.waNumber || !parsedPreview}",
          )
          ui.write_text(text)

          env_file = Path('.env.example')
          text = env_file.read_text()
          text = text.replace('WHATSAPP_DISPLAY_NUMBER=', 'WHATSAPP_DISPLAY_NUMBER=+91 92244 47024')
          env_file.write_text(text)

          wrangler = Path('wrangler.jsonc')
          text = wrangler.read_text()
          old = '  "assets": {'
          new = '  "vars": {\n    "WHATSAPP_DISPLAY_NUMBER": "+91 92244 47024"\n  },\n  "assets": {'
          if old not in text:
            raise SystemExit('wrangler assets block was not found')
          wrangler.write_text(text.replace(old, new, 1))

          deploy = Path('.github/workflows/deploy-cloudflare.yml')
          text = deploy.read_text()
          text = text.replace(
            "      WHATSAPP_GRAPH_API_VERSION: v25.0\n",
            "      WHATSAPP_GRAPH_API_VERSION: v25.0\n      WHATSAPP_DISPLAY_NUMBER: '+91 92244 47024'\n",
            1,
          )
          text = text.replace("           WHATSAPP_DISPLAY_NUMBER: ${{ secrets.WHATSAPP_DISPLAY_NUMBER }}\n", '')
          text = text.replace("             WHATSAPP_PHONE_NUMBER_ID \\\n             WHATSAPP_DISPLAY_NUMBER; do", "             WHATSAPP_PHONE_NUMBER_ID; do")
          text = text.replace("             && [ -n \"$WHATSAPP_PHONE_NUMBER_ID\" ] \\\n             && [ -n \"$WHATSAPP_DISPLAY_NUMBER\" ]; then", "             && [ -n \"$WHATSAPP_PHONE_NUMBER_ID\" ]; then")
          deploy.write_text(text)

          quality = Path('.github/workflows/quality.yml')
          text = quality.read_text()
          text = text.replace(
            "          whatsapp_status='src/app/api/whatsapp/catalog/status/route.ts'\n",
            "          whatsapp_status='src/app/api/whatsapp/catalog/status/route.ts'\n          whatsapp_config='src/lib/whatsappConfig.ts'\n",
            1,
          )
          text = text.replace(
            "          grep -Fq 'supportsVariants: true' \"$whatsapp_status\"\n",
            "          grep -Fq 'supportsVariants: true' \"$whatsapp_status\"\n          grep -Fq \"accountMatching: 'verified-seller-phone'\" \"$whatsapp_status\"\n          grep -Fq \"OFFICIAL_WHATSAPP_DISPLAY_NUMBER = '+91 92244 47024'\" \"$whatsapp_config\"\n          grep -Fq 'Catalogue ownership is automatic' \"$whatsapp_ui\"\n          grep -Fq \"sender's WhatsApp number\" \"$whatsapp_ui\"\n",
            1,
          )
          text = text.replace(
            "          if grep -Fq '98765 00001' \"$whatsapp_ui\"; then",
            "          if grep -Fq 'WhatsApp Business upload is not connected' \"$whatsapp_ui\"; then\n            echo 'The official number is still hidden behind a disconnected state.'\n            exit 1\n          fi\n          if grep -Fq '98765 00001' \"$whatsapp_ui\"; then",
            1,
          )
          quality.write_text(text)
          PY

          rm -f .github/workflows/official-whatsapp-account-link-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Publish official WhatsApp number and account matching'
          git push origin HEAD:agent/official-whatsapp-account-link
