# This workflow rebuilds a THROWAWAY local database from the migration files and
# checks the result. It never touches production. There is no `supabase db push`,
# no `--linked` and no production database password anywhere in this repository,
# so a green run here means the SQL is valid -- not that production has it.
#
# On 2026-09-10 that distinction cost a day: a migration adding the delivered/
# bounced/complained invoice states passed here, was believed shipped, and was
# still absent from production hours later. Applying to production is a manual
# step; the job summary below states so on every run.
name: Validate Supabase migrations (does not deploy)

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database-migrations.yml'
      - 'scripts/test-invoice-database.sql'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database-migrations.yml'
      - 'scripts/test-invoice-database.sql'
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '47 3 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read

jobs:
  reset-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            npx --yes supabase@latest init
          fi

      - name: Start minimal local Supabase stack
        run: >-
          npx --yes supabase@latest start
          -x studio,imgproxy,inbucket,realtime,edge-runtime,logflare,vector,supavisor

      - name: Rebuild database from all migrations
        run: npx --yes supabase@latest db reset --local --no-seed

      - name: Verify launch-critical schema
        shell: bash
        run: |
          set -euo pipefail
          db_url=$(npx --yes supabase@latest status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')
          test -n "$db_url"
          psql "$db_url" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE required_table text; required_function text;
          BEGIN
            FOREACH required_table IN ARRAY ARRAY['user_profiles','seller_profiles','buyer_profiles','catalog_order_requests','catalog_order_payments','seller_product_media','seller_tax_invoices','seller_payout_requests','seller_payout_accounts','marketplace_checkout_leases'] LOOP
              IF to_regclass('public.' || required_table) IS NULL THEN
                RAISE EXCEPTION 'Required table is missing: %', required_table;
              END IF;
            END LOOP;
            FOREACH required_function IN ARRAY ARRAY['is_admin','submit_seller_registration_with_nonce','seller_decide_catalog_order','save_my_manual_shipment','reconcile_marketplace_payment','record_marketplace_refund','claim_seller_whatsapp_job','admin_marketplace_totals','claim_marketplace_checkout','reconcile_marketplace_route_transfer'] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname=required_function) THEN
                RAISE EXCEPTION 'Required function is missing: %', required_function;
              END IF;
            END LOOP;
          END $$;
          SQL

      - name: Verify invoice generation and buyer/seller isolation
        shell: bash
        run: |
          set -euo pipefail
          db_url=$(npx --yes supabase@latest status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')
          test -n "$db_url"
          psql "$db_url" -v ON_ERROR_STOP=1 -f scripts/test-invoice-database.sql

      - name: Stop local Supabase stack
        if: always()
        run: npx --yes supabase@latest stop --no-backup || true

      # A passing run above proves only that the SQL rebuilds a local database.
      # Say so on the run's own summary page, next to the green tick, so nobody
      # reads this workflow as a deployment.
      - name: State that production was not touched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Migrations were NOT applied to production'
            echo
            echo 'This workflow rebuilds a throwaway local database and checks the result.'
            echo 'It contains no `supabase db push`, no `--linked`, and no production'
            echo 'database credentials. A green tick means the SQL is valid, not that'
            echo '`rdhfwlzhcvwjhkxhhpoo` has it.'
            echo
            echo 'Migration files currently in the repository:'
            echo
            echo '```'
            ls -1 supabase/migrations | tail -5
            echo '```'
            echo
            echo 'To apply pending migrations to production, run locally:'
            echo
            echo '```bash'
            echo 'npx supabase link --project-ref rdhfwlzhcvwjhkxhhpoo'
            echo 'npx supabase db push'
            echo '```'
            echo
            echo 'Then confirm with a schema query before assuming it landed.'
          } >> "$GITHUB_STEP_SUMMARY"
