name: Apply catalog media preview fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply preview fix when needed
        shell: bash
        run: |
          if grep -q 'attachmentUrlsRef.current = attachments.map' src/app/seller-dashboard/components/SellerCatalogAssistant.tsx; then
            echo 'Preview fix already applied.'
            exit 0
          fi
          node scripts/fix-catalog-media-preview.mjs
          git config user.name 'FabricTrad Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/seller-dashboard/components/SellerCatalogAssistant.tsx
          git commit -m 'Keep catalog media previews stable [preview-fix]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
