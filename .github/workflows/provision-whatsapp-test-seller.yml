name: Provision WhatsApp test seller

on:
  pull_request:
  push:
    branches:
      - agent/run-secure-seller-provisioning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InJkaGZ3bHpoY3Z3amhreGhocG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMzMwNjMsImV4cCI6MjA5OTcwOTA2M30.jLF4AD-joIbRslei-T55lwZBdRpntrsU-hjyHCZXgVc
      SELLER_CREDENTIALS_OUTPUT: /tmp/whatsapp-test-seller.enc.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Supabase client
        run: npm install --silent --no-audit --no-fund --package-lock=false --legacy-peer-deps
      - name: Create seller through normal signup and verify when possible
        id: provision
        continue-on-error: true
        shell: bash
        run: node scripts/provision-whatsapp-test-seller.mjs > /tmp/provision.log 2>&1
      - name: Report provisioning failure
        if: steps.provision.outcome != 'success'
        shell: bash
        run: |
          echo 'Seller provisioning failed:'
          tail -n 30 /tmp/provision.log
          exit 1
      - name: Upload encrypted credentials
        if: steps.provision.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-test-seller-encrypted-credentials
          path: /tmp/whatsapp-test-seller.enc.json
          if-no-files-found: error
          retention-days: 1
