name: Provision WhatsApp test seller

on:
  pull_request:
  push:
    branches:
      - agent/run-secure-seller-provisioning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SELLER_CREDENTIALS_OUTPUT: /tmp/whatsapp-test-seller.enc.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve current Supabase API keys without printing them
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured.' > /tmp/provision.log
            exit 1
          fi

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Accept: application/json' \
            'https://api.supabase.com/v1/projects/rdhfwlzhcvwjhkxhhpoo/api-keys?reveal=true' \
            > /tmp/supabase-api-keys.json

          anon_key=$(jq -r '[.[] | select((.name | ascii_downcase) == "anon" or .type == "publishable") | .api_key][0] // empty' /tmp/supabase-api-keys.json)
          service_key=$(jq -r '[.[] | select((.name | ascii_downcase) == "service_role" or .type == "secret") | .api_key][0] // empty' /tmp/supabase-api-keys.json)

          if [ -z "$anon_key" ] || [ -z "$service_key" ]; then
            echo 'The Supabase Management API did not return both a public and server API key.' > /tmp/provision.log
            exit 1
          fi

          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"
          rm -f /tmp/supabase-api-keys.json
      - name: Install Supabase client
        run: npm install --silent --no-audit --no-fund --package-lock=false --legacy-peer-deps
      - name: Create and verify seller account
        id: provision
        continue-on-error: true
        shell: bash
        run: node scripts/provision-whatsapp-test-seller.mjs > /tmp/provision.log 2>&1
      - name: Upload provisioning diagnostic
        if: failure() || steps.provision.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-test-seller-provision-diagnostic
          path: /tmp/provision.log
          if-no-files-found: warn
          retention-days: 1
      - name: Report provisioning failure
        if: steps.provision.outcome != 'success'
        shell: bash
        run: |
          echo 'Seller provisioning failed; diagnostic artifact uploaded.'
          exit 1
      - name: Upload encrypted credentials
        if: steps.provision.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-test-seller-encrypted-credentials
          path: /tmp/whatsapp-test-seller.enc.json
          if-no-files-found: error
          retention-days: 1
