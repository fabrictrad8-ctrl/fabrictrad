name: Deploy FabricTrad to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrictrad-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rdhfwlzhcvwjhkxhhpoo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Un2-RQfjGbIiXF3Mb2oGIA_p-Z1kMls
      NEXT_PUBLIC_SITE_URL: https://fabrictrad.com
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: 'true'
      ADMIN_EMAIL: fabrictrad8@gmail.com
      OPENAI_DRAPE_IMAGE_MODEL: gpt-image-2
      OPENAI_DRAPE_IMAGE_SIZE: 1024x1536
      OPENAI_DRAPE_IMAGE_QUALITY: medium
      OPENAI_CATALOG_MODEL: gpt-4.1-mini
      AI_DRAPE_DAILY_LIMIT: '10'
      AI_DRAPE_DEMO_DAILY_LIMIT: '2'
      AI_DRAPE_FALLBACK_DAILY_LIMIT: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps

      - name: Verify Cloudflare token before building
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler whoami --config wrangler.jsonc > /tmp/wrangler-whoami.log 2>&1; then
            cat /tmp/wrangler-whoami.log
            echo '::error::Cloudflare rejected the deployment token. Rotate it and grant Workers Scripts: Edit for the FabricTrad account before retrying.'
            exit 1
          fi
          echo 'Cloudflare deployment token is valid.'

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Apply Supabase migrations when deployment credentials exist
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo '::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is missing. Production schema is managed through the connected Supabase project until CI credentials are added.'
            exit 0
          fi
          npx --yes supabase@latest link \
            --project-ref rdhfwlzhcvwjhkxhhpoo \
            --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest db push \
            --linked \
            --include-all \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Build Cloudflare Worker
        run: npm run build:sites

      - name: Sync server secrets to the Cloudflare Worker
        id: sync_secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          synced=0
          for name in \
            OPENAI_API_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            RAZORPAY_KEY_ID \
            RAZORPAY_KEY_SECRET \
            RAZORPAY_WEBHOOK_SECRET; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.jsonc
              echo "$name synced to the FabricTrad Worker."
              synced=$((synced + 1))
            fi
          done

          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'openai_requested=true' >> "$GITHUB_OUTPUT"
          else
            echo 'openai_requested=false' >> "$GITHUB_OUTPUT"
            echo '::warning::AI Catalog Studio will use the deterministic textile parser until OPENAI_API_KEY is configured.'
          fi

          if [ -n "$RAZORPAY_KEY_ID" ] && [ -n "$RAZORPAY_KEY_SECRET" ] && [ -n "$RAZORPAY_WEBHOOK_SECRET" ]; then
            echo 'razorpay_requested=true' >> "$GITHUB_OUTPUT"
          else
            echo 'razorpay_requested=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Razorpay live checkout remains disabled until all three payment secrets are configured.'
          fi

          echo "Synced $synced optional server secrets."

      - name: Deploy with OpenNext
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deployed=false
          for attempt in 1 2 3; do
            set +e
            npm run deploy:sites 2>&1 | tee /tmp/fabrictrad-cloudflare-deploy.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              deployed=true
              break
            fi

            if grep -Eqi '401 Unauthorized|Authentication error|Invalid API Token|permission denied' /tmp/fabrictrad-cloudflare-deploy.log; then
              echo '::error::Cloudflare rejected the token or its permissions. Do not retry with this credential.'
              exit 1
            fi

            echo "Transient Cloudflare deployment failure on attempt $attempt; retrying."
            sleep $((attempt * 15))
          done

          if [ "$deployed" != 'true' ]; then
            echo '::error::Cloudflare deployment failed after three attempts.'
            exit 1
          fi

      - name: Verify production routes
        shell: bash
        env:
          OPENAI_REQUESTED: ${{ steps.sync_secrets.outputs.openai_requested }}
          RAZORPAY_REQUESTED: ${{ steps.sync_secrets.outputs.razorpay_requested }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 36); do
            home_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/home.html --write-out '%{http_code}' 'https://fabrictrad.com/' || true)
            login_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/login.html --write-out '%{http_code}' 'https://fabrictrad.com/login' || true)
            register_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/register.html --write-out '%{http_code}' 'https://fabrictrad.com/register' || true)
            marketplace_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/marketplace.html --write-out '%{http_code}' 'https://fabrictrad.com/marketplace' || true)
            catalog_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/catalog-assistant-status.json --write-out '%{http_code}' 'https://fabrictrad.com/api/catalog-assistant/parse' || true)
            drape_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/ai-drape-status.json --write-out '%{http_code}' 'https://fabrictrad.com/api/ai/drape-on' || true)
            retired_whatsapp_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /tmp/retired-whatsapp.txt --write-out '%{http_code}' 'https://fabrictrad.com/api/whatsapp/catalog/status' || true)

            if [ "$home_status" = '200' ] \
              && [ "$login_status" = '200' ] \
              && [ "$register_status" = '200' ] \
              && [ "$marketplace_status" = '200' ] \
              && [ "$catalog_status" = '200' ] \
              && [ "$drape_status" = '200' ] \
              && [ "$retired_whatsapp_status" = '404' ]; then
              ready=true
              break
            fi

            echo "Attempt $attempt: waiting for production routes (home=$home_status login=$login_status register=$register_status marketplace=$marketplace_status catalog=$catalog_status drape=$drape_status retired-whatsapp=$retired_whatsapp_status)"
            sleep 10
          done

          if [ "$ready" != 'true' ]; then
            echo '::error::Production route verification failed.'
            exit 1
          fi

          grep -q '"available":true' /tmp/catalog-assistant-status.json
          grep -q 'deterministic textile parser' /tmp/catalog-assistant-status.json

          if [ "$OPENAI_REQUESTED" = 'true' ]; then
            grep -q '"aiConfigured":true' /tmp/catalog-assistant-status.json
            grep -q '"configured":true' /tmp/ai-drape-status.json
          elif ! grep -q '"aiConfigured":true' /tmp/catalog-assistant-status.json; then
            echo '::warning::The catalogue assistant is live with its built-in parser; OpenAI extraction is not configured.'
          fi

          if [ "$RAZORPAY_REQUESTED" != 'true' ]; then
            echo '::warning::Public commerce routes are live, but payment checkout must remain unavailable until Razorpay secrets are configured.'
          fi

          echo 'FabricTrad production routes, unified registration, catalogue assistant and retired WhatsApp route are verified.'
