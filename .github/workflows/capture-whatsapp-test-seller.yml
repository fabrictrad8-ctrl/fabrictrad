name: Capture encrypted WhatsApp test seller credentials

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture encrypted credential receipt
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 4); do
            status=$(curl --silent --show-error --connect-timeout 10 --max-time 45 \
              --output /tmp/whatsapp-test-seller-receipt.json \
              --write-out '%{http_code}' \
              'https://fabrictrad.com/api/internal/provision-whatsapp-test-seller' || true)

            if [ "$status" = '200' ] \
              && jq -e '.created == true and .receipt.encryptedKey and .receipt.ciphertext' \
                /tmp/whatsapp-test-seller-receipt.json >/dev/null; then
              ready=true
              break
            fi

            echo "Attempt $attempt: provisioning route returned HTTP $status."
            sleep 10
          done

          if [ "$ready" != 'true' ]; then
            echo '::error::Unable to obtain the encrypted seller credential receipt.'
            cat /tmp/whatsapp-test-seller-receipt.json 2>/dev/null || true
            exit 1
          fi

          jq '.receipt' /tmp/whatsapp-test-seller-receipt.json \
            > /tmp/whatsapp-test-seller-encrypted.json
          echo 'Encrypted seller credential receipt captured.'

      - name: Upload encrypted credential receipt
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-test-seller-encrypted-credentials
          path: /tmp/whatsapp-test-seller-encrypted.json
          if-no-files-found: error
          retention-days: 1
